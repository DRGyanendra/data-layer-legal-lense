    court's judgement was perverse and had failed to consider material evidence related to the charges.
  source: IndicLegalQA
  file: 2018_menoka_malik_v_state_of_west_bengal_2018_10_707_725.pdf
- query: What was the Supreme Court's direction to the High Court regarding the case?
  case_id: menoka_malik_2018
  paragraphs: []
