  source: IndicLegalQA
  file: 2018_menoka_malik_v_state_of_west_bengal_2018_10_707_725.pdf
- query: What was the Supreme Court's view on the testimony of the witnesses?
  case_id: menoka_malik_2018
  paragraphs: []
  answer: The Supreme Court found that the testimonies of the witnesses were consistent on material facts and that the presence
    of the witnesses on the spot had not been seriously doubted by the defence during cross-examination.
  source: IndicLegalQA
  file: 2018_menoka_malik_v_state_of_west_bengal_2018_10_707_725.pdf
- query: What was the main issue in the case of Jahir Hak vs The State of Rajasthan?
  case_id: jahir_hak_2022
  paragraphs: []
  answer: The main issue was whether Jahir Hak, who had been in custody for almost 8 years as an undertrial prisoner for offences
    under the Unlawful Activities (Prevention) Act, 1967, should be granted bail.
  source: IndicLegalQA
  file: 2022_jahir_hak_v_state_of_rajasthan_2022_3_101_106.pdf
- query: What were the charges against Jahir Hak in this case?
  case_id: jahir_hak_2022
  paragraphs: []
  answer: Jahir Hak was charged under Sections 10, 13, 15, 16, 17, 18, 18A, 18B, 19, 20, 23, and 38 of the Unlawful Activities
    (Prevention) Act, 1967.
  source: IndicLegalQA
  file: 2022_jahir_hak_v_state_of_rajasthan_2022_3_101_106.pdf
- query: How long had Jahir Hak been in custody before the appeal was decided?
  case_id: jahir_hak_2022
  paragraphs: []
  answer: Jahir Hak had been in custody for almost 8 years before the appeal was decided.
  source: IndicLegalQA
  file: 2022_jahir_hak_v_state_of_rajasthan_2022_3_101_106.pdf
- query: What was the status of the trial at the time of the appeal?
  case_id: jahir_hak_2022
  paragraphs: []
  answer: At the time of the appeal, only 6 out of 109 witnesses had been examined, and the trial was expected to take at
    least 2 to 3 more years to conclude.
  source: IndicLegalQA
  file: 2022_jahir_hak_v_state_of_rajasthan_2022_3_101_106.pdf
- query: What was the appellant's argument for seeking bail?
  case_id: jahir_hak_2022
  paragraphs: []
  answer: The appellant argued that he had already been in custody for an extended period, the trial was progressing very
    slowly, and there was no significant evidence against him from the examined witnesses.
  source: IndicLegalQA
  file: 2022_jahir_hak_v_state_of_rajasthan_2022_3_101_106.pdf
- query: What was the State's response to the appellant's request for bail?
  case_id: jahir_hak_2022
  paragraphs: []
  answer: The State argued that the offences were serious, and there was a need to protect witnesses who would testify during
    the trial. However, the State did not dispute that the examined witnesses' testimonies did not implicate the appellant.
  source: IndicLegalQA
  file: 2022_jahir_hak_v_state_of_rajasthan_2022_3_101_106.pdf
- query: What precedent did the court consider while making its decision?
  case_id: jahir_hak_2022
  paragraphs: []
  answer: The court considered the precedent set in Union of India v. K. A. Najeeb (2021), where the Supreme Court granted
    bail to an accused who had been in jail for an extended period with little possibility of early completion of the trial.
  source: IndicLegalQA
  file: 2022_jahir_hak_v_state_of_rajasthan_2022_3_101_106.pdf
- query: What was the court's decision in the case of Jahir Hak vs The State of Rajasthan?
  case_id: jahir_hak_2022
  paragraphs: []
  answer: The court decided to grant bail to Jahir Hak, considering the long period of incarceration he had already undergone
    and the slow progress of the trial.
  source: IndicLegalQA
  file: 2022_jahir_hak_v_state_of_rajasthan_2022_3_101_106.pdf
- query: What conditions did the court impose while granting bail to Jahir Hak?
  case_id: jahir_hak_2022
  paragraphs: []
  answer: The court directed that the appellant be released on bail subject to conditions that would be fixed by the trial
    court.
  source: IndicLegalQA
  file: 2022_jahir_hak_v_state_of_rajasthan_2022_3_101_106.pdf
- query: Did the court's observations affect the trial's outcome?
  case_id: jahir_hak_2022
  paragraphs: []
  answer: The court clarified that its observations were made for the purpose of deciding the bail application and that the
    trial court would decide the case based on evidence and in accordance with the law.
  source: IndicLegalQA
  file: 2022_jahir_hak_v_state_of_rajasthan_2022_3_101_106.pdf
- query: Why did the court grant bail to Jahir Hak despite the serious charges against him?
  case_id: jahir_hak_2022
  paragraphs: []
  answer: The court granted bail due to the appellant's long period of incarceration as an undertrial prisoner, the slow progress
    of the trial, and the fact that the evidence so far did not strongly implicate him.
  source: IndicLegalQA
  file: 2022_jahir_hak_v_state_of_rajasthan_2022_3_101_106.pdf
- query: What were the charges against Irfan @ Naka in this case?
  case_id: irfan_naka_2023
  paragraphs: []
  answer: Irfan @ Naka was charged with offenses under Sections 302, 436, and 326-A of the Indian Penal Code for the murder
    of his son Islamuddin, and his brothers Naushad and Irshad by setting them on fire.
  source: IndicLegalQA
  file: 2023_irfan_naka_v_state_of_uttar_pradesh_2023_11_789_821.pdf
- query: What was the main ground for the appeal by Irfan @ Naka?
  case_id: irfan_naka_2023
  paragraphs: []
  answer: Irfan @ Naka appealed against the judgement and order of the High Court of Allahabad which confirmed the death sentence
    awarded to him by the Additional Sessions Judge for the murders.
  source: IndicLegalQA
  file: 2023_irfan_naka_v_state_of_uttar_pradesh_2023_11_789_821.pdf
- query: What was the relationship between Irfan @ Naka and the victims?
  case_id: irfan_naka_2023
  paragraphs: []
  answer: Irfan @ Naka was the father of one of the victims, Islamuddin, and the brother of the other two victims, Naushad
    and Irshad.
  source: IndicLegalQA
  file: 2023_irfan_naka_v_state_of_uttar_pradesh_2023_11_789_821.pdf
- query: What was the prosecution's case against Irfan @ Naka?
  case_id: irfan_naka_2023
  paragraphs: []
  answer: The prosecution alleged that Irfan @ Naka had a strained relationship with the victims, particularly due to his
    second marriage, and on the night of 5th August 2014, he set fire to the room where the victims were sleeping, causing
    their deaths.
  source: IndicLegalQA
  file: 2023_irfan_naka_v_state_of_uttar_pradesh_2023_11_789_821.pdf
- query: What evidence was presented by the prosecution to support their case?
  case_id: irfan_naka_2023
  paragraphs: []
  answer: The prosecution presented eyewitness testimonies from family members, dying declarations of the victims, and forensic
    evidence showing the presence of an inflammable substance used to start the fire.
  source: IndicLegalQA
  file: 2023_irfan_naka_v_state_of_uttar_pradesh_2023_11_789_821.pdf
- query: What were the contents of the dying declarations made by the victims?
  case_id: irfan_naka_2023
  paragraphs: []
  answer: In their dying declarations, Irshad and Islamuddin stated that Irfan @ Naka locked the door from outside and set
    the room on fire with an inflammable substance, leading to their severe burn injuries and eventual deaths.
  source: IndicLegalQA
  file: 2023_irfan_naka_v_state_of_uttar_pradesh_2023_11_789_821.pdf
- query: What were the main arguments presented by Irfan @ Naka's defense?
  case_id: irfan_naka_2023
  paragraphs: []
  answer: The defense argued that the dying declarations were unreliable, that the evidence was circumstantial, and that Irfan
    @ Naka was falsely implicated due to family disputes over property.
  source: IndicLegalQA
  file: 2023_irfan_naka_v_state_of_uttar_pradesh_2023_11_789_821.pdf
- query: How did the Supreme Court view the reliability of the dying declarations?
  case_id: irfan_naka_2023
  paragraphs: []
  answer: The Supreme Court found that the dying declarations were not reliable as they did not inspire confidence and were
    inconsistent with other evidence presented in the case.
  source: IndicLegalQA
  file: 2023_irfan_naka_v_state_of_uttar_pradesh_2023_11_789_821.pdf
- query: What was the Supreme Court's final decision in this case?
  case_id: irfan_naka_2023
  paragraphs: []
  answer: The Supreme Court acquitted Irfan @ Naka of all charges, stating that the prosecution failed to prove his guilt
    beyond reasonable doubt and that the benefit of doubt should go to the accused.
  source: IndicLegalQA
  file: 2023_irfan_naka_v_state_of_uttar_pradesh_2023_11_789_821.pdf
- query: What was the Supreme Court's directive regarding the release of Irfan @ Naka?
  case_id: irfan_naka_2023
  paragraphs: []
  answer: The Supreme Court directed that Irfan @ Naka be released forthwith unless he was required to be detained in connection
    with any other case or cases.
  source: IndicLegalQA
  file: 2023_irfan_naka_v_state_of_uttar_pradesh_2023_11_789_821.pdf
- query: What was the primary legal issue in the case of The State Through Central Bureau of Investigation vs T. Gangi Reddy
    @ Yerra Gangi Reddy?
  case_id: the_state_2023
  paragraphs: []
  answer: The primary legal issue was whether the bail granted to the accused under Section 167(2) of the Cr.P.C. could be
    cancelled on merits after the filing of the chargesheet.
  source: IndicLegalQA
  file: 2023_state_central_bureau_of_inve_v_t_gangi_reddy_yerra_gangi_re_2023_1_741_764.pdf
- query: What were the charges against T. Gangi Reddy @ Yerra Gangi Reddy?
  case_id: the_state_2023
  paragraphs: []
  answer: The charges against T. Gangi Reddy included conspiracy to murder, tampering with evidence, and threatening witnesses
    in the case related to the death of Y.S. Vivekananda Reddy.
  source: IndicLegalQA
  file: 2023_state_central_bureau_of_inve_v_t_gangi_reddy_yerra_gangi_re_2023_1_741_764.pdf
- query: What was the High Court's decision regarding the bail granted to T. Gangi Reddy?
  case_id: the_state_2023
  paragraphs: []
  answer: The High Court dismissed the CBI's petition to cancel the bail granted to T. Gangi Reddy, stating that once default
    bail is granted under Section 167(2) Cr.P.C., it cannot be cancelled on merits.
  source: IndicLegalQA
  file: 2023_state_central_bureau_of_inve_v_t_gangi_reddy_yerra_gangi_re_2023_1_741_764.pdf
- query: What was the Supreme Court's view on the High Court's decision to not cancel the default bail?
  case_id: the_state_2023
  paragraphs: []
  answer: The Supreme Court disagreed with the High Court, stating that default bail granted under Section 167(2) Cr.P.C.
    can be cancelled on merits if the chargesheet reveals serious offences.
  source: IndicLegalQA
  file: 2023_state_central_bureau_of_inve_v_t_gangi_reddy_yerra_gangi_re_2023_1_741_764.pdf
- query: What significant legal principle did the Supreme Court emphasize in this case?
  case_id: the_state_2023
  paragraphs: []
  answer: The Supreme Court emphasized that bail granted on the ground of default due to non-completion of investigation within
    the stipulated time can be cancelled if strong grounds are made out from the chargesheet.
  source: IndicLegalQA
  file: 2023_state_central_bureau_of_inve_v_t_gangi_reddy_yerra_gangi_re_2023_1_741_764.pdf
- query: What procedural error did the Supreme Court identify in the High Court's handling of the bail cancellation?
  case_id: the_state_2023
  paragraphs: []
  answer: The Supreme Court identified that the High Court erred by not considering the merits of the case when dismissing
    the CBI's petition to cancel the bail.
  source: IndicLegalQA
  file: 2023_state_central_bureau_of_inve_v_t_gangi_reddy_yerra_gangi_re_2023_1_741_764.pdf
- query: What was the background of the criminal case against T. Gangi Reddy?
  case_id: the_state_2023
  paragraphs: []
  answer: The background involved the murder of Y.S. Vivekananda Reddy, a former MLA and MP, whose death led to the registration
    of a case initially under Section 174 Cr.P.C., later reclassified under Section 302 read with Section 120-B IPC.
  source: IndicLegalQA
  file: 2023_state_central_bureau_of_inve_v_t_gangi_reddy_yerra_gangi_re_2023_1_741_764.pdf
- query: How did the Supreme Court view the subsequent investigation and filing of the chargesheet by the CBI?
  case_id: the_state_2023
  paragraphs: []
  answer: The Supreme Court noted that the CBI's chargesheet revealed a well-planned conspiracy involving the accused, justifying
    the cancellation of bail on merits.
  source: IndicLegalQA
  file: 2023_state_central_bureau_of_inve_v_t_gangi_reddy_yerra_gangi_re_2023_1_741_764.pdf
- query: What did the Supreme Court decide regarding the future proceedings of this case?
  case_id: the_state_2023
  paragraphs: []
  answer: The Supreme Court remitted the matter to the High Court of Telangana to consider the CBI's application for cancellation
    of bail afresh on merits.
  source: IndicLegalQA
  file: 2023_state_central_bureau_of_inve_v_t_gangi_reddy_yerra_gangi_re_2023_1_741_764.pdf
- query: What did the Supreme Court direct regarding the transfer of the case proceedings?
  case_id: the_state_2023
  paragraphs: []
  answer: The Supreme Court directed that the proceedings for the cancellation of bail be transferred from the High Court
    of Andhra Pradesh at Amravati to the High Court of Telangana at Hyderabad.
  source: IndicLegalQA
  file: 2023_state_central_bureau_of_inve_v_t_gangi_reddy_yerra_gangi_re_2023_1_741_764.pdf
- query: What clarifying statement did the Supreme Court make regarding the nature of default bail under Section 167(2) Cr.P.C.?
  case_id: the_state_2023
  paragraphs: []
  answer: The Supreme Court clarified that default bail under Section 167(2) Cr.P.C. is not granted on merits but due to the
    failure of the investigating agency to complete the investigation within the prescribed time, and can be cancelled on
    merits if strong grounds are made out.
  source: IndicLegalQA
  file: 2023_state_central_bureau_of_inve_v_t_gangi_reddy_yerra_gangi_re_2023_1_741_764.pdf
- query: What was the primary legal issue in the case of M.D. Jain vs Bhagyavathi & Ors.?
  case_id: the_greater_bombay_co_operative_bank_2017
  paragraphs: []
  answer: The primary legal issue was whether M.D. Jain should be discharged in a pending contempt proceeding where he was
    accused of tampering with court documents.
  source: IndicLegalQA
  file: 2017_greater_bombay_co_operative__v_mr_nagraj_ganeshmal_jain_2017_6_437_443.pdf
- query: Who made the complaint against M.D. Jain, and what were the allegations?
  case_id: the_greater_bombay_co_operative_bank_2017
  paragraphs: []
  answer: The complaint was made by Bhagyavathi Jain, the former wife of M.D. Jain, alleging that M.D. Jain, in collusion
    with the court staff, had tampered with the court documents.
  source: IndicLegalQA
  file: 2017_greater_bombay_co_operative__v_mr_nagraj_ganeshmal_jain_2017_6_437_443.pdf
- query: What was the conclusion of the CBI investigation regarding the tampering of documents?
  case_id: the_greater_bombay_co_operative_bank_2017
  paragraphs: []
  answer: The CBI investigation concluded that there was no evidence, even circumstantial, against M.D. Jain and others regarding
    the removal, tampering, and substitution of documents, and that the complaints made by Bhagyavathi Jain were false.
  source: IndicLegalQA
  file: 2017_greater_bombay_co_operative__v_mr_nagraj_ganeshmal_jain_2017_6_437_443.pdf
- query: What did the CBI report say about the conduct of the court staff?
  case_id: the_greater_bombay_co_operative_bank_2017
  paragraphs: []
  answer: The CBI report indicated that the court staff, particularly Shri Venkatachalam, failed to properly safeguard the
    case files, which facilitated the removal of documents, but there was no sufficient evidence to establish any cognizable
    offence.
  source: IndicLegalQA
  file: 2017_greater_bombay_co_operative__v_mr_nagraj_ganeshmal_jain_2017_6_437_443.pdf
- query: What was the High Court's view on the CBI inquiry and its impact on the contempt proceedings?
  case_id: the_greater_bombay_co_operative_bank_2017
  paragraphs: []
  answer: The High Court was of the view that the CBI inquiry was directed only against the court staff and that the filing
    of the 'B' report by the CBI could be used by the accused at the final hearing of the case.
  source: IndicLegalQA
  file: 2017_greater_bombay_co_operative__v_mr_nagraj_ganeshmal_jain_2017_6_437_443.pdf
- query: What mistake did the Supreme Court identify in the High Court's handling of the CBI report?
  case_id: the_greater_bombay_co_operative_bank_2017
  paragraphs: []
  answer: The Supreme Court identified that the High Court mistakenly viewed the CBI inquiry as being limited to the court
    staff, whereas the CBI report exonerated M.D. Jain, the appellant, from any involvement in the alleged tampering.
  source: IndicLegalQA
  file: 2017_greater_bombay_co_operative__v_mr_nagraj_ganeshmal_jain_2017_6_437_443.pdf
- query: What was the Supreme Court's decision regarding the appeal filed by M.D. Jain?
  case_id: the_greater_bombay_co_operative_bank_2017
  paragraphs: []
  answer: The Supreme Court set aside the impugned order of the High Court and allowed the appeal, requesting the High Court
    to reconsider the matter afresh in light of the CBI report exonerating M.D. Jain.
  source: IndicLegalQA
  file: 2017_greater_bombay_co_operative__v_mr_nagraj_ganeshmal_jain_2017_6_437_443.pdf
- query: What was the role of Shri Venkatachalam in the case according to the CBI report?
  case_id: the_greater_bombay_co_operative_bank_2017
  paragraphs: []
  answer: Shri Venkatachalam was the custodian of the case files and was found by the CBI to have not taken proper care in
    safeguarding them, which facilitated the removal of documents.
  source: IndicLegalQA
  file: 2017_greater_bombay_co_operative__v_mr_nagraj_ganeshmal_jain_2017_6_437_443.pdf
- query: What directive did the Supreme Court issue to the High Court after setting aside its order?
  case_id: the_greater_bombay_co_operative_bank_2017
  paragraphs: []
  answer: The Supreme Court directed the High Court to consider the matter afresh, taking into account the CBI report that
    exonerated M.D. Jain from any wrongdoing.
  source: IndicLegalQA
  file: 2017_greater_bombay_co_operative__v_mr_nagraj_ganeshmal_jain_2017_6_437_443.pdf
- query: What was the primary legal issue in the case of Taijuddin vs State of Assam & Ors.?
  case_id: taijuddin_2021
  paragraphs: []
  answer: The primary legal issue was whether Taijuddin's conviction under Section 149 IPC was justified, given his alleged
    role in pointing out the location of the victim during a mob attack.
  source: IndicLegalQA
  file: 2021_taijuddin_v_state_of_assam_2021_9_444_450.pdf
- query: What were the circumstances that led to the attack on Abdul Wahab?
  case_id: taijuddin_2021
  paragraphs: []
  answer: A land dispute led to the attack. The victim, Abdul Wahab, was attacked by a mob armed with lathis, spears, and
    daggers while he was trying to escape and hide in a house.
  source: IndicLegalQA
  file: 2021_taijuddin_v_state_of_assam_2021_9_444_450.pdf
- query: What role was Taijuddin accused of playing in the mob attack on Abdul Wahab?
  case_id: taijuddin_2021
  paragraphs: []
  answer: Taijuddin was accused of pointing out the house where Abdul Wahab was hiding, which led the mob to find and kill
    him.
  source: IndicLegalQA
  file: 2021_taijuddin_v_state_of_assam_2021_9_444_450.pdf
- query: What did the High Court decide regarding Taijuddin's conviction?
  case_id: taijuddin_2021
  paragraphs: []
  answer: The High Court upheld Taijuddin's conviction under Section 149 IPC based on the testimony that he pointed out the
    location of the victim to the mob.
  source: IndicLegalQA
  file: 2021_taijuddin_v_state_of_assam_2021_9_444_450.pdf
- query: What was the key evidence against Taijuddin presented by the prosecution?
  case_id: taijuddin_2021
  paragraphs: []
  answer: The key evidence against Taijuddin was the testimony of witnesses who stated that he pointed out the location of
    the victim, Abdul Wahab, to the mob.
  source: IndicLegalQA
  file: 2021_taijuddin_v_state_of_assam_2021_9_444_450.pdf
- query: How did the Supreme Court view the reliability of the witness testimonies against Taijuddin?
  case_id: taijuddin_2021
  paragraphs: []
  answer: The Supreme Court noted inconsistencies in the testimonies and highlighted that some key witnesses did not mention
    Taijuddin at all, casting doubt on the reliability of the evidence against him.
  source: IndicLegalQA
  file: 2021_taijuddin_v_state_of_assam_2021_9_444_450.pdf
- query: What was the Supreme Court's decision regarding Taijuddin's conviction?
  case_id: taijuddin_2021
  paragraphs: []
  answer: The Supreme Court set aside Taijuddin's conviction under Sections 147, 148, 302, 201, and 149 IPC, stating that
    there was insufficient evidence to prove his involvement beyond reasonable doubt.
  source: IndicLegalQA
  file: 2021_taijuddin_v_state_of_assam_2021_9_444_450.pdf
- query: What precedent did the Supreme Court refer to in its judgment?
  case_id: taijuddin_2021
  paragraphs: []
  answer: The Supreme Court referred to the precedent set in Subal Ghorai v. State of West Bengal, which emphasized that passive
    onlookers should not be falsely implicated as part of an unlawful assembly.
  source: IndicLegalQA
  file: 2021_taijuddin_v_state_of_assam_2021_9_444_450.pdf
- query: What was the Supreme Court's view on the behavior of bystanders during the mob attack?
  case_id: taijuddin_2021
  paragraphs: []
  answer: The Supreme Court noted that people often gather at the scene of an offense out of curiosity and that such bystanders
    should not be assumed to share the common object of the unlawful assembly.
  source: IndicLegalQA
  file: 2021_taijuddin_v_state_of_assam_2021_9_444_450.pdf
- query: What was the Supreme Court's directive regarding Taijuddin after setting aside his conviction?
  case_id: taijuddin_2021
  paragraphs: []
  answer: The Supreme Court ordered that Taijuddin be released forthwith, provided he was not required in any other case.
  source: IndicLegalQA
  file: 2021_taijuddin_v_state_of_assam_2021_9_444_450.pdf
- query: What was the primary legal issue in the case of Reema Salkan vs. Sumer Singh Salkan?
  case_id: reema_salkan_2018
  paragraphs: []
  answer: The primary legal issue was regarding the quantum of maintenance payable by Sumer Singh Salkan to Reema Salkan.
  source: IndicLegalQA
  file: 2018_reema_salkan_v_sumer_singh_salkan_2018_12_350_361.pdf
- query: What was the High Court's decision regarding the maintenance amount in the case of Reema Salkan vs. Sumer Singh Salkan?
  case_id: reema_salkan_2018
  paragraphs: []
  answer: The High Court directed Sumer Singh Salkan to pay maintenance of Rs.9,000 per month to Reema Salkan from 9th December
    2010 onwards.
  source: IndicLegalQA
  file: 2018_reema_salkan_v_sumer_singh_salkan_2018_12_350_361.pdf
- query: What was the appellant's (Reema Salkan) argument regarding the quantum of maintenance?
  case_id: reema_salkan_2018
  paragraphs: []
  answer: Reema Salkan argued that the maintenance amount should not be reduced from the interim maintenance of Rs.20,000
    per month granted earlier, as there was no change in circumstances.
  source: IndicLegalQA
  file: 2018_reema_salkan_v_sumer_singh_salkan_2018_12_350_361.pdf
- query: What was the High Court's observation about Sumer Singh Salkan's employment status?
  case_id: reema_salkan_2018
  paragraphs: []
  answer: The High Court observed that Sumer Singh Salkan claimed to be unemployed since 2010 but failed to provide evidence
    to support his claim, despite being highly educated and able-bodied.
  source: IndicLegalQA
  file: 2018_reema_salkan_v_sumer_singh_salkan_2018_12_350_361.pdf
- query: What did the Supreme Court conclude about the respondent's (Sumer Singh Salkan) ability to pay maintenance?
  case_id: reema_salkan_2018
  paragraphs: []
  answer: The Supreme Court concluded that Sumer Singh Salkan, being highly educated and able-bodied, was capable of earning
    and thus liable to pay maintenance to his wife.
  source: IndicLegalQA
  file: 2018_reema_salkan_v_sumer_singh_salkan_2018_12_350_361.pdf
- query: What was the final decision of the Supreme Court regarding the maintenance amount?
  case_id: reema_salkan_2018
  paragraphs: []
  answer: The Supreme Court directed Sumer Singh Salkan to pay Rs.20,000 per month as maintenance from January 2010 and Rs.25,000
    per month from 1st June 2018 onwards.
  source: IndicLegalQA
  file: 2018_reema_salkan_v_sumer_singh_salkan_2018_12_350_361.pdf
- query: How did the Supreme Court address the issue of inflation and cost of living in determining the maintenance amount?
  case_id: reema_salkan_2018
  paragraphs: []
  answer: The Supreme Court took into account the spiraling inflation rate and high cost of living, which influenced its decision
    to set the maintenance amount at Rs.20,000 and later Rs.25,000 per month.
  source: IndicLegalQA
  file: 2018_reema_salkan_v_sumer_singh_salkan_2018_12_350_361.pdf
- query: What was the Supreme Court's view on the Family Court's decision regarding the maintenance period?
  case_id: reema_salkan_2018
  paragraphs: []
  answer: The Supreme Court disagreed with the Family Court's decision to restrict maintenance only until 8th December 2010
    and extended it indefinitely, subject to further orders.
  source: IndicLegalQA
  file: 2018_reema_salkan_v_sumer_singh_salkan_2018_12_350_361.pdf
- query: What did the Supreme Court state about the responsibilities of an able-bodied husband in terms of maintenance?
  case_id: reema_salkan_2018
  paragraphs: []
  answer: The Supreme Court reiterated that an able-bodied husband is duty-bound to maintain his wife, who is unable to maintain
    herself, as per the personal law arising out of the marital status.
  source: IndicLegalQA
  file: 2018_reema_salkan_v_sumer_singh_salkan_2018_12_350_361.pdf
- query: What did the Supreme Court order regarding the payment of arrears of maintenance?
  case_id: reema_salkan_2018
  paragraphs: []
  answer: The Supreme Court directed Sumer Singh Salkan to clear the arrears of maintenance within eight weeks from the date
    of the order, after adjusting any amount already deposited in court or paid to Reema Salkan.
  source: IndicLegalQA
  file: 2018_reema_salkan_v_sumer_singh_salkan_2018_12_350_361.pdf
- query: What principle regarding maintenance did the Supreme Court highlight in this judgement?
  case_id: reema_salkan_2018
  paragraphs: []
  answer: The Supreme Court highlighted that maintenance laws are meant to support but not enrich, and payments should be
    fair and just, considering the standard of living and status of the parties involved.
  source: IndicLegalQA
  file: 2018_reema_salkan_v_sumer_singh_salkan_2018_12_350_361.pdf
- query: What were the charges against Dashrath Singh Chauhan in this case?
  case_id: dashrath_singh_chauhan_2018
  paragraphs: []
  answer: Dashrath Singh Chauhan was charged under Sections 7, 13(2) read with 13(1)(d) of the Prevention of Corruption Act,
    1988.
  source: IndicLegalQA
  file: 2018_dashrath_singh_chauhan_v_central_bureau_of_investigat_2018_12_914_922.pdf
- query: What was the outcome of the trial court's decision regarding Dashrath Singh Chauhan?
  case_id: dashrath_singh_chauhan_2018
  paragraphs: []
  answer: The trial court convicted Dashrath Singh Chauhan under Sections 7, 13(2) read with 13(1)(d) of the Prevention of
    Corruption Act, 1988 and sentenced him to rigorous imprisonment for two years and a fine of Rs.40,000.
  source: IndicLegalQA
  file: 2018_dashrath_singh_chauhan_v_central_bureau_of_investigat_2018_12_914_922.pdf
- query: What was the main allegation made by the complainant Arun Kumar against Dashrath Singh Chauhan?
  case_id: dashrath_singh_chauhan_2018
  paragraphs: []
  answer: The main allegation was that Dashrath Singh Chauhan, an employee of Delhi Electric Supply Undertaking (DESU), demanded
    a bribe of Rs.4000 from the complainant for installing an electric connection in his factory.
  source: IndicLegalQA
  file: 2018_dashrath_singh_chauhan_v_central_bureau_of_investigat_2018_12_914_922.pdf
- query: What was the prosecution's evidence against Dashrath Singh Chauhan?
  case_id: dashrath_singh_chauhan_2018
  paragraphs: []
  answer: The prosecution's evidence included the testimony of a shadow witness and the recovery of the bribe money from Rajinder
    Kumar, who allegedly accepted the money on behalf of Dashrath Singh Chauhan.
  source: IndicLegalQA
  file: 2018_dashrath_singh_chauhan_v_central_bureau_of_investigat_2018_12_914_922.pdf
- query: What did the High Court of Delhi decide regarding the appeal filed by Dashrath Singh Chauhan?
  case_id: dashrath_singh_chauhan_2018
  paragraphs: []
  answer: The High Court of Delhi dismissed the appeal filed by Dashrath Singh Chauhan and upheld his conviction and sentence.
  source: IndicLegalQA
  file: 2018_dashrath_singh_chauhan_v_central_bureau_of_investigat_2018_12_914_922.pdf
- query: What were the two main arguments made by the counsel for Dashrath Singh Chauhan in the Supreme Court?
  case_id: dashrath_singh_chauhan_2018
  paragraphs: []
  answer: The counsel argued that once the charge of conspiracy was not proved and the co-accused was acquitted, Dashrath
    Singh Chauhan should also have been acquitted. Secondly, the conviction was based only on the evidence of a shadow witness
    and not on the acceptance of bribe money directly by Dashrath Singh Chauhan.
  source: IndicLegalQA
  file: 2018_dashrath_singh_chauhan_v_central_bureau_of_investigat_2018_12_914_922.pdf
- query: What was the Supreme Court's decision regarding the appeal filed by Dashrath Singh Chauhan?
  case_id: dashrath_singh_chauhan_2018
  paragraphs: []
  answer: The Supreme Court allowed the appeal, set aside the conviction and sentence under Sections 7, 13(2) read with 13(1)(d)
    of the Prevention of Corruption Act, 1988, and acquitted Dashrath Singh Chauhan of the charges.
  source: IndicLegalQA
  file: 2018_dashrath_singh_chauhan_v_central_bureau_of_investigat_2018_12_914_922.pdf
- query: What did the Supreme Court say about the requirement of proving demand and acceptance in corruption cases?
  case_id: dashrath_singh_chauhan_2018
  paragraphs: []
  answer: The Supreme Court emphasized that the prosecution must prove both the demand and acceptance of bribe money by the
    accused, and in this case, the prosecution failed to prove the acceptance of bribe money by Dashrath Singh Chauhan.
  source: IndicLegalQA
  file: 2018_dashrath_singh_chauhan_v_central_bureau_of_investigat_2018_12_914_922.pdf
- query: What was the role of Rajinder Kumar in the case against Dashrath Singh Chauhan?
  case_id: dashrath_singh_chauhan_2018
  paragraphs: []
  answer: Rajinder Kumar, a co-accused and fellow employee of DESU, was alleged to have accepted the bribe money on behalf
    of Dashrath Singh Chauhan. However, he was acquitted of all charges.
  source: IndicLegalQA
  file: 2018_dashrath_singh_chauhan_v_central_bureau_of_investigat_2018_12_914_922.pdf
- query: Why did the Supreme Court find the evidence of the Investigating Officer unreliable in this case?
  case_id: dashrath_singh_chauhan_2018
  paragraphs: []
  answer: The Supreme Court found the evidence of the Investigating Officer unreliable due to his questionable integrity,
    as a bribe case had been directed against him by the High Court in another matter.
  source: IndicLegalQA
  file: 2018_dashrath_singh_chauhan_v_central_bureau_of_investigat_2018_12_914_922.pdf
- query: What was the charge against Naim Ahamed in this case?
  case_id: naim_ahamed_2023
  paragraphs: []
  answer: Naim Ahamed was charged with the offence under Section 376 of the Indian Penal Code (IPC) for committing rape.
  source: IndicLegalQA
  file: 2023_naim_ahamed_v_state_nct_of_delhi_2023_1_1061_1078.pdf
- query: What was the initial sentence given to Naim Ahamed by the Sessions Court?
  case_id: naim_ahamed_2023
  paragraphs: []
  answer: The Sessions Court sentenced Naim Ahamed to 10 years of rigorous imprisonment and a fine of Rs. 50,000, with an
    additional one year of imprisonment in default of payment.
  source: IndicLegalQA
  file: 2023_naim_ahamed_v_state_nct_of_delhi_2023_1_1061_1078.pdf
- query: How did the High Court modify the Sessions Court's order?
  case_id: naim_ahamed_2023
  paragraphs: []
  answer: The High Court reduced the substantive sentence to 7 years of rigorous imprisonment and a fine of Rs. 5,000, while
    confirming the compensation of Rs. 5,00,000 to the prosecutrix.
  source: IndicLegalQA
  file: 2023_naim_ahamed_v_state_nct_of_delhi_2023_1_1061_1078.pdf
- query: What was the prosecution's case against Naim Ahamed?
  case_id: naim_ahamed_2023
  paragraphs: []
  answer: The prosecution's case was that Naim Ahamed persuaded the prosecutrix with false promises of marriage and maintained
    an illicit relationship with her, resulting in her pregnancy.
  source: IndicLegalQA
  file: 2023_naim_ahamed_v_state_nct_of_delhi_2023_1_1061_1078.pdf
- query: What was the defense argument presented by Naim Ahamed?
  case_id: naim_ahamed_2023
  paragraphs: []
  answer: Naim Ahamed argued that the relationship was consensual, and the prosecutrix was aware of his marital status. He
    claimed that the complaint was lodged because he refused to meet her financial demands.
  source: IndicLegalQA
  file: 2023_naim_ahamed_v_state_nct_of_delhi_2023_1_1061_1078.pdf
- query: What was the Supreme Court's view on the evidence presented?
  case_id: naim_ahamed_2023
  paragraphs: []
  answer: The Supreme Court found that the evidence indicated a consensual relationship and that the prosecutrix was a consenting
    party, aware of the appellant's marital status.
  source: IndicLegalQA
  file: 2023_naim_ahamed_v_state_nct_of_delhi_2023_1_1061_1078.pdf
- query: What did the Supreme Court conclude regarding the consent of the prosecutrix?
  case_id: naim_ahamed_2023
  paragraphs: []
  answer: The Supreme Court concluded that the prosecutrix gave her consent voluntarily and with full knowledge of the circumstances,
    thus the charge of rape could not be sustained.
  source: IndicLegalQA
  file: 2023_naim_ahamed_v_state_nct_of_delhi_2023_1_1061_1078.pdf
- query: What was the final decision of the Supreme Court regarding Naim Ahamed's conviction?
  case_id: naim_ahamed_2023
  paragraphs: []
  answer: The Supreme Court set aside the conviction and acquitted Naim Ahamed of the charges, while maintaining the compensation
    awarded to the prosecutrix.
  source: IndicLegalQA
  file: 2023_naim_ahamed_v_state_nct_of_delhi_2023_1_1061_1078.pdf
- query: How did the Supreme Court address the issue of translation of the prosecutrix's testimony?
  case_id: naim_ahamed_2023
  paragraphs: []
  answer: The Supreme Court directed that all trial courts must comply with Section 277 of Cr.P.C. and record the evidence
    in the language of the witness, ensuring proper translation if necessary.
  source: IndicLegalQA
  file: 2023_naim_ahamed_v_state_nct_of_delhi_2023_1_1061_1078.pdf
- query: What compensation was awarded to the prosecutrix by the Sessions Court and confirmed by the High Court?
  case_id: naim_ahamed_2023
  paragraphs: []
  answer: The compensation awarded to the prosecutrix was Rs. 5,00,000, which Naim Ahamed had already paid.
  source: IndicLegalQA
  file: 2023_naim_ahamed_v_state_nct_of_delhi_2023_1_1061_1078.pdf
- query: What was the main legal issue in 'The State of Haryana & Ors. vs. Raj Kumar @ Bittu'?
  case_id: the_state_of_haryana_2021
  paragraphs: []
  answer: The main legal issue was whether the policies of the State Government regarding remission of sentences for life
    convicts should apply retroactively and the feasibility of drafting a new policy without leading to discrimination among
    similarly situated prisoners.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_raj_kumar_bittu_2021_8_320_344.pdf
- query: What directive did the High Court issue regarding the State's remission policy in 'The State of Haryana & Ors. vs.
    Raj Kumar @ Bittu'?
  case_id: the_state_of_haryana_2021
  paragraphs: []
  answer: The High Court directed the State to consider drafting a new remission policy with retrospective operation while
    ensuring it does not lead to discrimination among a substantial number of identically situated prisoners.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_raj_kumar_bittu_2021_8_320_344.pdf
- query: What is the significance of Article 161 of the Constitution in the context of this case?
  case_id: the_state_of_haryana_2021
  paragraphs: []
  answer: Article 161 of the Constitution grants the Governor of a State the power to grant pardons, reprieves, respites,
    or remissions of punishment, or to suspend, remit, or commute the sentence of any person convicted of an offence.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_raj_kumar_bittu_2021_8_320_344.pdf
- query: What were the key policies discussed in the case regarding the remission of sentences?
  case_id: the_state_of_haryana_2021
  paragraphs: []
  answer: The key policies discussed were the policy dated 12th April 2002, which provided for the consideration of premature
    release after 14 years of actual imprisonment and the policy dated 13th August 2008, which replaced the previous policies
    and outlined conditions for premature release based on the nature of the crime.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_raj_kumar_bittu_2021_8_320_344.pdf
- query: What was the Supreme Court's stance on the application of Section 433-A of the Code of Criminal Procedure?
  case_id: the_state_of_haryana_2021
  paragraphs: []
  answer: The Supreme Court emphasized that Section 433-A restricts the power of the appropriate Government to release a person
    sentenced to life imprisonment for an offence punishable with death until they have served at least 14 years of imprisonment.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_raj_kumar_bittu_2021_8_320_344.pdf
- query: How did the Supreme Court resolve the conflict between different remission policies in this case?
  case_id: the_state_of_haryana_2021
  paragraphs: []
  answer: The Supreme Court held that the policy dated 13th August 2008, being statutory in nature, supersedes earlier policies
    and applies to cases of premature release, but the power under Article 161 of the Constitution allows the Governor to
    grant remission independently of Section 433-A.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_raj_kumar_bittu_2021_8_320_344.pdf
- query: What was the final outcome of the Supreme Court's decision in 'The State of Haryana & Ors. vs. Raj Kumar @ Bittu'?
  case_id: the_state_of_haryana_2021
  paragraphs: []
  answer: The Supreme Court set aside the High Court's directions and held that the prisoner, having completed 12 years and
    25 days of imprisonment, could only be considered for premature release under the policy dated 13th August 2008 after
    completing 14 years of actual imprisonment, or earlier under Article 161 by the Governor.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_raj_kumar_bittu_2021_8_320_344.pdf
- query: What was the primary legal issue in the case 'Devi Lal & Babu Lal vs. State of Rajasthan'?
  case_id: devi_lal_2019
  paragraphs: []
  answer: The primary legal issue was whether the conviction of Devi Lal and Babu Lal under Section 302 read with Section
    120-B of the IPC for the murder of Dharam Chand was justified based on circumstantial evidence.
  source: IndicLegalQA
  file: 2019_devi_lal_v_state_of_rajasthan_2019_1_168_178.pdf
- query: What were the circumstances leading to the registration of the missing person report in 'Devi Lal & Babu Lal vs.
    State of Rajasthan'?
  case_id: devi_lal_2019
  paragraphs: []
  answer: On 8th February 1999, Vijay Singh (PW-2) reported that his cousin Dharam Chand had gone missing after leaving for
    Bhagwanpura on 7th February 1999. His motorcycle was found outside a godown, and his body was later discovered in a dry
    well.
  source: IndicLegalQA
  file: 2019_devi_lal_v_state_of_rajasthan_2019_1_168_178.pdf
- query: What was the prosecution's main evidence against Devi Lal and Babu Lal?
  case_id: devi_lal_2019
  paragraphs: []
  answer: The prosecution relied on the extra-judicial confession of co-accused Babu Lal, the recovery of a torn leaf from
    a ledger book with Dharam Chand's signature, and other circumstantial evidence such as the recovery of blood-stained clothes
    and a drum allegedly used to transport the body.
  source: IndicLegalQA
  file: 2019_devi_lal_v_state_of_rajasthan_2019_1_168_178.pdf
- query: What did the Supreme Court say about the extra-judicial confession used as evidence?
  case_id: devi_lal_2019
  paragraphs: []
  answer: The Supreme Court noted that extra-judicial confessions are inherently weak evidence and require corroboration.
    In this case, the confession lacked additional cogent circumstances to support it and was therefore unreliable.
  source: IndicLegalQA
  file: 2019_devi_lal_v_state_of_rajasthan_2019_1_168_178.pdf
- query: What were the contradictions and gaps in the prosecution's evidence as highlighted by the Supreme Court?
  case_id: devi_lal_2019
  paragraphs: []
  answer: The Supreme Court highlighted that there were inconsistencies in witness testimonies, the absence of Devi Lal's
    name in initial reports, and questionable recovery of evidence. The evidence was insufficient to conclusively establish
    the appellants' guilt beyond reasonable doubt.
  source: IndicLegalQA
  file: 2019_devi_lal_v_state_of_rajasthan_2019_1_168_178.pdf
- query: What was the Supreme Court's final decision in 'Devi Lal & Babu Lal vs. State of Rajasthan'?
  case_id: devi_lal_2019
  paragraphs: []
  answer: The Supreme Court set aside the conviction of Devi Lal and Babu Lal, granting them the benefit of doubt due to the
    incomplete and incoherent chain of circumstantial evidence. Babu Lal, who was in custody, was ordered to be released forthwith.
  source: IndicLegalQA
  file: 2019_devi_lal_v_state_of_rajasthan_2019_1_168_178.pdf
- query: What legal principle did the Supreme Court reiterate regarding circumstantial evidence?
  case_id: devi_lal_2019
  paragraphs: []
  answer: The Supreme Court reiterated that in cases based on circumstantial evidence, the chain of evidence must be complete
    and conclusive, leading only to the hypothesis of the accused's guilt. Any reasonable doubt or alternative hypothesis
    consistent with innocence should benefit the accused.
  source: IndicLegalQA
  file: 2019_devi_lal_v_state_of_rajasthan_2019_1_168_178.pdf
- query: What was the primary legal issue in the case 'Noorulla Khan vs. Karnataka State Pollution Control Board & Anr.'?
  case_id: noorulla_khan_2021
  paragraphs: []
  answer: The primary legal issue was whether Noorulla Khan, the Chief Officer of Sandur Gram Panchayat, was entitled to the
    protection under Section 197 of the Code of Criminal Procedure, 1973, and whether the absence of requisite sanction invalidated
    his prosecution.
  source: IndicLegalQA
  file: 2021_noorulla_khan_v_karnataka_state_pollution_co_2021_7_243_249.pdf
- query: What were the charges against Noorulla Khan in this case?
  case_id: noorulla_khan_2021
  paragraphs: []
  answer: Noorulla Khan was charged with offences under Sections 43 and 44 of the Water (Prevention and Control of Pollution)
    Act, 1974, for his role as the Chief Officer of Sandur Gram Panchayat.
  source: IndicLegalQA
  file: 2021_noorulla_khan_v_karnataka_state_pollution_co_2021_7_243_249.pdf
- query: What was the decision of the Trial Court regarding Noorulla Khan?
  case_id: noorulla_khan_2021
  paragraphs: []
  answer: The Trial Court found Noorulla Khan guilty of the offences charged and sentenced him to simple imprisonment for
    one year and six months, along with a fine of Rs. 1000 on both counts, with sentences to run concurrently.
  source: IndicLegalQA
  file: 2021_noorulla_khan_v_karnataka_state_pollution_co_2021_7_243_249.pdf
- query: What was the reasoning behind the II-Additional Sessions Judge's decision to allow Noorulla Khan's appeal?
  case_id: noorulla_khan_2021
  paragraphs: []
  answer: The II-Additional Sessions Judge allowed Noorulla Khan's appeal on the ground that as a public servant, he was entitled
    to protection under Section 197 of the Cr.P.C., and in the absence of requisite sanction, his prosecution was invalid.
  source: IndicLegalQA
  file: 2021_noorulla_khan_v_karnataka_state_pollution_co_2021_7_243_249.pdf
- query: How did the High Court of Karnataka respond to the appeal filed by the Karnataka State Pollution Control Board?
  case_id: noorulla_khan_2021
  paragraphs: []
  answer: The High Court of Karnataka set aside the decision of the lower Appellate Court and remitted the matter back to
    the lower Appellate Court for fresh consideration on merits, concluding that the protection under Section 197 of the Cr.P.C.
    would not be available to Noorulla Khan.
  source: IndicLegalQA
  file: 2021_noorulla_khan_v_karnataka_state_pollution_co_2021_7_243_249.pdf
- query: What was the Supreme Court's view on the applicability of Section 197 of the Cr.P.C. in this case?
  case_id: noorulla_khan_2021
  paragraphs: []
  answer: The Supreme Court upheld the High Court's view that the protection under Section 197 of the Cr.P.C. would not be
    available to Noorulla Khan due to the deemed fiction under Section 48 of the Water Act, and affirmed the High Court's
    decision to remit the matter for fresh consideration on merits.
  source: IndicLegalQA
  file: 2021_noorulla_khan_v_karnataka_state_pollution_co_2021_7_243_249.pdf
- query: What directions did the Supreme Court give in its final order regarding the case?
  case_id: noorulla_khan_2021
  paragraphs: []
  answer: The Supreme Court dismissed the appeal and directed that the matter, after remission, should be considered purely
    on its own merits by the lower Appellate Court, without the protection under Section 197 of the Cr.P.C.
  source: IndicLegalQA
  file: 2021_noorulla_khan_v_karnataka_state_pollution_co_2021_7_243_249.pdf
- query: What was the main allegation against Ganesan in the case decided on 14th October 2020?
  case_id: ganesan_2020
  paragraphs: []
  answer: Ganesan was accused of offences punishable under Section 7 read with Section 8 of the Protection of Children from
    Sexual Offences Act, 2012, involving the sexual molestation of a minor girl.
  source: IndicLegalQA
  file: 2020_ganesan_v_state_represented_its_inspec_2020_8_768_781.pdf
- query: What was the original conviction and sentence handed to Ganesan by the trial court?
  case_id: ganesan_2020
  paragraphs: []
  answer: The trial court convicted Ganesan under Section 7 of the POCSO Act and sentenced him to three years rigorous imprisonment,
    along with an order to pay rupees one lakh as compensation to the victim.
  source: IndicLegalQA
  file: 2020_ganesan_v_state_represented_its_inspec_2020_8_768_781.pdf
- query: What was the High Court's decision on Ganesan's appeal regarding the compensation order?
  case_id: ganesan_2020
  paragraphs: []
  answer: The High Court modified the trial court's compensation order, directing the State to pay the compensation to the
    victim and recover it from Ganesan if it found he had sufficient means.
  source: IndicLegalQA
  file: 2020_ganesan_v_state_represented_its_inspec_2020_8_768_781.pdf
- query: What was the argument made by Ganesan's counsel regarding the representation in the High Court?
  case_id: ganesan_2020
  paragraphs: []
  answer: Ganesan's counsel argued that no sufficient opportunity was given to the accused before the High Court, as the legal
    aid counsel was appointed and heard within four days.
  source: IndicLegalQA
  file: 2020_ganesan_v_state_represented_its_inspec_2020_8_768_781.pdf
- query: How did the Supreme Court view the victim's testimony in Ganesan's case?
  case_id: ganesan_2020
  paragraphs: []
  answer: The Supreme Court found the victim's testimony to be trustworthy, unblemished, and of sterling quality, thereby
    justifying the conviction based on her sole testimony.
  source: IndicLegalQA
  file: 2020_ganesan_v_state_represented_its_inspec_2020_8_768_781.pdf
- query: What was the Supreme Court's final decision regarding Ganesan's appeal?
  case_id: ganesan_2020
  paragraphs: []
  answer: The Supreme Court dismissed Ganesan's appeal, upholding the conviction and the three-year rigorous imprisonment
    sentence as imposed by the trial court.
  source: IndicLegalQA
  file: 2020_ganesan_v_state_represented_its_inspec_2020_8_768_781.pdf
- query: What was the primary legal question in the case of Narender Kumar vs Union of India and Others?
  case_id: narender_kumar_2019
  paragraphs: []
  answer: The primary legal question was the validity of the detention order dated 19th December 1974, issued under Section
    3 of the COFEPOSA Act, and whether the detention could serve as a basis for action under the SAFEMA Act.
  source: IndicLegalQA
  file: 2019_narender_kumar_v_union_of_india_2019_6_482_506.pdf
- query: What was the basis for Roshan Lal's detention under the COFEPOSA Act?
  case_id: narender_kumar_2019
  paragraphs: []
  answer: Roshan Lal was detained under the COFEPOSA Act for dealing in smuggled gold, with specific instances of purchasing
    gold from a notorious smuggler from Pakistan, as outlined in the detention order dated 19th December 1974.
  source: IndicLegalQA
  file: 2019_narender_kumar_v_union_of_india_2019_6_482_506.pdf
- query: Why did the High Court dismiss the writ petition challenging Roshan Lal's detention order?
  case_id: narender_kumar_2019
  paragraphs: []
  answer: The High Court dismissed the writ petition on the grounds that the detention had continued through the duration
    of the Emergency and that there were no merits in the claims against the detention order, including the consideration
    of Roshan Lal's representation and the language of the detention grounds.
  source: IndicLegalQA
  file: 2019_narender_kumar_v_union_of_india_2019_6_482_506.pdf
- query: What was the Supreme Court's decision regarding the High Court's handling of the case?
  case_id: narender_kumar_2019
  paragraphs: []
  answer: The Supreme Court upheld the High Court's decision, agreeing that the detention order was valid and that the provisions
    of SAFEMA applied. The Court found no substance in the claims of non-application of mind, language issues, or procedural
    infirmities.
  source: IndicLegalQA
  file: 2019_narender_kumar_v_union_of_india_2019_6_482_506.pdf
- query: What was the outcome of the Supreme Court's review of the grounds of detention and the orders under SAFEMA?
  case_id: narender_kumar_2019
  paragraphs: []
  answer: The Supreme Court confirmed the orders under SAFEMA, stating that the properties in question were illegally acquired
    and stood forfeited to the Central Government. The Court dismissed the appeals and upheld the findings of the Competent
    Authority and Appellate Tribunal.
  source: IndicLegalQA
  file: 2019_narender_kumar_v_union_of_india_2019_6_482_506.pdf
- query: What was the significance of the Supreme Court's decision regarding the continuation of detention during the Emergency?
  case_id: narender_kumar_2019
  paragraphs: []
  answer: The Supreme Court emphasized that the detention, having continued through the Emergency, could not be questioned
    later when it formed the basis for action under SAFEMA. The Court reiterated that failure to challenge the detention during
    its validity period precluded later challenges based on the same grounds.
  source: IndicLegalQA
  file: 2019_narender_kumar_v_union_of_india_2019_6_482_506.pdf
- query: What was the primary legal issue in the case of State of Gujarat & Anr. vs Narayan @ Narayan Sai @ Mota Bhagwan Asaram?
  case_id: state_of_gujarat_v_narayan_narayan_2021
  paragraphs: []
  answer: The primary legal issue was whether the respondent, Narayan @ Narayan Sai @ Mota Bhagwan Asaram, should be granted
    furlough by the High Court despite the objections raised by the prison and police authorities.
  source: IndicLegalQA
  file: 2021_state_of_gujarat_v_narayan_narayan_sai_mota_bha_2021_10_330_352.pdf
- query: What were the charges framed against Narayan @ Narayan Sai @ Mota Bhagwan Asaram?
  case_id: state_of_gujarat_v_narayan_narayan_2021
  paragraphs: []
  answer: The charges included offences under Sections 376(2)(c), 377, 354, 344, 357, 342, 323, 504, 506(2), 120-B, 212, 153,
    and 114 of the Indian Penal Code.
  source: IndicLegalQA
  file: 2021_state_of_gujarat_v_narayan_narayan_sai_mota_bha_2021_10_330_352.pdf
- query: What was the High Court's decision regarding the respondent's furlough application?
  case_id: state_of_gujarat_v_narayan_narayan_2021
  paragraphs: []
  answer: The High Court granted furlough to the respondent for a period of fourteen days, despite objections from the prison
    and police authorities.
  source: IndicLegalQA
  file: 2021_state_of_gujarat_v_narayan_narayan_sai_mota_bha_2021_10_330_352.pdf
- query: What were the main objections raised by the Director General of Police against granting furlough to the respondent?
  case_id: state_of_gujarat_v_narayan_narayan_2021
  paragraphs: []
  answer: The objections included the respondent's involvement in illegal activities inside the jail, the potential threat
    to law and order, attempts to bribe public officials, and the possibility of the respondent engaging in criminal activities
    if released.
  source: IndicLegalQA
  file: 2021_state_of_gujarat_v_narayan_narayan_sai_mota_bha_2021_10_330_352.pdf
- query: What was the Supreme Court's observation regarding the respondent's conduct while in custody?
  case_id: state_of_gujarat_v_narayan_narayan_2021
  paragraphs: []
  answer: The Supreme Court noted that the respondent had engaged in illegal activities such as keeping a mobile phone in
    jail and attempting to make contact with outsiders, which justified the denial of furlough.
  source: IndicLegalQA
  file: 2021_state_of_gujarat_v_narayan_narayan_sai_mota_bha_2021_10_330_352.pdf
- query: What was the Supreme Court's final decision in this case?
  case_id: state_of_gujarat_v_narayan_narayan_2021
  paragraphs: []
  answer: The Supreme Court set aside the High Court's order granting furlough to the respondent, agreeing with the objections
    raised by the prison and police authorities and highlighting the threat posed to public peace and security.
  source: IndicLegalQA
  file: 2021_state_of_gujarat_v_narayan_narayan_sai_mota_bha_2021_10_330_352.pdf
- query: What was the main issue in the Satpal vs. State of Haryana case?
  case_id: dilawar_2018
  paragraphs: []
  answer: The main issue was whether Satpal's conviction under Section 302 read with Section 201 IPC was justified, based
    on the last seen theory and circumstantial evidence.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What was the relationship between the appellant Satpal and the deceased Kapil Kumar?
  case_id: dilawar_2018
  paragraphs: []
  answer: Satpal had an altercation with Kapil Kumar a few days before the incident regarding the payment of milk.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What were the charges against Satpal?
  case_id: dilawar_2018
  paragraphs: []
  answer: Satpal was charged under Sections 302 (murder) and 201 (causing disappearance of evidence) of the IPC.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What evidence was used to convict Satpal?
  case_id: dilawar_2018
  paragraphs: []
  answer: The evidence included the last seen theory where PW-7 and PW-9 saw Satpal with the deceased on a bicycle, the recovery
    of a bicycle and milk can with PW-7's name, and Satpal's absconding after the incident.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What was the defense argument presented by Satpal's counsel?
  case_id: dilawar_2018
  paragraphs: []
  answer: The defense argued that the dead body was found at a considerable distance from where Satpal was last seen with
    the deceased, and that the recovery of the bicycle and milk can was planted.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What inconsistencies did Satpal's counsel highlight in the prosecution's case?
  case_id: dilawar_2018
  paragraphs: []
  answer: Satpal's counsel highlighted inconsistencies in the testimonies of PW-7 and PW-9 regarding the time and manner of
    the discovery of the dead body and the police reaching the spot.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: How did the Supreme Court view the last seen theory in this case?
  case_id: dilawar_2018
  paragraphs: []
  answer: The Supreme Court considered the last seen theory, along with other corroborative evidence, sufficient to establish
    the guilt of the accused when the accused offers no explanation or a wrong explanation and absconds.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What was the significance of the post-mortem report in this case?
  case_id: dilawar_2018
  paragraphs: []
  answer: The post-mortem report conducted on 12th September 2007 estimated the time of death as 24-36 hours before, coinciding
    with the time the deceased was last seen with Satpal.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What was the Supreme Court's decision regarding the conviction of Satpal?
  case_id: dilawar_2018
  paragraphs: []
  answer: The Supreme Court upheld the conviction of Satpal, finding no reason to interfere with the judgment of the lower
    courts.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What did the Supreme Court say about the recovery of the bicycle and milk can?
  case_id: dilawar_2018
  paragraphs: []
  answer: The Supreme Court stated that the recovery of the bicycle and milk can, identified by PW-7, were additional incriminating
    factors completing the chain of circumstances against Satpal.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What was the final outcome of the appeal filed by Satpal?
  case_id: dilawar_2018
  paragraphs: []
  answer: The Supreme Court dismissed the appeal, upholding Satpal's conviction under Sections 302 and 201 IPC.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What was the main issue in the State of Haryana vs. Rajesh Aggarwal & Anr. case?
  case_id: state_of_haryana_v_rajesh_aggarwal_2018
  paragraphs: []
  answer: The main issue was whether the High Court was justified in altering the charge against the respondents from Section
    302 IPC to Section 304-A IPC for the deaths of seven workers in a factory blast.
  source: IndicLegalQA
  file: 2018_state_of_haryana_v_rajesh_aggarwal_2018_10_925_928.pdf
- query: What were the charges initially framed against Rajesh Aggarwal and Anr.?
  case_id: state_of_haryana_v_rajesh_aggarwal_2018
  paragraphs: []
  answer: Rajesh Aggarwal and Anr. were initially charged under Section 302 IPC for the deaths of seven workers in a factory
    blast.
  source: IndicLegalQA
  file: 2018_state_of_haryana_v_rajesh_aggarwal_2018_10_925_928.pdf
- query: What was the incident that led to the charges against Rajesh Aggarwal and Anr.?
  case_id: state_of_haryana_v_rajesh_aggarwal_2018
  paragraphs: []
  answer: The incident involved a blast in the factory premises of M/s Kee Pharma Private Limited on 27th June 1996, which
    resulted in a stampede and the deaths of seven workers.
  source: IndicLegalQA
  file: 2018_state_of_haryana_v_rajesh_aggarwal_2018_10_925_928.pdf
- query: What was the High Court's decision regarding the charges against Rajesh Aggarwal and Anr.?
  case_id: state_of_haryana_v_rajesh_aggarwal_2018
  paragraphs: []
  answer: The High Court altered the charges from Section 302 IPC to Section 304-A IPC, concluding that the case was one of
    negligence rather than intentional murder.
  source: IndicLegalQA
  file: 2018_state_of_haryana_v_rajesh_aggarwal_2018_10_925_928.pdf
- query: Why did the respondents file a petition under Section 482 Cr.P.C.?
  case_id: state_of_haryana_v_rajesh_aggarwal_2018
  paragraphs: []
  answer: The respondents filed a petition under Section 482 Cr.P.C. to quash the FIR registered against them under Section
    302 IPC, arguing that the charges were not justified.
  source: IndicLegalQA
  file: 2018_state_of_haryana_v_rajesh_aggarwal_2018_10_925_928.pdf
- query: What was the Supreme Court's view on the High Court's alteration of charges?
  case_id: state_of_haryana_v_rajesh_aggarwal_2018
  paragraphs: []
  answer: The Supreme Court upheld the High Court's alteration of charges, finding no merit in the appeal and agreeing that
    the case should proceed under Section 304-A IPC.
  source: IndicLegalQA
  file: 2018_state_of_haryana_v_rajesh_aggarwal_2018_10_925_928.pdf
- query: What did the Supreme Court direct regarding the trial of Rajesh Aggarwal and Anr.?
  case_id: state_of_haryana_v_rajesh_aggarwal_2018
  paragraphs: []
  answer: The Supreme Court directed the Sessions Judge to ensure that the trial is completed on merits within one year from
    the date of the order, in accordance with the law.
  source: IndicLegalQA
  file: 2018_state_of_haryana_v_rajesh_aggarwal_2018_10_925_928.pdf
- query: What powers did the Supreme Court emphasize the Sessions Judge has during the trial?
  case_id: state_of_haryana_v_rajesh_aggarwal_2018
  paragraphs: []
  answer: The Supreme Court emphasized that the Sessions Judge has the power to alter, amend, or add any charge under Section
    216 of the Cr.P.C., notwithstanding the High Court's alteration of charges.
  source: IndicLegalQA
  file: 2018_state_of_haryana_v_rajesh_aggarwal_2018_10_925_928.pdf
- query: What was the Supreme Court's directive regarding the stay order that was in place?
