- query: What was the main issue in the case of Rathish Babu Unnikrishnan vs. The State (Govt. of NCT of Delhi) & Anr.?
  case_id: rathish_babu_unnikrishnan_2022
  paragraphs: []
  answer: The main issue was whether the High Court was justified in dismissing the application under Section 482 Cr.P.C.
    to quash the summoning order and notice framing under Section 138 of the Negotiable Instruments Act, 1881.
  source: IndicLegalQA
  file: 2022_rathish_babu_unnikrishnan_v_state_govt_of_nct_of_delhi_2022_4_989_1001.pdf
- query: What were the charges against Rathish Babu Unnikrishnan?
  case_id: rathish_babu_unnikrishnan_2022
  paragraphs: []
  answer: Rathish Babu Unnikrishnan was charged under Section 138 of the Negotiable Instruments Act, 1881, for issuing dishonored
    cheques against a legally enforceable debt or liability.
  source: IndicLegalQA
  file: 2022_rathish_babu_unnikrishnan_v_state_govt_of_nct_of_delhi_2022_4_989_1001.pdf
- query: Why did Rathish Babu Unnikrishnan file a petition under Section 482 Cr.P.C.?
  case_id: rathish_babu_unnikrishnan_2022
  paragraphs: []
  answer: Rathish Babu Unnikrishnan filed a petition under Section 482 Cr.P.C. to quash the summoning order and the order
    framing notice, arguing that the cheques were issued as security and not against a legally enforceable debt.
  source: IndicLegalQA
  file: 2022_rathish_babu_unnikrishnan_v_state_govt_of_nct_of_delhi_2022_4_989_1001.pdf
- query: What was the High Court's rationale for dismissing Rathish Babu Unnikrishnan's petition?
  case_id: rathish_babu_unnikrishnan_2022
  paragraphs: []
  answer: The High Court dismissed the petition, stating that the grounds raised by Rathish Babu Unnikrishnan were factual
    defenses that should be considered during the trial and not in a petition under Section 482 Cr.P.C.
  source: IndicLegalQA
  file: 2022_rathish_babu_unnikrishnan_v_state_govt_of_nct_of_delhi_2022_4_989_1001.pdf
- query: What was the Supreme Court's observation regarding the legal presumption under Section 139 of the Negotiable Instruments
    Act?
  case_id: rathish_babu_unnikrishnan_2022
  paragraphs: []
  answer: The Supreme Court observed that under Section 139 of the Negotiable Instruments Act, there is a presumption that
    the cheque was issued for the discharge of a legally enforceable debt or liability, and it is for the accused to rebut
    this presumption during the trial.
  source: IndicLegalQA
  file: 2022_rathish_babu_unnikrishnan_v_state_govt_of_nct_of_delhi_2022_4_989_1001.pdf
- query: What did the complainant argue regarding the dishonored cheques?
  case_id: rathish_babu_unnikrishnan_2022
  paragraphs: []
  answer: The complainant argued that the cheques were issued by Rathish Babu Unnikrishnan for a legally enforceable debt
    related to the buyback of shares of AAT Academy, and the dishonor of the cheques constituted an offense under Section
    138 of the N.I. Act.
  source: IndicLegalQA
  file: 2022_rathish_babu_unnikrishnan_v_state_govt_of_nct_of_delhi_2022_4_989_1001.pdf
- query: What was the appellant's contention regarding the nature of the cheques?
  case_id: rathish_babu_unnikrishnan_2022
  paragraphs: []
  answer: The appellant contended that the cheques were issued as contingent/security cheques for the buyback of shares and
    were not meant to be presented for payment until the shares were transferred to the complainant.
  source: IndicLegalQA
  file: 2022_rathish_babu_unnikrishnan_v_state_govt_of_nct_of_delhi_2022_4_989_1001.pdf
- query: What did the Supreme Court conclude about the quashing of the criminal proceedings at a pre-trial stage?
  case_id: rathish_babu_unnikrishnan_2022
  paragraphs: []
  answer: The Supreme Court concluded that quashing the criminal proceedings at a pre-trial stage would be inappropriate,
    as the factual disputes need to be resolved during the trial, and the accused must be given an opportunity to adduce evidence
    to rebut the legal presumption.
  source: IndicLegalQA
  file: 2022_rathish_babu_unnikrishnan_v_state_govt_of_nct_of_delhi_2022_4_989_1001.pdf
- query: What directions did the Supreme Court give regarding the trial of the case?
  case_id: rathish_babu_unnikrishnan_2022
  paragraphs: []
  answer: The Supreme Court directed that the trial should proceed, allowing both parties to present their evidence, and the
    trial court should decide the case on its merits without being influenced by the observations made by the higher courts.
  source: IndicLegalQA
  file: 2022_rathish_babu_unnikrishnan_v_state_govt_of_nct_of_delhi_2022_4_989_1001.pdf
- query: What was the final decision of the Supreme Court regarding the appeals?
  case_id: rathish_babu_unnikrishnan_2022
  paragraphs: []
  answer: The Supreme Court dismissed the appeals, upholding the High Court's decision to dismiss the petition under Section
    482 Cr.P.C. and allowing the trial to proceed.
  source: IndicLegalQA
  file: 2022_rathish_babu_unnikrishnan_v_state_govt_of_nct_of_delhi_2022_4_989_1001.pdf
- query: What was the main legal issue in the case of State of Madhya Pradesh vs Harjeet Singh & Anr.?
  case_id: state_of_madhya_pradesh_v_harjeet_2019
  paragraphs: []
  answer: The main legal issue was whether the High Court was justified in reducing the conviction of the respondents from
    Section 307 IPC to Section 324 IPC and acquitting the second respondent.
  source: IndicLegalQA
  file: 2019_state_of_madhya_pradesh_v_harjeet_singh_2019_4_564_576.pdf
- query: What were the initial charges against Harjeet Singh and Ramji Lal in the case of State of Madhya Pradesh vs Harjeet
    Singh & Anr.?
  case_id: state_of_madhya_pradesh_v_harjeet_2019
  paragraphs: []
  answer: Harjeet Singh was initially charged under Section 307 IPC, while Ramji Lal was charged under Section 307 read with
    Section 34 IPC.
  source: IndicLegalQA
  file: 2019_state_of_madhya_pradesh_v_harjeet_singh_2019_4_564_576.pdf
- query: What were the injuries sustained by the complainant, Sukhdev, in the case of State of Madhya Pradesh vs Harjeet Singh
    & Anr.?
  case_id: state_of_madhya_pradesh_v_harjeet_2019
  paragraphs: []
  answer: Sukhdev sustained multiple stab wounds, including a deep wound in the chest cavity, incised wounds on the upper
    region of the right buttocks, sub-scapula region, and illeal region of the left hip.
  source: IndicLegalQA
  file: 2019_state_of_madhya_pradesh_v_harjeet_singh_2019_4_564_576.pdf
- query: Why did the High Court reduce the conviction of Harjeet Singh from Section 307 IPC to Section 324 IPC?
  case_id: state_of_madhya_pradesh_v_harjeet_2019
  paragraphs: []
  answer: The High Court reduced the conviction because it held that the injuries were on 'unimportant' parts of the body
    and lacked the intention to commit murder, thus fitting the description of causing simple hurt under Section 324 IPC.
  source: IndicLegalQA
  file: 2019_state_of_madhya_pradesh_v_harjeet_singh_2019_4_564_576.pdf
- query: What did the Supreme Court find incorrect in the High Court's assessment of the injuries in the case of State of
    Madhya Pradesh vs Harjeet Singh & Anr.?
  case_id: state_of_madhya_pradesh_v_harjeet_2019
  paragraphs: []
  answer: The Supreme Court found that the High Court's assessment was incorrect as the chest injury caused bleeding into
    the lungs, indicating it was on a vital part of the body and could be fatal, fitting the criteria for Section 307 IPC.
  source: IndicLegalQA
  file: 2019_state_of_madhya_pradesh_v_harjeet_singh_2019_4_564_576.pdf
- query: What was the Supreme Court's decision regarding the conviction of Harjeet Singh in the case of State of Madhya Pradesh
    vs Harjeet Singh & Anr.?
  case_id: state_of_madhya_pradesh_v_harjeet_2019
  paragraphs: []
  answer: The Supreme Court set aside the High Court's judgement, restored the Sessions Court's conviction under Section 307
    IPC, and directed Harjeet Singh to undergo the remainder of his five-year sentence.
  source: IndicLegalQA
  file: 2019_state_of_madhya_pradesh_v_harjeet_singh_2019_4_564_576.pdf
- query: What was the outcome for Ramji Lal in the case of State of Madhya Pradesh vs Harjeet Singh & Anr.?
  case_id: state_of_madhya_pradesh_v_harjeet_2019
  paragraphs: []
  answer: The Supreme Court upheld the High Court's decision to acquit Ramji Lal, agreeing that there was a lack of consistency
    in the prosecution witnesses' statements regarding his role in the crime.
  source: IndicLegalQA
  file: 2019_state_of_madhya_pradesh_v_harjeet_singh_2019_4_564_576.pdf
- query: What might be the impact of the Supreme Court's ruling on future cases involving Section 307 IPC?
  case_id: state_of_madhya_pradesh_v_harjeet_2019
  paragraphs: []
  answer: The ruling reinforces that injuries inflicted with the intention to cause death, especially on vital parts of the
    body, should be treated under Section 307 IPC, emphasizing the importance of the intent and severity of injuries.
  source: IndicLegalQA
  file: 2019_state_of_madhya_pradesh_v_harjeet_singh_2019_4_564_576.pdf
- query: How could the ruling in the case of State of Madhya Pradesh vs Harjeet Singh & Anr. affect the handling of medical
    evidence in future trials?
  case_id: state_of_madhya_pradesh_v_harjeet_2019
  paragraphs: []
  answer: The ruling highlights the need for thorough consideration of medical evidence, especially regarding the impact of
    injuries on vital organs, to accurately determine the severity and intent behind the assault.
  source: IndicLegalQA
  file: 2019_state_of_madhya_pradesh_v_harjeet_singh_2019_4_564_576.pdf
- query: What procedural steps did the Supreme Court direct for Harjeet Singh after restoring the original conviction?
  case_id: state_of_madhya_pradesh_v_harjeet_2019
  paragraphs: []
  answer: The Supreme Court directed Harjeet Singh to surrender before the Sessions Court, Ashok Nagar, Guna, M.P. within
    two weeks from the date of the judgment to undergo the remainder of his sentence.
  source: IndicLegalQA
  file: 2019_state_of_madhya_pradesh_v_harjeet_singh_2019_4_564_576.pdf
- query: What was the role of the independent witness in the case of State of Madhya Pradesh vs Harjeet Singh & Anr.?
  case_id: state_of_madhya_pradesh_v_harjeet_2019
  paragraphs: []
  answer: The independent witness, an advocate (P.W. 3), corroborated the testimonies of the complainant's brothers by stating
    he saw Sukhdev lying in a pool of blood and was informed that Harjeet Singh had stabbed him multiple times.
  source: IndicLegalQA
  file: 2019_state_of_madhya_pradesh_v_harjeet_singh_2019_4_564_576.pdf
- query: What was the primary legal issue in the case of Asian Resurfacing of Road Agency Pvt. Ltd. vs Central Bureau of Investigation?
  case_id: asian_resurfacing_of_road_agency_pvt_2018
  paragraphs: []
  answer: The primary legal issue was whether an order framing a charge by a Special Judge under the provisions of the Prevention
    of Corruption Act, being an interlocutory order, can be assailed under Article 226/227 of the Constitution of India.
  source: IndicLegalQA
  file: 2018_asian_resurfacing_of_road_ag_v_central_bureau_of_investigat_2018_2_1045_1098.pdf
- query: What were the charges against Asian Resurfacing of Road Agency Pvt. Ltd.?
  case_id: asian_resurfacing_of_road_agency_pvt_2018
  paragraphs: []
  answer: The charges against Asian Resurfacing of Road Agency Pvt. Ltd. included Section 120B read with Sections 420, 467,
    468, 471, and 477A of IPC and Section 13(2) read with 13(1)(d) of the Prevention of Corruption Act, 1988.
  source: IndicLegalQA
  file: 2018_asian_resurfacing_of_road_ag_v_central_bureau_of_investigat_2018_2_1045_1098.pdf
- query: What was the role of the Municipal Corporation of Delhi (MCD) in this case?
  case_id: asian_resurfacing_of_road_agency_pvt_2018
  paragraphs: []
  answer: The Municipal Corporation of Delhi (MCD) was the complainant that alleged wrongful loss caused to it by the use
    of fake invoices of Oil Companies relating to the transportation of Bitumen for road works in Delhi during 1997 and 1998.
  source: IndicLegalQA
  file: 2018_asian_resurfacing_of_road_ag_v_central_bureau_of_investigat_2018_2_1045_1098.pdf
- query: What was the conclusion of the Special Judge, CBI, regarding the charges?
  case_id: asian_resurfacing_of_road_agency_pvt_2018
  paragraphs: []
  answer: The Special Judge, CBI, concluded that there was a prima facie case against the appellant and the other accused,
    and thus directed the framing of charges.
  source: IndicLegalQA
  file: 2018_asian_resurfacing_of_road_ag_v_central_bureau_of_investigat_2018_2_1045_1098.pdf
- query: How did the Delhi High Court initially handle the order framing charge against the appellants?
  case_id: asian_resurfacing_of_road_agency_pvt_2018
  paragraphs: []
  answer: The appellants filed a Criminal Revision against the order framing charge, which was later converted into a Writ
    Petition (Criminal) No. 352 of 2010 before the Delhi High Court.
  source: IndicLegalQA
  file: 2018_asian_resurfacing_of_road_ag_v_central_bureau_of_investigat_2018_2_1045_1098.pdf
- query: What was the Supreme Court's directive regarding the stay of proceedings in trial courts?
  case_id: asian_resurfacing_of_road_agency_pvt_2018
  paragraphs: []
  answer: The Supreme Court directed that any stay of proceedings in trial courts granted by higher courts would automatically
    lapse after six months unless extended by a specific speaking order, to ensure that trials do not remain pending for an
    unduly long period.
  source: IndicLegalQA
  file: 2018_asian_resurfacing_of_road_ag_v_central_bureau_of_investigat_2018_2_1045_1098.pdf
- query: What was the impact of the Supreme Court's decision on future corruption cases?
  case_id: asian_resurfacing_of_road_agency_pvt_2018
  paragraphs: []
  answer: The decision set a precedent that challenges to orders of charge should be entertained only in the rarest of rare
    cases to correct a patent error of jurisdiction, ensuring a speedy trial process in corruption cases.
  source: IndicLegalQA
  file: 2018_asian_resurfacing_of_road_ag_v_central_bureau_of_investigat_2018_2_1045_1098.pdf
- query: What procedural safeguards were emphasized by the Supreme Court in this judgment?
  case_id: asian_resurfacing_of_road_agency_pvt_2018
  paragraphs: []
  answer: The Supreme Court emphasized that any stay on proceedings should not exceed six months unless extended by a speaking
    order, and matters should be decided on a day-to-day basis to prevent undue delays.
  source: IndicLegalQA
  file: 2018_asian_resurfacing_of_road_ag_v_central_bureau_of_investigat_2018_2_1045_1098.pdf
- query: How did the Supreme Court view the High Courts' power to quash charges under Section 482 CrPC?
  case_id: asian_resurfacing_of_road_agency_pvt_2018
  paragraphs: []
  answer: The Supreme Court clarified that the inherent power under Section 482 CrPC should be exercised sparingly and only
    in rarest of rare cases to prevent misuse, ensuring that the trial process is not unduly hampered.
  source: IndicLegalQA
  file: 2018_asian_resurfacing_of_road_ag_v_central_bureau_of_investigat_2018_2_1045_1098.pdf
- query: What could be the potential future implications of this judgement on handling similar cases?
  case_id: asian_resurfacing_of_road_agency_pvt_2018
  paragraphs: []
  answer: The judgement could streamline the process of handling corruption cases by limiting the scope for challenging orders
    framing charges, thereby reducing delays and ensuring swifter justice.
  source: IndicLegalQA
  file: 2018_asian_resurfacing_of_road_ag_v_central_bureau_of_investigat_2018_2_1045_1098.pdf
- query: How does this judgement clarify the use of circumstantial evidence in framing charges?
  case_id: asian_resurfacing_of_road_agency_pvt_2018
  paragraphs: []
  answer: The judgement indicates that framing of charges can proceed based on the prima facie evidence and material brought
    on record, without requiring a detailed appreciation of the evidence as would be necessary at the trial stage.
  source: IndicLegalQA
  file: 2018_asian_resurfacing_of_road_ag_v_central_bureau_of_investigat_2018_2_1045_1098.pdf
- query: What was the main legal issue in the case of State of U.P. vs Sonu Kushwaha?
  case_id: state_of_u_p_v_sonu_2023
  paragraphs: []
  answer: The main legal issue was whether Sonu Kushwaha was guilty of the offence of aggravated penetrative sexual assault
    punishable under Section 6 of the Protection of Children from Sexual Offences (POCSO) Act, 2012.
  source: IndicLegalQA
  file: 2023_state_of_u_p_v_sonu_kushwaha_2023_10_993_1000.pdf
- query: What were the initial charges against Sonu Kushwaha?
  case_id: state_of_u_p_v_sonu_2023
  paragraphs: []
  answer: Sonu Kushwaha was charged under Sections 377 and 506 of the IPC and Section 5 read with Section 6 of the POCSO Act
    for allegedly committing aggravated penetrative sexual assault on a minor.
  source: IndicLegalQA
  file: 2023_state_of_u_p_v_sonu_kushwaha_2023_10_993_1000.pdf
- query: What was the prosecution's case against Sonu Kushwaha?
  case_id: state_of_u_p_v_sonu_2023
  paragraphs: []
  answer: The prosecution's case was that on 22nd March 2016, Sonu Kushwaha took the 10-year-old victim to a temple, gave
    him Rs. 20, and forced him to perform oral sex. The victim later reported the incident to his family.
  source: IndicLegalQA
  file: 2023_state_of_u_p_v_sonu_kushwaha_2023_10_993_1000.pdf
- query: What was the decision of the Special Judge under the POCSO Act regarding the charges against Sonu Kushwaha?
  case_id: state_of_u_p_v_sonu_2023
  paragraphs: []
  answer: The Special Judge convicted Sonu Kushwaha of all three offences and sentenced him to ten years of rigorous imprisonment
    for the offence punishable under Section 6 of the POCSO Act, seven years for the offence under Section 377 of the IPC,
    and one year for the offence under Section 506 of the IPC.
  source: IndicLegalQA
  file: 2023_state_of_u_p_v_sonu_kushwaha_2023_10_993_1000.pdf
- query: How did the High Court modify the conviction of Sonu Kushwaha?
  case_id: state_of_u_p_v_sonu_2023
  paragraphs: []
  answer: The High Court held that Sonu Kushwaha was guilty of penetrative sexual assault under Section 4 of the POCSO Act
    instead of aggravated penetrative sexual assault under Section 6, reducing his sentence to seven years of rigorous imprisonment.
  source: IndicLegalQA
  file: 2023_state_of_u_p_v_sonu_kushwaha_2023_10_993_1000.pdf
- query: What was the Supreme Court's finding regarding the classification of the offence committed by Sonu Kushwaha?
  case_id: state_of_u_p_v_sonu_2023
  paragraphs: []
  answer: The Supreme Court found that the offence committed by Sonu Kushwaha was indeed aggravated penetrative sexual assault
    under Section 6 of the POCSO Act, as the victim was below twelve years of age.
  source: IndicLegalQA
  file: 2023_state_of_u_p_v_sonu_kushwaha_2023_10_993_1000.pdf
- query: What did the Supreme Court rule about the sentencing under Section 6 of the POCSO Act?
  case_id: state_of_u_p_v_sonu_2023
  paragraphs: []
  answer: The Supreme Court ruled that the minimum sentence under Section 6 of the POCSO Act is ten years of rigorous imprisonment,
    and it upheld this sentence for Sonu Kushwaha.
  source: IndicLegalQA
  file: 2023_state_of_u_p_v_sonu_kushwaha_2023_10_993_1000.pdf
