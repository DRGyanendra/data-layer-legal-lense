  source: IndicLegalQA
  file: 2018_menoka_malik_v_state_of_west_bengal_2018_10_707_725.pdf
- query: What did the Supreme Court conclude about the High Court's handling of the evidence?
  case_id: menoka_malik_2018
  paragraphs: []
