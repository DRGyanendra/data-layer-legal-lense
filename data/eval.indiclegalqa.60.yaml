# Questions from IndicLegalQA (NIT Srinagar, Mendeley Data, doi:10.17632/gf8n8cnmvc.2, CC BY 4.0),
# matched to judgments in the AWS Open Data bucket by decision date and party names.
# No paragraph numbers are known, so a hit means a chunk from the right case. `answer` is kept
# for reading, not scoring.
questions:
- query: What was the primary legal issue in the case Apollo Institute of Medical Sciences & Research vs. Union of India &
    Anr.?
  case_id: apollo_institute_of_medical_sciences_research_2017
  paragraphs: []
  answer: The primary legal issue was whether the Central Government's decision to debar the petitioner's medical college
    from admitting students for two years and to encash the bank guarantee was justified.
  source: IndicLegalQA
  file: 2017_apollo_institute_of_medical__v_union_of_india_2017_9_697_705.pdf
- query: Why did the Central Government debar Apollo Institute of Medical Sciences & Research from admitting students for
    two years?
  case_id: apollo_institute_of_medical_sciences_research_2017
  paragraphs: []
  answer: The Central Government debared the college based on a negative recommendation from the Medical Council of India
    (MCI), citing deficiencies in faculty and resident doctors during inspections.
  source: IndicLegalQA
  file: 2017_apollo_institute_of_medical__v_union_of_india_2017_9_697_705.pdf
- query: What role did the Oversight Committee (OC) play in the case Apollo Institute of Medical Sciences & Research vs. Union
    of India & Anr.?
  case_id: apollo_institute_of_medical_sciences_research_2017
  paragraphs: []
  answer: The OC, constituted under the Supreme Court's directions, reviewed the compliance submitted by the college and initially
    approved the scheme for the academic session 2016-17, but later noted deficiencies in subsequent inspections.
  source: IndicLegalQA
  file: 2017_apollo_institute_of_medical__v_union_of_india_2017_9_697_705.pdf
- query: What was the Supreme Court's view on the deficiencies noted by the Medical Council of India in the case Apollo Institute
    of Medical Sciences & Research vs. Union of India & Anr.?
  case_id: apollo_institute_of_medical_sciences_research_2017
  paragraphs: []
  answer: The Supreme Court observed that the deficiencies noted by MCI were marginal and that the Central Government's decision
    to debar the college for two years was excessive. The court emphasized the need for proportionality in administrative
    decisions.
  source: IndicLegalQA
  file: 2017_apollo_institute_of_medical__v_union_of_india_2017_9_697_705.pdf
- query: How did the Supreme Court rule on the issue of admitting students for the academic session 2017-18 in the case Apollo
    Institute of Medical Sciences & Research vs. Union of India & Anr.?
  case_id: apollo_institute_of_medical_sciences_research_2017
  paragraphs: []
  answer: The Supreme Court set aside the Central Government's decision to debar the college from admitting students for two
    years and allowed the college to admit students for the academic session 2017-18, subject to fulfilling conditions imposed
    by the Oversight Committee.
  source: IndicLegalQA
  file: 2017_apollo_institute_of_medical__v_union_of_india_2017_9_697_705.pdf
- query: What directive did the Supreme Court give regarding future inspections of Apollo Institute of Medical Sciences &
    Research?
  case_id: apollo_institute_of_medical_sciences_research_2017
  paragraphs: []
  answer: The Supreme Court allowed the Medical Council of India or the Competent Authority of the Central Government to inspect
    the college as deemed fit and to take appropriate action if any deficiencies were found in the future, after giving the
    college an opportunity to address them.
  source: IndicLegalQA
  file: 2017_apollo_institute_of_medical__v_union_of_india_2017_9_697_705.pdf
- query: What was the Supreme Court's final decision in the case Apollo Institute of Medical Sciences & Research vs. Union
    of India & Anr.?
  case_id: apollo_institute_of_medical_sciences_research_2017
  paragraphs: []
  answer: The Supreme Court quashed the decision to debar the college from admitting students and extended the cut-off date
    for admissions to 5th September 2017, allowing the college to participate in the ongoing counselling process for the academic
    session 2017-18.
  source: IndicLegalQA
  file: 2017_apollo_institute_of_medical__v_union_of_india_2017_9_697_705.pdf
- query: What was the primary issue in the case Dinganglung Gangmei vs. Mutum Churamani Meetei & Ors.?
  case_id: dinganglung_gangmei_2023
  paragraphs: []
  answer: The primary issue was whether the Acting Chief Justice of the High Court of Manipur had jurisdiction to issue directions
    to the Government of Manipur to respond to a communication regarding the inclusion of the Meitei community in the Presidential
    List of Scheduled Tribes.
  source: IndicLegalQA
  file: 2023_dinganglung_gangmei_v_mutum_churamani_meetei_2023_12_1083_1117.pdf
- query: What action by the High Court of Manipur led to the filing of the Special Leave Petition in the Supreme Court?
  case_id: dinganglung_gangmei_2023
  paragraphs: []
  answer: The High Court of Manipur, on 27th March 2023, directed the Government of Manipur to recommend the inclusion of
    the Meitei community in the Presidential List of Scheduled Tribes within a stipulated time frame.
  source: IndicLegalQA
  file: 2023_dinganglung_gangmei_v_mutum_churamani_meetei_2023_12_1083_1117.pdf
- query: What was the Union Government's position on the High Court's order regarding the Meitei community?
  case_id: dinganglung_gangmei_2023
  paragraphs: []
  answer: The Union Government stated that the State of Manipur was taking appropriate steps to recall the order of the Single
    Judge of the High Court dated 27th March 2023 by moving the competent forum.
  source: IndicLegalQA
  file: 2023_dinganglung_gangmei_v_mutum_churamani_meetei_2023_12_1083_1117.pdf
- query: What measures did the Union Government report to the Supreme Court to address the situation in Manipur?
  case_id: dinganglung_gangmei_2023
  paragraphs: []
  answer: The Union Government reported deploying 52 companies of Central Armed Police Forces, 105 columns of the Army/Assam
    Rifles, conducting flag marches, appointing a Security Adviser, and setting up relief camps among other measures to ensure
    normalcy and provide relief in Manipur.
  source: IndicLegalQA
  file: 2023_dinganglung_gangmei_v_mutum_churamani_meetei_2023_12_1083_1117.pdf
- query: What concerns did the petitioners express regarding the situation in Manipur?
  case_id: dinganglung_gangmei_2023
  paragraphs: []
  answer: The petitioners expressed concerns about threats to safety, the need for enhanced security in sensitive areas, and
    the overall law and order situation, seeking directions for relief and rehabilitation measures.
  source: IndicLegalQA
  file: 2023_dinganglung_gangmei_v_mutum_churamani_meetei_2023_12_1083_1117.pdf
- query: What directions did the Supreme Court give to the authorities regarding the relief camps in Manipur?
  case_id: dinganglung_gangmei_2023
  paragraphs: []
  answer: The Supreme Court directed the authorities to ensure that relief camps provide all basic amenities, including food
    and medical care, and to take necessary precautions for the rehabilitation of displaced persons.
  source: IndicLegalQA
  file: 2023_dinganglung_gangmei_v_mutum_churamani_meetei_2023_12_1083_1117.pdf
- query: What was the Supreme Court's stance on the investigation and accountability of the violence in Manipur?
  case_id: dinganglung_gangmei_2023
  paragraphs: []
  answer: The Supreme Court emphasized the need for a thorough and impartial investigation into the violence, including sexual
    violence against women, and directed the appointment of a Special Investigation Team (SIT) to ensure proper investigation
    and accountability.
  source: IndicLegalQA
  file: 2023_dinganglung_gangmei_v_mutum_churamani_meetei_2023_12_1083_1117.pdf
- query: What was the main issue in the case Shri N.K. Janu vs. Lakshmi Chandra?
  case_id: n_k_janu_deputy_director_social_2019
  paragraphs: []
  answer: The main issue was whether Lakshmi Chandra, a daily wager, was entitled to regularization and payment of minimum
    pay scale as per the Uttar Pradesh Regularisation of Daily Wages Appointments on Group 'D' Posts Rules, 2001.
  source: IndicLegalQA
  file: 2019_shri_n_k_janu_deputy_directo_v_lakshmi_chandra_2019_5_618_630.pdf
- query: What was the High Court's order on Lakshmi Chandra's writ petition regarding his regularization and pay scale?
  case_id: n_k_janu_deputy_director_social_2019
  paragraphs: []
  answer: The High Court ordered that Lakshmi Chandra be considered for regularization under the Uttar Pradesh Regularisation
    of Daily Wages Appointments on Group 'D' Posts Rules, 2001, and be paid the minimum of the regular pay scale as per the
    law.
  source: IndicLegalQA
  file: 2019_shri_n_k_janu_deputy_directo_v_lakshmi_chandra_2019_5_618_630.pdf
- query: How did the Divisional Director of Social Forestry Division Agra respond to the High Court's order?
  case_id: n_k_janu_deputy_director_social_2019
  paragraphs: []
  answer: The Divisional Director of Social Forestry Division Agra passed an order on 19th November 2008, stating that Lakshmi
    Chandra was not eligible for regularization/equal pay because he had not worked continuously and that his appointment
    did not follow any selection procedure.
  source: IndicLegalQA
  file: 2019_shri_n_k_janu_deputy_directo_v_lakshmi_chandra_2019_5_618_630.pdf
- query: What action did Lakshmi Chandra take after the Divisional Director's order denying his regularization?
  case_id: n_k_janu_deputy_director_social_2019
  paragraphs: []
  answer: Lakshmi Chandra filed a Contempt Application (C) No. 1632 of 2009, alleging non-compliance with the High Court's
    order regarding his regularization and minimum pay scale.
  source: IndicLegalQA
  file: 2019_shri_n_k_janu_deputy_directo_v_lakshmi_chandra_2019_5_618_630.pdf
- query: What was the Supreme Court's observation regarding the Contempt Court's jurisdiction in this case?
  case_id: n_k_janu_deputy_director_social_2019
  paragraphs: []
  answer: The Supreme Court observed that the Contempt Court had exceeded its jurisdiction by compelling the presence of State
    officers and issuing orders beyond the scope of ensuring compliance with the High Court's original order.
  source: IndicLegalQA
  file: 2019_shri_n_k_janu_deputy_directo_v_lakshmi_chandra_2019_5_618_630.pdf
- query: What was the Supreme Court's final decision in the case?
  case_id: n_k_janu_deputy_director_social_2019
  paragraphs: []
  answer: The Supreme Court allowed the appeal, set aside the entire proceedings in Contempt Application No. 1632 of 2009,
    and dismissed the Contempt Application, finding it wholly unjustified and in excess of the jurisdiction vested with the
    Contempt Court.
  source: IndicLegalQA
  file: 2019_shri_n_k_janu_deputy_directo_v_lakshmi_chandra_2019_5_618_630.pdf
- query: What was the main legal issue in the case State of Madhya Pradesh vs. R.D. Sharma & Anr.?
  case_id: state_of_madhya_pradesh_v_r_2022
  paragraphs: []
  answer: The main legal issue was whether R.D. Sharma, who retired as the Principal Chief Conservator of Forests (PCCF) in
    2001, was entitled to have his pension revised to the apex scale of Rs. 80,000/- as per the Indian Forests Service (Pay)
    Second Amendment Rules, 2008, which came into effect from 27th September 2008.
  source: IndicLegalQA
  file: 2022_state_of_madhya_pradesh_v_r_d_sharma_2022_2_707_719.pdf
- query: What was the decision of the High Court of Madhya Pradesh regarding the pension of R.D. Sharma?
  case_id: state_of_madhya_pradesh_v_r_2022
  paragraphs: []
  answer: The High Court of Madhya Pradesh held that R.D. Sharma was eligible to get the benefit of Rs. 40,000/- as pension
    at par with other officers, as per the Indian Forests Service (Pay) Second Amendment Rules, 2008.
  source: IndicLegalQA
  file: 2022_state_of_madhya_pradesh_v_r_d_sharma_2022_2_707_719.pdf
- query: What was the argument of the State of Madhya Pradesh against the High Court's decision?
  case_id: state_of_madhya_pradesh_v_r_2022
  paragraphs: []
  answer: The State of Madhya Pradesh argued that the amendment rules of 2008 came into force on 27th September 2008, and
    since R.D. Sharma retired in 2001, he could not be granted the benefit of the apex scale of Rs. 80,000/- which was meant
    for the upgraded post of Head of Forest Force to be filled by selection from officers holding the post of PCCF in the
    HAG+ scale.
  source: IndicLegalQA
  file: 2022_state_of_madhya_pradesh_v_r_d_sharma_2022_2_707_719.pdf
- query: What was the Supreme Court's observation on the application of the principle 'equal pay for equal work' in this case?
  case_id: state_of_madhya_pradesh_v_r_2022
  paragraphs: []
  answer: The Supreme Court observed that the principle of 'equal pay for equal work' was not applicable in this case as the
    upgradation to the apex scale was to be made by selection and not as a matter of course. Therefore, R.D. Sharma, who retired
    before the 2008 amendments, could not claim the apex scale as a matter of right.
  source: IndicLegalQA
  file: 2022_state_of_madhya_pradesh_v_r_d_sharma_2022_2_707_719.pdf
- query: What was the final decision of the Supreme Court in this case?
  case_id: state_of_madhya_pradesh_v_r_2022
  paragraphs: []
  answer: The Supreme Court allowed the appeal, set aside the High Court's judgement, and restored the order of the Central
    Administrative Tribunal, which had dismissed R.D. Sharma's claim for the apex scale based on 'equal pay for equal work'.
  source: IndicLegalQA
  file: 2022_state_of_madhya_pradesh_v_r_d_sharma_2022_2_707_719.pdf
- query: What precedent did the Supreme Court rely on to support its decision?
  case_id: state_of_madhya_pradesh_v_r_2022
  paragraphs: []
  answer: The Supreme Court relied on the precedent set in the case of K.S. Krishnaswamy & Ors. vs. Union of India & Anr.,
    where it was held that the benefit of upgradation of a post cannot be extended to pensioners who retired before such upgradation.
  source: IndicLegalQA
  file: 2022_state_of_madhya_pradesh_v_r_d_sharma_2022_2_707_719.pdf
- query: What was the primary legal issue in the case J.S. Luthra Academy & Another vs. State of Jammu and Kashmir & Others?
  case_id: j_s_luthra_academy_2018
  paragraphs: []
  answer: The primary legal issue was whether the allotment of land to J.S. Luthra Academy was valid or whether it was arbitrary
    and needed to be quashed.
  source: IndicLegalQA
  file: 2018_j_s_luthra_academy_v_state_of_jammu_kashmir_2018_10_1098_1118.pdf
- query: What was the initial order that led to the dispute involving J.S. Luthra Academy?
  case_id: j_s_luthra_academy_2018
  paragraphs: []
  answer: The initial order was by the authority constituted under the J&K Wakf Act, 1978, which ordered the eviction of the
    Academy from the Wakf property in Jammu on 27th December 1995.
  source: IndicLegalQA
  file: 2018_j_s_luthra_academy_v_state_of_jammu_kashmir_2018_10_1098_1118.pdf
- query: What was the decision of the Jammu & Kashmir Special Tribunal regarding the eviction order?
  case_id: j_s_luthra_academy_2018
  paragraphs: []
  answer: The Jammu & Kashmir Special Tribunal granted an interim stay on the eviction order on 9th January 1996.
  source: IndicLegalQA
  file: 2018_j_s_luthra_academy_v_state_of_jammu_kashmir_2018_10_1098_1118.pdf
- query: What alternative solution was considered by the State Government for J.S. Luthra Academy?
  case_id: j_s_luthra_academy_2018
  paragraphs: []
  answer: The State Government considered allotting a piece of land in Channi Himmat, Jammu, to the Academy for shifting and
    running the school.
  source: IndicLegalQA
  file: 2018_j_s_luthra_academy_v_state_of_jammu_kashmir_2018_10_1098_1118.pdf
- query: What was the outcome of the Writ Petitions filed by the residents of Channi Himmat and Naresh Kumar?
  case_id: j_s_luthra_academy_2018
  paragraphs: []
  answer: The Writ Petitions questioned the allotment of land to the Academy, claiming it violated the original scheme and
    plan of the Channi Himmat Housing Colony. The Division Bench of the High Court allowed the Writ Petitions and quashed
    the allotment.
  source: IndicLegalQA
  file: 2018_j_s_luthra_academy_v_state_of_jammu_kashmir_2018_10_1098_1118.pdf
- query: What was the Supreme Court's decision regarding the allotment of land to J.S. Luthra Academy?
  case_id: j_s_luthra_academy_2018
  paragraphs: []
  answer: The Supreme Court set aside the judgment of the Division Bench, restored the judgment of the learned Single Judge,
    and allowed the Academy to retain the land with the modification that they pay for the two kanals of land initially allotted
    for free.
  source: IndicLegalQA
  file: 2018_j_s_luthra_academy_v_state_of_jammu_kashmir_2018_10_1098_1118.pdf
- query: What was the Supreme Court's directive regarding the payment for the land allotted to the Academy?
  case_id: j_s_luthra_academy_2018
  paragraphs: []
  answer: The Supreme Court directed the Academy to pay Rs. 8,00,000 per kanal for the two kanals of land allotted for free,
    along with interest at the rate of 6% per annum from the date of allotment until the date of payment.
  source: IndicLegalQA
  file: 2018_j_s_luthra_academy_v_state_of_jammu_kashmir_2018_10_1098_1118.pdf
- query: What was the rationale provided by the Supreme Court for allowing the Academy to retain the land?
  case_id: j_s_luthra_academy_2018
  paragraphs: []
  answer: The Supreme Court reasoned that the allotment was made in the public interest to avoid disrupting the education
    of hundreds of students and to ensure continuity of the school's operation, thereby justifying the deviation from the
    usual practice of auctioning the land.
  source: IndicLegalQA
  file: 2018_j_s_luthra_academy_v_state_of_jammu_kashmir_2018_10_1098_1118.pdf
- query: What was the primary issue in the case of The Chairman V.O. Chidambaranar Port Trust & Ors. vs Capt. Paul Nadar Bennet
    Singh?
  case_id: the_chairman_v_o_chidambaranar_port_2018
  paragraphs: []
  answer: The primary issue was whether the termination of Capt. Paul Nadar Bennet Singh's appointment as a Pilot Officer
    by the V.O. Chidambaranar Port Trust was valid, particularly in light of his qualifications and the certification he held
    from the Maritime and Port Authority of Singapore.
  source: IndicLegalQA
  file: 2018_chairman_v_o_chidambaranar_p_v_capt_paul_nadar_bennet_singh_2018_13_942_949.pdf
- query: What qualifications did Capt. Paul Nadar Bennet Singh possess that were under scrutiny?
  case_id: the_chairman_v_o_chidambaranar_port_2018
  paragraphs: []
  answer: Capt. Paul Nadar Bennet Singh possessed a Certificate of Competency as Master issued by the Maritime and Port Authority
    of Singapore, along with qualifications in MBA (Shipping and Port Management), Master of Human Resource, Advanced Diploma
    in Maritime Transportation, and Master of Science in Counselling and Psychotherapy.
  source: IndicLegalQA
  file: 2018_chairman_v_o_chidambaranar_p_v_capt_paul_nadar_bennet_singh_2018_13_942_949.pdf
- query: Why did the V.O. Chidambaranar Port Trust terminate Capt. Paul Nadar Bennet Singh's appointment?
  case_id: the_chairman_v_o_chidambaranar_port_2018
  paragraphs: []
  answer: The Port Trust terminated Capt. Paul Nadar Bennet Singh's appointment because they argued that his Certificate of
    Competency from Singapore was not recognized by the Government of India for performing pilot duties at the port, and thus,
    he was not eligible for the position.
  source: IndicLegalQA
  file: 2018_chairman_v_o_chidambaranar_p_v_capt_paul_nadar_bennet_singh_2018_13_942_949.pdf
- query: What was the decision of the High Court of Madras regarding the termination of Capt. Paul Nadar Bennet Singh?
  case_id: the_chairman_v_o_chidambaranar_port_2018
  paragraphs: []
  answer: The High Court of Madras set aside the termination order, directing the reinstatement of Capt. Paul Nadar Bennet
    Singh with back wages, while giving the Port Trust the liberty to re-examine the validity of his certificates by providing
    him an opportunity for a personal hearing.
  source: IndicLegalQA
  file: 2018_chairman_v_o_chidambaranar_p_v_capt_paul_nadar_bennet_singh_2018_13_942_949.pdf
- query: What was the Supreme Court's view on the equivalency of the Certificate of Competency issued by the Maritime and
    Port Authority of Singapore?
  case_id: the_chairman_v_o_chidambaranar_port_2018
  paragraphs: []
  answer: The Supreme Court held that the Certificate of Competency as Master (Foreign Going) issued by the Maritime and Port
    Authority of Singapore was equivalent to the certificate issued by the Government of India. The Court noted that the Port
    Trust had not raised any objections to this certificate at the time of appointment and had previously sought clarification
    from the Ministry of Shipping, which did not find any issue with the certification.
  source: IndicLegalQA
  file: 2018_chairman_v_o_chidambaranar_p_v_capt_paul_nadar_bennet_singh_2018_13_942_949.pdf
- query: What was the Supreme Court's final ruling regarding Capt. Paul Nadar Bennet Singh's termination and reinstatement?
  case_id: the_chairman_v_o_chidambaranar_port_2018
  paragraphs: []
  answer: The Supreme Court upheld the High Court's order for reinstatement but modified the back wages to be reduced to 40%
    from 2012 until the date of his joining. The Court did not find any further necessity to examine the respondent's certificate
    as the Port Trust had previously accepted his qualifications.
  source: IndicLegalQA
  file: 2018_chairman_v_o_chidambaranar_p_v_capt_paul_nadar_bennet_singh_2018_13_942_949.pdf
- query: What conditions did the Supreme Court place on Capt. Paul Nadar Bennet Singh's reinstatement?
  case_id: the_chairman_v_o_chidambaranar_port_2018
  paragraphs: []
  answer: The Supreme Court emphasized that the judgment was passed based on the special facts and circumstances of the case
    and should not be treated as a precedent. Capt. Paul Nadar Bennet Singh was to be reinstated with reduced back wages,
    taking into account the period he did not work from 2012 until his reinstatement.
  source: IndicLegalQA
  file: 2018_chairman_v_o_chidambaranar_p_v_capt_paul_nadar_bennet_singh_2018_13_942_949.pdf
- query: What was the primary issue in the case of Union of India & Ors. vs Methu Meda?
  case_id: union_of_india_v_methu_meda_2021
  paragraphs: []
  answer: The primary issue was whether the respondent, Methu Meda, who was acquitted of kidnapping charges, was eligible
    for appointment as a Constable in the Central Industrial Security Force (CISF) despite the acquittal being based on the
    benefit of doubt.
  source: IndicLegalQA
  file: 2021_union_of_india_v_methu_meda_2021_8_657_670.pdf
- query: What was the reason for Methu Meda's acquittal in the kidnapping case?
  case_id: union_of_india_v_methu_meda_2021
  paragraphs: []
  answer: Methu Meda was acquitted because the key witnesses, including the complainant and his wife, turned hostile during
    the trial, and the prosecution failed to prove the charges beyond a reasonable doubt.
  source: IndicLegalQA
  file: 2021_union_of_india_v_methu_meda_2021_8_657_670.pdf
- query: What did the Screening Committee decide regarding Methu Meda's eligibility for appointment in CISF?
  case_id: union_of_india_v_methu_meda_2021
  paragraphs: []
  answer: The Screening Committee decided that Methu Meda was not eligible for appointment in CISF because his acquittal was
    not an 'honourable acquittal' but was based on the benefit of doubt.
  source: IndicLegalQA
  file: 2021_union_of_india_v_methu_meda_2021_8_657_670.pdf
- query: How did the High Court of Madhya Pradesh rule regarding Methu Meda's appointment?
  case_id: union_of_india_v_methu_meda_2021
  paragraphs: []
  answer: The High Court of Madhya Pradesh directed the authorities to issue an order for Methu Meda's appointment and training
    in CISF, granting him all consequential benefits except back wages.
  source: IndicLegalQA
  file: 2021_union_of_india_v_methu_meda_2021_8_657_670.pdf
- query: What was the Supreme Court's stance on the concept of 'honourable acquittal' in this case?
  case_id: union_of_india_v_methu_meda_2021
  paragraphs: []
  answer: The Supreme Court emphasized that 'honourable acquittal' means a complete exoneration from the charges, and acquittal
    based on the benefit of doubt does not qualify as 'honourable acquittal'. Thus, the respondent was not automatically entitled
    to employment.
  source: IndicLegalQA
  file: 2021_union_of_india_v_methu_meda_2021_8_657_670.pdf
- query: What was the Supreme Court's final decision regarding the orders of the High Court?
  case_id: union_of_india_v_methu_meda_2021
  paragraphs: []
  answer: The Supreme Court set aside the orders of the High Court, stating that Methu Meda was not eligible for appointment
    in CISF due to the nature of his acquittal, and emphasized the employer's right to assess the suitability of candidates.
  source: IndicLegalQA
  file: 2021_union_of_india_v_methu_meda_2021_8_657_670.pdf
- query: What legal precedents did the Supreme Court rely on in making its decision?
  case_id: union_of_india_v_methu_meda_2021
  paragraphs: []
  answer: The Supreme Court relied on various precedents, including the cases of Avtar Singh vs. Union of India, Mehar Singh,
    and S. Samuthiram, to highlight that acquittal based on the benefit of doubt does not automatically entitle a person to
    employment in sensitive positions.
  source: IndicLegalQA
  file: 2021_union_of_india_v_methu_meda_2021_8_657_670.pdf
- query: What was the primary legal issue in the case of M/S GAIL (India) Limited vs M/S Indian Petrochemicals Corp. Ltd.
    & Ors.?
  case_id: gail_limited_2023
  paragraphs: []
  answer: The primary legal issue was whether the clauses in the contract that allowed GAIL to levy 'loss of transportation
    charges' on IPCL were valid and enforceable, considering IPCL had to lay down its own pipelines as mandated by the allocation
    letter from the Ministry of Petroleum and Natural Gas.
  source: IndicLegalQA
  file: 2023_m_s_gail_india_limited_v_m_s_indian_petrochemicals_co_2023_2_326_338.pdf
- query: What was IPCL's main contention regarding the transportation charges levied by GAIL?
  case_id: gail_limited_2023
  paragraphs: []
  answer: IPCL contended that the transportation charges levied by GAIL were arbitrary and unfair, as IPCL was mandated to
    lay its own pipelines for gas transportation and did not use GAIL's pipelines. They also claimed that the charges were
    contrary to the Government pricing orders and sought a refund of the 'loss of transportation charges' paid.
  source: IndicLegalQA
  file: 2023_m_s_gail_india_limited_v_m_s_indian_petrochemicals_co_2023_2_326_338.pdf
- query: What was GAIL's defense for imposing the 'loss of transportation charges' on IPCL?
  case_id: gail_limited_2023
  paragraphs: []
  answer: GAIL defended the imposition of 'loss of transportation charges' by arguing that it had made significant investments
    in constructing its own infrastructure (the HBJ pipeline) and needed to recover legitimate maintenance costs. GAIL also
    argued that both parties were public sector enterprises at the time of contract signing and that the contract reflected
    mutual consensus.
  source: IndicLegalQA
  file: 2023_m_s_gail_india_limited_v_m_s_indian_petrochemicals_co_2023_2_326_338.pdf
- query: What was the decision of the Single Judge and the Division Bench regarding the disputed clauses in the contract?
  case_id: gail_limited_2023
  paragraphs: []
  answer: The Single Judge quashed the disputed clauses as being contrary to the Government pricing orders, unfair, and unconscionable.
    This decision was upheld by the Division Bench, which affirmed the Single Judge's observations and ruled in favor of IPCL.
  source: IndicLegalQA
  file: 2023_m_s_gail_india_limited_v_m_s_indian_petrochemicals_co_2023_2_326_338.pdf
- query: What did the Supreme Court conclude about the validity of the 'loss of transportation charges' clauses?
  case_id: gail_limited_2023
  paragraphs: []
  answer: The Supreme Court concluded that the clauses allowing GAIL to levy 'loss of transportation charges' were arbitrary,
    unfair, and discriminatory, as IPCL was mandated to use its own pipelines and not GAIL's HBJ pipeline. The Court ruled
    that such charges violated Article 14 of the Constitution of India, which ensures the right to equality.
  source: IndicLegalQA
  file: 2023_m_s_gail_india_limited_v_m_s_indian_petrochemicals_co_2023_2_326_338.pdf
- query: What relief did the Supreme Court grant regarding the refund of the transportation charges?
  case_id: gail_limited_2023
  paragraphs: []
  answer: The Supreme Court restricted the relief to a refund of transportation charges paid within three years prior to the
    filing of the writ petition by IPCL. The Court ordered that the refund should be made within two months from the judgment
    date, failing which it would carry an interest of 8% per annum.
  source: IndicLegalQA
  file: 2023_m_s_gail_india_limited_v_m_s_indian_petrochemicals_co_2023_2_326_338.pdf
- query: What was the main issue in the case of Rajasthan High Court, Jodhpur vs. Akashdeep Morya & Anr.?
  case_id: rajasthan_high_court_jodhpur_2021
  paragraphs: []
  answer: The main issue was whether Akashdeep Morya deserved to be appointed to the Civil Judges' cadre despite his involvement
    in several criminal cases.
  source: IndicLegalQA
  file: 2021_rajasthan_high_court_jodhpur_v_akashdeep_morya_2021_10_723_741.pdf
- query: What was the decision of the Rajasthan High Court regarding Akashdeep Morya's appointment?
  case_id: rajasthan_high_court_jodhpur_2021
  paragraphs: []
  answer: The Rajasthan High Court allowed the writ petition filed by Akashdeep Morya, which challenged the decision of the
    High Court Committee that he did not deserve the appointment.
  source: IndicLegalQA
  file: 2021_rajasthan_high_court_jodhpur_v_akashdeep_morya_2021_10_723_741.pdf
- query: What were the criminal cases against Akashdeep Morya mentioned in the judgment?
  case_id: rajasthan_high_court_jodhpur_2021
  paragraphs: []
  answer: 'There were four criminal cases against Akashdeep Morya: FIR No. 81/1999, FIR No. 75/2011, FIR No. 106/2011, and
    FIR No. 98/2012. The cases involved various charges including assault, cheating, and causing hurt.'
  source: IndicLegalQA
  file: 2021_rajasthan_high_court_jodhpur_v_akashdeep_morya_2021_10_723_741.pdf
- query: How did the Committee of the High Court initially handle Akashdeep Morya's case?
  case_id: rajasthan_high_court_jodhpur_2021
  paragraphs: []
  answer: The Committee initially resolved not to recommend Akashdeep Morya for the Civil Judge Cadre due to his antecedents
    and involvement in multiple criminal cases, and this decision was reaffirmed after several reexaminations.
  source: IndicLegalQA
  file: 2021_rajasthan_high_court_jodhpur_v_akashdeep_morya_2021_10_723_741.pdf
- query: What was the final decision of the Supreme Court in this case?
  case_id: rajasthan_high_court_jodhpur_2021
  paragraphs: []
  answer: The Supreme Court allowed the appeal, setting aside the High Court's judgment that had allowed Akashdeep Morya's
    appointment, thereby upholding the decision of the Rajasthan High Court Committee to not appoint him to the Civil Judges'
    cadre.
  source: IndicLegalQA
  file: 2021_rajasthan_high_court_jodhpur_v_akashdeep_morya_2021_10_723_741.pdf
- query: On what grounds did the Supreme Court find the High Court's judgment erroneous?
  case_id: rajasthan_high_court_jodhpur_2021
  paragraphs: []
  answer: The Supreme Court found the High Court's judgment erroneous because it did not adequately consider the gravity of
    the criminal charges against Akashdeep Morya and the fact that his acquittals were not based on a lack of evidence but
    on compromises.
  source: IndicLegalQA
  file: 2021_rajasthan_high_court_jodhpur_v_akashdeep_morya_2021_10_723_741.pdf
- query: What was the main legal issue in the case of Lekh Raj vs Ranjit Singh?
  case_id: lekh_raj_2017
  paragraphs: []
  answer: The main issue was whether the decree passed in 1965 regarding the agricultural land was executable despite objections
    raised by the judgment-debtors about its validity under the amended Punjab Custom (Power to Contest) Act, 1973.
  source: IndicLegalQA
  file: 2017_lekh_raj_dead_l_rs_v_ranjit_singh_2017_7_542_550.pdf
- query: What objections were raised by the judgment-debtors in the execution proceedings?
  case_id: lekh_raj_2017
  paragraphs: []
  answer: The objections included claims that the execution was time-barred, that the decree became nullity due to the amendment
    in 1973, and that the decree holders had not deposited the required amount within the stipulated time.
  source: IndicLegalQA
  file: 2017_lekh_raj_dead_l_rs_v_ranjit_singh_2017_7_542_550.pdf
- query: What did the Supreme Court conclude about the impact of the 1973 amendment on the decree?
  case_id: lekh_raj_2017
  paragraphs: []
  answer: The Supreme Court concluded that the 1973 amendment did not impact the decree since the rights of the parties were
    finalized in 1965, well before the amendment came into effect.
  source: IndicLegalQA
  file: 2017_lekh_raj_dead_l_rs_v_ranjit_singh_2017_7_542_550.pdf
- query: Why did the Supreme Court reject the argument that the decree was a nullity?
  case_id: lekh_raj_2017
  paragraphs: []
  answer: The Court rejected the argument as the amendment was retroactive, applicable only to pending cases or those initiated
    after 1973, and the decree in question had attained finality in 1965.
  source: IndicLegalQA
  file: 2017_lekh_raj_dead_l_rs_v_ranjit_singh_2017_7_542_550.pdf
- query: What principle did the Supreme Court emphasize regarding the powers of the executing court?
  case_id: lekh_raj_2017
  paragraphs: []
  answer: The Supreme Court emphasized that the executing court cannot go behind the decree and must execute it as passed,
    without re-examining factual or legal objections already settled.
  source: IndicLegalQA
  file: 2017_lekh_raj_dead_l_rs_v_ranjit_singh_2017_7_542_550.pdf
- query: What was the Supreme Court's final decision in this case?
  case_id: lekh_raj_2017
  paragraphs: []
  answer: The Supreme Court dismissed the appeal filed by the judgment-debtors and upheld the validity of the execution proceedings,
    allowing the decree holders to proceed with the execution.
  source: IndicLegalQA
  file: 2017_lekh_raj_dead_l_rs_v_ranjit_singh_2017_7_542_550.pdf
- query: What initiated the legal dispute between Future Coupons Private Limited and Amazon?
  case_id: future_coupons_private_limited_2022
  paragraphs: []
  answer: The legal dispute was initiated by Amazon due to a sale transaction between Future Retail Limited (FRL) and the
    Reliance Group, which Amazon claimed violated their agreements with Future Coupons Private Limited (FCPL). Amazon initiated
    arbitration proceedings before the Singapore International Arbitration Center (SIAC) and sought an emergency relief to
    prevent the transaction.
  source: IndicLegalQA
  file: 2022_future_coupons_private_limit_v_amazon_com_nv_investment_hol_2022_9_293_299.pdf
- query: What was the response of the Delhi High Court to the emergency relief sought by Amazon?
  case_id: future_coupons_private_limited_2022
  paragraphs: []
  answer: The Delhi High Court, by order dated 21st December 2020, concluded that the regulatory authorities had to pass appropriate
    orders considering the representations of both FRL and Amazon before granting approvals for the transaction between FRL
    and the Reliance Group.
  source: IndicLegalQA
  file: 2022_future_coupons_private_limit_v_amazon_com_nv_investment_hol_2022_9_293_299.pdf
- query: What was the outcome of the arbitration proceeding initiated by Amazon?
  case_id: future_coupons_private_limited_2022
  paragraphs: []
  answer: The Emergency Arbitrator, by order dated 25th October 2020, injuncted FRL from taking any steps to materialize the
    deal with Reliance, including proceedings before various regulatory authorities. The Arbitral Tribunal later dismissed
    the applications filed by FRL and FCPL to vacate this award.
  source: IndicLegalQA
  file: 2022_future_coupons_private_limit_v_amazon_com_nv_investment_hol_2022_9_293_299.pdf
- query: What orders did the Supreme Court of India pass concerning the NCLT proceedings?
  case_id: future_coupons_private_limited_2022
  paragraphs: []
  answer: The Supreme Court of India allowed the NCLT proceedings to continue without culminating in a final order of sanction
    of the scheme, as per its order dated 22nd February 2021. Later, the court issued detailed orders for reconsideration
    by the Delhi High Court on the matter.
  source: IndicLegalQA
  file: 2022_future_coupons_private_limit_v_amazon_com_nv_investment_hol_2022_9_293_299.pdf
- query: What was the status of regulatory approvals for the FRL-Reliance transaction?
  case_id: future_coupons_private_limited_2022
  paragraphs: []
  answer: The Competition Commission of India (CCI) and the Securities and Exchange Board of India (SEBI) had approved the
    scheme following the filing of the FRL suit. However, the proceedings for the final sanctioning of the scheme by NCLT
    were pending.
  source: IndicLegalQA
  file: 2022_future_coupons_private_limit_v_amazon_com_nv_investment_hol_2022_9_293_299.pdf
- query: What was the Supreme Court's direction regarding the continuation of the NCLT proceedings?
  case_id: future_coupons_private_limited_2022
  paragraphs: []
  answer: The Supreme Court granted liberty to FRL to approach the Delhi High Court to seek continuation of the NCLT proceedings
    beyond the 8th stage (Meeting of Shareholders and Creditors) and requested the High Court to consider all contentions
    and pass appropriate orders expeditiously.
  source: IndicLegalQA
  file: 2022_future_coupons_private_limit_v_amazon_com_nv_investment_hol_2022_9_293_299.pdf
- query: What was the main legal issue in the case of Securities and Exchange Board of India vs. Kanaiyalal Baldevbhai Patel?
  case_id: securities_and_exchange_board_of_india_2017
  paragraphs: []
  answer: The main legal issue was whether 'non-intermediary front-running' in the securities market constitutes a fraudulent
    and unfair trade practice under the Securities and Exchange Board of India (Prohibition of Fraudulent and Unfair Trade
    Practices relating to Securities Market) Regulations, 2003 (FUTP 2003).
  source: IndicLegalQA
  file: 2017_securities_exchange_board_of_v_shri_kanaiyalal_baldevbhai_p_2017_14_268_300.pdf
- query: What actions were Kanaiyalal Baldevbhai Patel and Dipak Patel accused of in this case?
  case_id: securities_and_exchange_board_of_india_2017
  paragraphs: []
  answer: Kanaiyalal Baldevbhai Patel and Dipak Patel were accused of using confidential information about substantial trading
    orders from Passport India Investment (Mauritius) Ltd. to engage in trading activities before the orders were executed,
    thereby making profits from the subsequent price movements.
  source: IndicLegalQA
  file: 2017_securities_exchange_board_of_v_shri_kanaiyalal_baldevbhai_p_2017_14_268_300.pdf
- query: What was the outcome of the appeals filed by the Securities and Exchange Board of India (SEBI) in this case?
  case_id: securities_and_exchange_board_of_india_2017
  paragraphs: []
  answer: The Supreme Court allowed the appeals filed by SEBI, setting aside the orders of the Securities Appellate Tribunal
    (SAT), and restored the penalties imposed by the adjudicating authority on the respondents for engaging in fraudulent
    and unfair trade practices.
  source: IndicLegalQA
  file: 2017_securities_exchange_board_of_v_shri_kanaiyalal_baldevbhai_p_2017_14_268_300.pdf
- query: How did the Supreme Court interpret the term 'fraud' under Regulation 2(c) of FUTP 2003?
  case_id: securities_and_exchange_board_of_india_2017
  paragraphs: []
  answer: The Supreme Court interpreted 'fraud' under Regulation 2(c) of FUTP 2003 to include any act, expression, omission,
    or concealment, whether deceitful or not, that induces another person to deal in securities, regardless of whether there
    is any wrongful gain or avoidance of any loss.
  source: IndicLegalQA
  file: 2017_securities_exchange_board_of_v_shri_kanaiyalal_baldevbhai_p_2017_14_268_300.pdf
- query: What was the significance of the relationship between Dipak Patel and Kanaiyalal Baldevbhai Patel in the context
    of the case?
  case_id: securities_and_exchange_board_of_india_2017
  paragraphs: []
  answer: Dipak Patel, who was privy to confidential information as a portfolio manager, shared this information with his
    cousin Kanaiyalal Baldevbhai Patel, who then traded on this information. This relationship and the sharing of confidential
    information were central to the finding of fraudulent and unfair trade practices.
  source: IndicLegalQA
  file: 2017_securities_exchange_board_of_v_shri_kanaiyalal_baldevbhai_p_2017_14_268_300.pdf
- query: What did the Supreme Court say about the necessity of proving 'mens rea' for violations under Regulations 3 and 4
    of FUTP 2003?
  case_id: securities_and_exchange_board_of_india_2017
  paragraphs: []
  answer: The Supreme Court stated that proving 'mens rea' (criminal intent) is not an indispensable requirement for violations
    under Regulations 3 and 4 of FUTP 2003. The correct test is one of the preponderance of probabilities rather than proof
    beyond a reasonable doubt.
  source: IndicLegalQA
  file: 2017_securities_exchange_board_of_v_shri_kanaiyalal_baldevbhai_p_2017_14_268_300.pdf
- query: What was the primary issue in the case of Ratnagiri Nagar Parishad vs. Gangaram Narayan Ambekar & Ors.?
  case_id: ratnagiri_nagar_parishad_2020
  paragraphs: []
  answer: The primary issue was whether the Ratnagiri Nagar Parishad could proceed with setting up a Solid Waste Disposal
    Project on the suit property, despite objections from the local residents regarding potential environmental and health
    hazards.
  source: IndicLegalQA
  file: 2020_ratnagiri_nagar_parishad_v_gangaram_narayan_ambekar_2020_6_303_331.pdf
- query: Why did the local residents oppose the Solid Waste Disposal Project in the case?
  case_id: ratnagiri_nagar_parishad_2020
  paragraphs: []
  answer: The local residents opposed the project due to concerns that it would cause severe water pollution, health hazards,
    and environmental damage, particularly due to the project's location on a rocky, sloping area near a river and the Sheel
    Dam, which provides water to Ratnagiri city.
  source: IndicLegalQA
  file: 2020_ratnagiri_nagar_parishad_v_gangaram_narayan_ambekar_2020_6_303_331.pdf
- query: What was the decision of the trial court in this case?
  case_id: ratnagiri_nagar_parishad_2020
  paragraphs: []
  answer: The trial court dismissed the suit filed by the residents, concluding that they had not provided sufficient evidence
    to support their claims of potential environmental and health hazards.
  source: IndicLegalQA
  file: 2020_ratnagiri_nagar_parishad_v_gangaram_narayan_ambekar_2020_6_303_331.pdf
- query: What did the first appellate court decide regarding the suit?
  case_id: ratnagiri_nagar_parishad_2020
  paragraphs: []
  answer: The first appellate court reversed the trial court's decision, decreeing the suit and prohibiting the Ratnagiri
    Nagar Parishad from proceeding with the Solid Waste Disposal Project on the suit property.
  source: IndicLegalQA
  file: 2020_ratnagiri_nagar_parishad_v_gangaram_narayan_ambekar_2020_6_303_331.pdf
- query: On what grounds did the first appellate court support the residents' objections?
  case_id: ratnagiri_nagar_parishad_2020
  paragraphs: []
  answer: The first appellate court supported the residents' objections based on the potential for severe pollution of the
    nearby river and dam, which could endanger the health and safety of the residents in Ratnagiri city and the surrounding
    areas.
  source: IndicLegalQA
  file: 2020_ratnagiri_nagar_parishad_v_gangaram_narayan_ambekar_2020_6_303_331.pdf
- query: How did the Supreme Court of India rule in this appeal?
  case_id: ratnagiri_nagar_parishad_2020
  paragraphs: []
  answer: The Supreme Court of India upheld the first appellate court's decision, agreeing that the potential environmental
    and health risks justified prohibiting the project at the proposed location.
  source: IndicLegalQA
  file: 2020_ratnagiri_nagar_parishad_v_gangaram_narayan_ambekar_2020_6_303_331.pdf
- query: What was the significance of the National Green Tribunal Act in this case?
  case_id: ratnagiri_nagar_parishad_2020
  paragraphs: []
  answer: The National Green Tribunal Act was significant because it established that environmental issues should be adjudicated
    by the National Green Tribunal (NGT), and the Supreme Court noted that the civil court should not have continued with
    the suit concerning environmental questions, but rather the matter should have been handled by the NGT.
  source: IndicLegalQA
  file: 2020_ratnagiri_nagar_parishad_v_gangaram_narayan_ambekar_2020_6_303_331.pdf
- query: What was the Civil Appeal number related to the guardianship petition filed by Perry Kansagra?
  case_id: smriti_madan_kansagra_2021
  paragraphs: []
  answer: The Civil Appeal number related to the guardianship petition filed by Perry Kansagra was Civil Appeal No.3559 of
    2020.
  source: IndicLegalQA
  file: 2021_smriti_madan_kansagra_v_perry_kansagra_2021_10_742_824.pdf
- query: What was the primary legal issue in the guardianship petition filed by Perry Kansagra?
  case_id: smriti_madan_kansagra_2021
  paragraphs: []
  answer: The primary legal issue in the guardianship petition filed by Perry Kansagra was the custody and guardianship of
    their minor son, Aditya Vikram Kansagra.
  source: IndicLegalQA
  file: 2021_smriti_madan_kansagra_v_perry_kansagra_2021_10_742_824.pdf
- query: What were the interim measures ordered by the High Court regarding Perry's access to Aditya?
  case_id: smriti_madan_kansagra_2021
  paragraphs: []
  answer: The High Court permitted Perry to meet Aditya under the supervision of Smriti. These orders were modified from time
    to time to allow Perry access and visitation rights.
  source: IndicLegalQA
  file: 2021_smriti_madan_kansagra_v_perry_kansagra_2021_10_742_824.pdf
- query: What was the outcome of the Family Court's judgment on 12th January 2018 regarding the custody of Aditya?
  case_id: smriti_madan_kansagra_2021
  paragraphs: []
  answer: The Family Court granted custody of Aditya to Perry, which was to come into effect after the end of the academic
    session 2017-2018.
  source: IndicLegalQA
  file: 2021_smriti_madan_kansagra_v_perry_kansagra_2021_10_742_824.pdf
- query: What were the directions issued by the High Court of Delhi in its judgment on 25th February 2020?
  case_id: smriti_madan_kansagra_2021
  paragraphs: []
  answer: The High Court of Delhi affirmed the decision to grant custody of Aditya to Perry and issued directions for Perry
    to file an undertaking to ensure compliance with visitation rights granted to Smriti. Perry was also directed to obtain
    a mirror order from the court in Nairobi reflecting these directions.
  source: IndicLegalQA
  file: 2021_smriti_madan_kansagra_v_perry_kansagra_2021_10_742_824.pdf
- query: What steps were directed by the Supreme Court to safeguard Smriti's visitation rights with Aditya?
  case_id: smriti_madan_kansagra_2021
  paragraphs: []
  answer: The Supreme Court directed Perry to obtain a mirror order from the concerned court in Nairobi, deposit INR 1 Crore
    in the Registry of the Court, and ensure that Aditya's birth and transfer certificates were provided to facilitate his
    schooling in Kenya. Additionally, it granted Smriti the right to engage with Aditya via video calls and provided for her
    visitation during annual vacations.
  source: IndicLegalQA
  file: 2021_smriti_madan_kansagra_v_perry_kansagra_2021_10_742_824.pdf
- query: What was the primary issue in the case of Indian Oil Corporation Limited & Anr. vs. Kerala State Road Transport Corporation
    & Ors.?
  case_id: indian_oil_corporation_limited_2017
  paragraphs: []
  answer: The primary issue was the validity of the policy decision taken by the Government of India regarding the withdrawal
    of diesel subsidies for bulk consumers, which affected the Kerala State Road Transport Corporation and others.
  source: IndicLegalQA
  file: 2017_indian_oil_corporation_limit_v_kerala_state_road_transport__2017_14_507_518.pdf
- query: What was the Kerala State Road Transport Corporation's main argument against the diesel price hike?
  case_id: indian_oil_corporation_limited_2017
  paragraphs: []
  answer: The Kerala State Road Transport Corporation argued that the diesel price hike was arbitrary, illegal, and discriminatory.
    They claimed it violated Articles 12 and 14 of the Constitution of India and sought exemption from being treated as a
    bulk consumer.
  source: IndicLegalQA
  file: 2017_indian_oil_corporation_limit_v_kerala_state_road_transport__2017_14_507_518.pdf
- query: How did the Government of India justify the withdrawal of diesel subsidies for bulk consumers?
  case_id: indian_oil_corporation_limited_2017
  paragraphs: []
  answer: The Government of India justified the withdrawal of diesel subsidies for bulk consumers by stating that it was a
    necessary fiscal policy decision to reduce the subsidy burden on petroleum products, allocate more funds to social sector
    schemes, and ensure the country's long-term energy security.
  source: IndicLegalQA
  file: 2017_indian_oil_corporation_limit_v_kerala_state_road_transport__2017_14_507_518.pdf
- query: What was the Supreme Court's stance on the judicial review of policy decisions related to subsidies?
  case_id: indian_oil_corporation_limited_2017
  paragraphs: []
  answer: The Supreme Court held that policy decisions related to subsidies are not amenable to judicial review. The Court
    emphasized that subsidies are privileges and can be withdrawn at any time. It stated that no right exists to claim a subsidy,
    and such matters are within the domain of fiscal policy.
  source: IndicLegalQA
  file: 2017_indian_oil_corporation_limit_v_kerala_state_road_transport__2017_14_507_518.pdf
- query: What did the Supreme Court decide regarding the interim orders passed by various High Courts?
  case_id: indian_oil_corporation_limited_2017
  paragraphs: []
  answer: The Supreme Court transferred all the writ petitions pending before various High Courts to itself and stayed the
    interim orders passed by the High Courts. It held that in such policy matters, no interim orders should have been passed
    by the High Courts.
  source: IndicLegalQA
  file: 2017_indian_oil_corporation_limit_v_kerala_state_road_transport__2017_14_507_518.pdf
- query: What was the outcome of the Supreme Court's decision in this case?
  case_id: indian_oil_corporation_limited_2017
  paragraphs: []
  answer: The Supreme Court dismissed the writ petitions challenging the policy decision to withdraw diesel subsidies for
    bulk consumers and upheld the Government of India's policy. The appeals and transferred cases were disposed of accordingly.
  source: IndicLegalQA
  file: 2017_indian_oil_corporation_limit_v_kerala_state_road_transport__2017_14_507_518.pdf
- query: What was the main issue in the case of Western Coalfields Ltd. vs. Commissioner of Central Excise, Trichy/Madurai?
  case_id: pr_commissioner_of_income_tax_shimla_2019
  paragraphs: []
  answer: The main issue was whether the period of limitation of six months applied to the refund claim of central excise
    duty made by the buyer (Western Coalfields Ltd.) when the duty was paid by the manufacturer (M/s. Fenner (India) Ltd.)
    under protest.
  source: IndicLegalQA
  file: 2019_pr_commissioner_of_income_ta_v_m_s_aarham_softronics_2019_4_409_432.pdf
- query: Why did the Customs, Excise and Service Tax Appellate Tribunal reject Western Coalfields Ltd.'s claim for a refund?
  case_id: pr_commissioner_of_income_tax_shimla_2019
  paragraphs: []
  answer: The Tribunal rejected the claim because it was filed beyond the six-month limitation period prescribed under Section
    11B of the Central Excise Act, 1944.
  source: IndicLegalQA
  file: 2019_pr_commissioner_of_income_ta_v_m_s_aarham_softronics_2019_4_409_432.pdf
- query: What was the argument made by Western Coalfields Ltd. regarding the period of limitation for their refund claim?
  case_id: pr_commissioner_of_income_tax_shimla_2019
  paragraphs: []
  answer: Western Coalfields Ltd. argued that since the duty was paid by the manufacturer under protest, the six-month limitation
    period should not apply to their refund claim as per the proviso to Section 11B(1) of the Central Excise Act.
  source: IndicLegalQA
  file: 2019_pr_commissioner_of_income_ta_v_m_s_aarham_softronics_2019_4_409_432.pdf
- query: What was the Supreme Court's stance on the distinction between the rights of the manufacturer and the buyer to claim
    a refund under Section 11B?
  case_id: pr_commissioner_of_income_tax_shimla_2019
  paragraphs: []
  answer: The Supreme Court held that the rights of the manufacturer and the buyer to claim a refund under Section 11B are
    separate and distinct. The limitation period of six months applies to the buyer's refund claim, regardless of the protest
    by the manufacturer.
  source: IndicLegalQA
  file: 2019_pr_commissioner_of_income_ta_v_m_s_aarham_softronics_2019_4_409_432.pdf
- query: What was the final decision of the Supreme Court regarding the refund claim of Western Coalfields Ltd.?
  case_id: pr_commissioner_of_income_tax_shimla_2019
  paragraphs: []
  answer: The Supreme Court dismissed the appeals of Western Coalfields Ltd., affirming that the refund claim was time-barred
    as it was filed beyond the six-month limitation period, and the buyer could not benefit from the protest made by the manufacturer.
  source: IndicLegalQA
  file: 2019_pr_commissioner_of_income_ta_v_m_s_aarham_softronics_2019_4_409_432.pdf
- query: What was the primary legal issue in the case of State of Gujarat vs. Reliance Industries Limited?
  case_id: state_of_gujarat_v_reliance_industries_2017
  paragraphs: []
  answer: The primary legal issue was whether the tax credit available under the Gujarat Value Added Tax Act, 2003 (VAT Act)
    should be reduced at the rate of 4% twice for the same goods, under both sub-clauses (ii) and (iii) of Section 11(3)(b).
  source: IndicLegalQA
  file: 2017_state_of_gujarat_v_reliance_industries_ltd_2017_13_25_47.pdf
- query: What was the contention of the State of Gujarat regarding the reduction of tax credit?
  case_id: state_of_gujarat_v_reliance_industries_2017
  paragraphs: []
  answer: The State of Gujarat contended that the tax credit should be reduced by 4% twice, once under sub-clause (ii) for
    goods dispatched outside the State as branch transfer and again under sub-clause (iii) for fuels used in the manufacture
    of goods.
  source: IndicLegalQA
  file: 2017_state_of_gujarat_v_reliance_industries_ltd_2017_13_25_47.pdf
- query: What was the decision of the Gujarat Value Added Tax Tribunal on the issue of tax credit reduction?
  case_id: state_of_gujarat_v_reliance_industries_2017
  paragraphs: []
  answer: The Gujarat Value Added Tax Tribunal decided that the reduction of tax credit should only be at 4% and not twice,
    rejecting the view that it should be reduced again for the same goods under sub-clause (iii).
  source: IndicLegalQA
  file: 2017_state_of_gujarat_v_reliance_industries_ltd_2017_13_25_47.pdf
- query: How did the High Court of Gujarat rule on the appeal against the Tribunal's decision?
  case_id: state_of_gujarat_v_reliance_industries_2017
  paragraphs: []
  answer: The High Court of Gujarat upheld the Tribunal's decision, stating that the tax credit should be reduced by 4% only
    once, not twice.
  source: IndicLegalQA
  file: 2017_state_of_gujarat_v_reliance_industries_ltd_2017_13_25_47.pdf
- query: What was the final ruling of the Supreme Court of India on the matter?
  case_id: state_of_gujarat_v_reliance_industries_2017
  paragraphs: []
  answer: The Supreme Court of India ruled that the reduction of tax credit should indeed be applied at 4% for both sub-clauses
    (ii) and (iii) separately, except in cases where VAT paid on such raw material is already 4%. For fuels like natural gas
    and light diesel oil, the reduction should be at 4% under each sub-clause.
  source: IndicLegalQA
  file: 2017_state_of_gujarat_v_reliance_industries_ltd_2017_13_25_47.pdf
- query: What rationale did the Supreme Court provide for its decision?
  case_id: state_of_gujarat_v_reliance_industries_2017
  paragraphs: []
  answer: The Supreme Court explained that the tax credit scheme under the VAT Act is meant to account for taxes paid on raw
    materials used in manufacturing, and the Legislature's intent was to reduce tax credit by 4% under each applicable provision.
    This ensures that the benefit of tax credit is proportionately adjusted for both manufacturing and branch transfer activities.
  source: IndicLegalQA
  file: 2017_state_of_gujarat_v_reliance_industries_ltd_2017_13_25_47.pdf
- query: What was the main question for consideration in the case Niravkumar Dilipbhai Makwana vs. Gujarat Public Service
    Commission & Ors.?
  case_id: niravkumar_dilipbhai_makwana_2019
  paragraphs: []
  answer: The main question was whether a candidate who has availed of an age relaxation in a selection process as a result
    of belonging to a reserved category can thereafter seek to be accommodated in or migrated to the general category seat.
  source: IndicLegalQA
  file: 2019_niravkumar_dilipbhai_makwana_v_gujarat_public_service_commi_2019_9_47_60.pdf
- query: What were the posts advertised by the Gujarat Public Service Commission in the case Niravkumar Dilipbhai Makwana
    vs. Gujarat Public Service Commission & Ors.?
  case_id: niravkumar_dilipbhai_makwana_2019
  paragraphs: []
  answer: The Gujarat Public Service Commission advertised 47 posts of Assistant Conservator of Forests (Class-II) and 120
    posts of Range Forest Officer (Class-II).
  source: IndicLegalQA
  file: 2019_niravkumar_dilipbhai_makwana_v_gujarat_public_service_commi_2019_9_47_60.pdf
- query: What was the outcome of the preliminary test and main written examination conducted by GPSC in the case Niravkumar
    Dilipbhai Makwana vs. Gujarat Public Service Commission & Ors.?
  case_id: niravkumar_dilipbhai_makwana_2019
  paragraphs: []
  answer: The preliminary test was conducted on 30th May 2010, and the main written examination was held from 27th May 2013
    to 2nd June 2013. The result of the main written examination was declared on 21st May 2014, and 505 candidates who cleared
    the examination were called for a physical measurement test and personal interviews conducted from 16th June 2014 to 31st
    July 2014.
  source: IndicLegalQA
  file: 2019_niravkumar_dilipbhai_makwana_v_gujarat_public_service_commi_2019_9_47_60.pdf
- query: What was the appellant's contention regarding the merit list in the case Niravkumar Dilipbhai Makwana vs. Gujarat
    Public Service Commission & Ors.?
  case_id: niravkumar_dilipbhai_makwana_2019
  paragraphs: []
  answer: The appellant contended that while preparing the merit list, GPSC ignored the judgment of the Supreme Court in Jitendra
    Kumar Singh and Anr. v. State of Uttar Pradesh and Ors., 2010 (3) SCC 119. Therefore, the appellant challenged the correctness
    of the select list before the learned Single Judge of the High Court of Gujarat.
  source: IndicLegalQA
  file: 2019_niravkumar_dilipbhai_makwana_v_gujarat_public_service_commi_2019_9_47_60.pdf
- query: What was the decision of the Division Bench of the High Court in the case Niravkumar Dilipbhai Makwana vs. Gujarat
    Public Service Commission & Ors.?
  case_id: niravkumar_dilipbhai_makwana_2019
  paragraphs: []
  answer: The Division Bench of the High Court allowed the appeal and set aside the order of the learned Single Judge. The
    court held that candidates who avail of age relaxation are not entitled to be considered in the general category and must
    be considered only for reserved category seats.
  source: IndicLegalQA
  file: 2019_niravkumar_dilipbhai_makwana_v_gujarat_public_service_commi_2019_9_47_60.pdf
- query: What was the Supreme Court's final decision in the case Niravkumar Dilipbhai Makwana vs. Gujarat Public Service Commission
    & Ors.?
  case_id: niravkumar_dilipbhai_makwana_2019
  paragraphs: []
  answer: The Supreme Court dismissed the appeal, holding that the age relaxation granted to candidates belonging to SC/ST
    and SEBC categories is an incident of reservation under Article 16(4) of the Constitution of India, and such candidates
    cannot be accommodated in the general category seats.
  source: IndicLegalQA
  file: 2019_niravkumar_dilipbhai_makwana_v_gujarat_public_service_commi_2019_9_47_60.pdf
- query: What was the main issue in the case of Zonal Manager, Bank of India vs. Aarya K. Babu & Anr. decided on 8th August
    2019?
  case_id: zonal_manager_bank_of_india_zonal_2019
  paragraphs: []
  answer: The main issue was whether candidates possessing a B.Sc. in Forestry degree qualified for the post of Agricultural
    Field Officer (Scale-1) when the recruitment notification specified a degree in Agro-Forestry.
  source: IndicLegalQA
  file: 2019_zonal_manager_bank_of_india__v_aarya_k_babu_2019_11_627_639.pdf
- query: How did the Supreme Court view the inclusion of B.Sc. (Forestry) as an eligible qualification in the recruitment
    process?
  case_id: zonal_manager_bank_of_india_zonal_2019
  paragraphs: []
  answer: The Supreme Court held that including B.Sc. (Forestry) as an eligible qualification midstream, without prior notification,
    would be unfair to other candidates who did not apply because they did not meet the original criteria.
  source: IndicLegalQA
  file: 2019_zonal_manager_bank_of_india__v_aarya_k_babu_2019_11_627_639.pdf
- query: What procedural direction did the Supreme Court issue regarding the appellant in the case of Zonal Manager, Bank
    of India vs. Aarya K. Babu?
  case_id: zonal_manager_bank_of_india_zonal_2019
  paragraphs: []
  answer: The Supreme Court directed the Bank of India to provide a fresh appointment to Aarya K. Babu as an Agricultural
    Field Officer or an equivalent post, treating it as a fresh appointment without retrospective benefits.
  source: IndicLegalQA
  file: 2019_zonal_manager_bank_of_india__v_aarya_k_babu_2019_11_627_639.pdf
- query: What prediction can be made about the implications of the Supreme Court's judgment in the Zonal Manager, Bank of
    India vs. Aarya K. Babu case?
  case_id: zonal_manager_bank_of_india_zonal_2019
  paragraphs: []
  answer: The judgment reinforces the principle that recruitment criteria must be adhered to as published and that changes
    during the process must allow equal opportunity for all eligible candidates.
  source: IndicLegalQA
  file: 2019_zonal_manager_bank_of_india__v_aarya_k_babu_2019_11_627_639.pdf
- query: What clarification did the Supreme Court provide regarding the High Court's ruling in the Zonal Manager, Bank of
    India vs. Aarya K. Babu case?
  case_id: zonal_manager_bank_of_india_zonal_2019
  paragraphs: []
  answer: The Supreme Court clarified that the High Court's decision to equate B.Sc. (Forestry) with B.Sc. (Agro-Forestry)
    for eligibility was not justified, as such equivalence should be established by recruitment authorities, not the judiciary.
  source: IndicLegalQA
  file: 2019_zonal_manager_bank_of_india__v_aarya_k_babu_2019_11_627_639.pdf
- query: What was the primary issue in the case of Mohd. Sahid & Ors. vs Raziya Khanam (D) Thr. LRs & Anr.?
  case_id: mohd_sahid_2018
  paragraphs: []
  answer: The primary issue was whether the delay of 349 days in filing an appeal against the ex-parte decree should be condoned.
  source: IndicLegalQA
  file: 2018_mohd_sahid_v_raziya_khanam_d_lrs_2018_12_963_971.pdf
- query: Why did Raziya Khanam file Civil Suit No. 591 of 1979?
  case_id: mohd_sahid_2018
  paragraphs: []
  answer: Raziya Khanam filed the suit for cancellation of sale deeds dated 17th February 1979 and 17th May 1979 in favor
    of the appellants and for a permanent injunction against them over the suit land.
  source: IndicLegalQA
  file: 2018_mohd_sahid_v_raziya_khanam_d_lrs_2018_12_963_971.pdf
- query: What was the outcome of Civil Suit No. 591 of 1979?
  case_id: mohd_sahid_2018
  paragraphs: []
  answer: The suit was decreed ex-parte on 16th April 1981 against the appellants for not filing a written statement despite
    being given ample time.
  source: IndicLegalQA
  file: 2018_mohd_sahid_v_raziya_khanam_d_lrs_2018_12_963_971.pdf
- query: Why did the First Appellate Court initially allow the appeal filed by the appellants in 1985?
  case_id: mohd_sahid_2018
  paragraphs: []
  answer: The First Appellate Court allowed the appeal because it found that the minor appellant Mohd. Asid had not been properly
    served, and the case was remanded back to the trial court for a fresh decision.
  source: IndicLegalQA
  file: 2018_mohd_sahid_v_raziya_khanam_d_lrs_2018_12_963_971.pdf
- query: What was the High Court's decision regarding the application for condonation of delay?
  case_id: mohd_sahid_2018
  paragraphs: []
  answer: The High Court dismissed the application for condonation of delay, finding the reasons given by the appellants to
    be self-contradictory and not a sufficient cause for the delay.
  source: IndicLegalQA
  file: 2018_mohd_sahid_v_raziya_khanam_d_lrs_2018_12_963_971.pdf
- query: What did the appellants claim about their knowledge of the judgment dated 10th May 2012?
  case_id: mohd_sahid_2018
  paragraphs: []
  answer: The appellants claimed they only came to know about the judgment on 6th May 2013 when a constable informed them,
    but this was found to be incorrect.
  source: IndicLegalQA
  file: 2018_mohd_sahid_v_raziya_khanam_d_lrs_2018_12_963_971.pdf
- query: What did the trial court records indicate about the appellants' presence in court?
  case_id: mohd_sahid_2018
  paragraphs: []
  answer: The trial court records indicated that the appellants were present in court on 14th October 2011, contradicting
    their claim of not knowing about the proceedings.
  source: IndicLegalQA
  file: 2018_mohd_sahid_v_raziya_khanam_d_lrs_2018_12_963_971.pdf
- query: Why did the Supreme Court dismiss the appeal filed by Mohd. Sahid & Ors.?
  case_id: mohd_sahid_2018
  paragraphs: []
  answer: The Supreme Court dismissed the appeal because the appellants had full knowledge of the proceedings and had been
    negligent in pursuing the matter. There was no sufficient cause to condone the delay.
  source: IndicLegalQA
  file: 2018_mohd_sahid_v_raziya_khanam_d_lrs_2018_12_963_971.pdf
- query: What did the Supreme Court say about the factual position depicted in the High Court's order?
  case_id: mohd_sahid_2018
  paragraphs: []
  answer: The Supreme Court noted that the factual position depicted in paragraphs 6 and 7 of the High Court's order was false
    and incorrect but did not affect the correctness of the impugned order.
  source: IndicLegalQA
  file: 2018_mohd_sahid_v_raziya_khanam_d_lrs_2018_12_963_971.pdf
- query: What was the primary issue in the case of Bhaskar Shrachi Alloys Ltd. vs Damodar Valley Corporation & Ors.?
  case_id: bhaskar_shrachi_alloys_ltd_etc_etc_2018
  paragraphs: []
  answer: The primary issue was whether the tariff determined by the Central Electricity Regulatory Commission (CERC) under
    the Electricity Act, 2003, or the tariff determined by the Damodar Valley Corporation (DVC) under the Damodar Valley Corporation
    Act, 1948, should prevail.
  source: IndicLegalQA
  file: 2018_bhaskar_shrachi_alloys_ltd_v_damodar_valley_corporation_2018_10_773_809.pdf
- query: What was the High Court's decision regarding the tariff determination?
  case_id: bhaskar_shrachi_alloys_ltd_etc_etc_2018
  paragraphs: []
  answer: The High Court upheld the tariff determined by the CERC, ruling that the provisions of the Electricity Act, 2003,
    took precedence over the Damodar Valley Corporation Act, 1948, for tariff determination.
  source: IndicLegalQA
  file: 2018_bhaskar_shrachi_alloys_ltd_v_damodar_valley_corporation_2018_10_773_809.pdf
- query: What was the Appellate Tribunal for Electricity's stance on the tariff issue?
  case_id: bhaskar_shrachi_alloys_ltd_etc_etc_2018
  paragraphs: []
  answer: The Appellate Tribunal for Electricity also upheld the CERC's tariff determination, agreeing that the 2003 Act superseded
    the 1948 Act in matters of tariff.
  source: IndicLegalQA
  file: 2018_bhaskar_shrachi_alloys_ltd_v_damodar_valley_corporation_2018_10_773_809.pdf
- query: What were the key provisions of the Damodar Valley Corporation Act, 1948, related to this case?
  case_id: bhaskar_shrachi_alloys_ltd_etc_etc_2018
  paragraphs: []
  answer: The key provisions included Sections 32, 37, 38, 39, and 40, which dealt with financial aspects such as expenditure,
    depreciation, allowances, and interest payments, relevant to tariff determination.
  source: IndicLegalQA
  file: 2018_bhaskar_shrachi_alloys_ltd_v_damodar_valley_corporation_2018_10_773_809.pdf
- query: What was the Supreme Court's interpretation of the fourth proviso to Section 14 of the Electricity Act, 2003?
  case_id: bhaskar_shrachi_alloys_ltd_etc_etc_2018
  paragraphs: []
  answer: The Supreme Court interpreted the proviso to mean that the provisions of the Damodar Valley Corporation Act, 1948,
    that are not inconsistent with the Electricity Act, 2003, shall continue to apply to the Corporation.
  source: IndicLegalQA
  file: 2018_bhaskar_shrachi_alloys_ltd_v_damodar_valley_corporation_2018_10_773_809.pdf
- query: How did the Supreme Court address the issue of conflicting provisions between the 1948 Act and the 2003 Act?
  case_id: bhaskar_shrachi_alloys_ltd_etc_etc_2018
  paragraphs: []
  answer: The Supreme Court held that the specific provisions of the 1948 Act, which were consistent with the 2003 Act, would
    continue to apply, but any inconsistencies would be resolved in favor of the 2003 Act.
  source: IndicLegalQA
  file: 2018_bhaskar_shrachi_alloys_ltd_v_damodar_valley_corporation_2018_10_773_809.pdf
- query: What was the Supreme Court's view on the jurisdiction of the CERC regarding tariff determination?
  case_id: bhaskar_shrachi_alloys_ltd_etc_etc_2018
  paragraphs: []
  answer: The Supreme Court affirmed that the CERC had the jurisdiction to determine the tariff for DVC under the Electricity
    Act, 2003, thereby overriding the tariff set by DVC under the 1948 Act.
  source: IndicLegalQA
  file: 2018_bhaskar_shrachi_alloys_ltd_v_damodar_valley_corporation_2018_10_773_809.pdf
- query: What were the financial considerations highlighted by the CERC in determining the tariff?
  case_id: bhaskar_shrachi_alloys_ltd_etc_etc_2018
  paragraphs: []
  answer: The CERC considered various factors including capital cost, return on equity, interest on loans, depreciation, operational
    norms, and fuel price adjustment while determining the tariff.
  source: IndicLegalQA
  file: 2018_bhaskar_shrachi_alloys_ltd_v_damodar_valley_corporation_2018_10_773_809.pdf
- query: What was the final decision of the Supreme Court in this case?
  case_id: bhaskar_shrachi_alloys_ltd_etc_etc_2018
  paragraphs: []
  answer: The Supreme Court upheld the decision of the CERC and the Appellate Tribunal, confirming that the tariff determined
    by the CERC under the Electricity Act, 2003, would prevail over the tariff determined by DVC under the Damodar Valley
    Corporation Act, 1948.
  source: IndicLegalQA
  file: 2018_bhaskar_shrachi_alloys_ltd_v_damodar_valley_corporation_2018_10_773_809.pdf
- query: What was the primary legal issue in the case of The State of Haryana & Ors. vs Hindustan Construction Company Ltd.?
  case_id: the_state_of_haryanaand_others_2017
  paragraphs: []
  answer: The primary issue was whether the exercise of revisional power under Section 40 of the Haryana General Sales Tax
    Act, 1973, after its repeal by the Haryana Value Added Tax, 2003, was sustainable.
  source: IndicLegalQA
  file: 2017_state_of_haryanaand_v_hindustan_construction_compa_2017_9_482_489.pdf
- query: Why did the High Court rule against the State of Haryana's exercise of revisional power?
  case_id: the_state_of_haryanaand_others_2017
  paragraphs: []
  answer: The High Court ruled against it because the repeal and saving clause in Section 61 of the Haryana Value Added Tax,
    2003, saved only pending proceedings under the former Act, and there were no proceedings pending against the respondent
    when the new Act came into force.
  source: IndicLegalQA
  file: 2017_state_of_haryanaand_v_hindustan_construction_compa_2017_9_482_489.pdf
- query: What was the respondent's position regarding the refund initially ordered under the Haryana General Sales Tax Act,
    1973?
  case_id: the_state_of_haryanaand_others_2017
  paragraphs: []
  answer: The respondent, Hindustan Construction Company Ltd., argued that the refund was obtained lawfully, and the revisional
    power exercised by the State to recover the refund was not justified after the repeal of the Act.
  source: IndicLegalQA
  file: 2017_state_of_haryanaand_v_hindustan_construction_compa_2017_9_482_489.pdf
- query: What did the Supreme Court conclude regarding the application of the Punjab General Clauses Act, 1898, in this case?
  case_id: the_state_of_haryanaand_others_2017
  paragraphs: []
  answer: The Supreme Court concluded that the application of the Punjab General Clauses Act, 1898, was excluded by the express
    contrary intention manifested in Section 61 of the Haryana Value Added Tax, 2003.
  source: IndicLegalQA
  file: 2017_state_of_haryanaand_v_hindustan_construction_compa_2017_9_482_489.pdf
- query: What precedents did the State of Haryana rely on to support its case?
  case_id: the_state_of_haryanaand_others_2017
  paragraphs: []
  answer: The State of Haryana relied on the precedents set in Raymond Ltd. and Anr. vs State of Chhattisgarh & Ors. and Swastik
    Oil Mills Ltd. vs H.B. Munshi, Deputy Commissioner of Sales Tax, Bombay, arguing that revisional power should be used
    to ensure lawful assessments.
  source: IndicLegalQA
  file: 2017_state_of_haryanaand_v_hindustan_construction_compa_2017_9_482_489.pdf
- query: What procedural actions did the State of Haryana take regarding the disputed refund?
  case_id: the_state_of_haryanaand_others_2017
  paragraphs: []
  answer: The State of Haryana issued a show cause notice to Hindustan Construction Company Ltd. on 7th June 2004, regarding
    the refund ordered earlier, and subsequently, an order for recovery was made on 12th July 2004.
  source: IndicLegalQA
  file: 2017_state_of_haryanaand_v_hindustan_construction_compa_2017_9_482_489.pdf
- query: What was the Supreme Court's directive concerning the appeals filed by the State of Haryana?
  case_id: the_state_of_haryanaand_others_2017
  paragraphs: []
  answer: The Supreme Court dismissed the appeals, upholding the High Court's decision that the exercise of revisional power
    under the repealed Act was unsustainable.
  source: IndicLegalQA
  file: 2017_state_of_haryanaand_v_hindustan_construction_compa_2017_9_482_489.pdf
- query: What impact could the Supreme Court's decision have on future cases involving repealed statutes and revisional powers?
  case_id: the_state_of_haryanaand_others_2017
  paragraphs: []
  answer: The decision clarifies that revisional powers cannot be exercised under a repealed statute unless explicitly saved
    by the new enactment, potentially influencing future cases involving similar circumstances.
  source: IndicLegalQA
  file: 2017_state_of_haryanaand_v_hindustan_construction_compa_2017_9_482_489.pdf
- query: What clarifying statements did the Supreme Court make regarding the repeal and saving clause in the new Act?
  case_id: the_state_of_haryanaand_others_2017
  paragraphs: []
  answer: The Supreme Court clarified that the repeal and saving clause in Section 61 of the Haryana Value Added Tax, 2003,
    intended to save only pending proceedings and not to reopen matters already closed under the repealed Act.
  source: IndicLegalQA
  file: 2017_state_of_haryanaand_v_hindustan_construction_compa_2017_9_482_489.pdf
- query: What might the State of Haryana do to prevent similar legal challenges in the future?
  case_id: the_state_of_haryanaand_others_2017
  paragraphs: []
  answer: The State of Haryana might ensure that any new enactments clearly articulate the scope of saved proceedings and
    explicitly address any potential conflicts with the General Clauses Act to avoid similar legal challenges.
  source: IndicLegalQA
  file: 2017_state_of_haryanaand_v_hindustan_construction_compa_2017_9_482_489.pdf
- query: Why did the Supreme Court find it necessary to consider the factual position of the adjacent land?
  case_id: the_state_of_haryanaand_others_2017
  paragraphs: []
  answer: The Supreme Court found it necessary to consider the factual position to determine if the quality of the land justified
    the different compensation amounts, emphasizing the importance of accurate factual determination in legal decisions.
  source: IndicLegalQA
  file: 2017_state_of_haryanaand_v_hindustan_construction_compa_2017_9_482_489.pdf
- query: What was the primary legal issue in the case of K. Arjun Das vs Commissioner of Endowments, Orissa?
  case_id: k_arjun_das_2019
  paragraphs: []
  answer: The primary issue was whether the sale of the deity's land by the Commissioner of Endowments at a fixed price was
    valid and beneficial to the deity, and if the Division Bench of the High Court erred in directing a public auction at
    a higher upset price.
  source: IndicLegalQA
  file: 2019_k_arjun_das_v_commissioner_of_endowments_o_2019_13_307_322.pdf
- query: What was the decision of the Commissioner of Endowments regarding the sale of the deity's land?
  case_id: k_arjun_das_2019
  paragraphs: []
  answer: The Commissioner of Endowments granted permission for the sale of the deity's land at Rs. 10 lakhs per acre, offering
    the first choice to the appellant, K. Arjun Das, who was in possession of the land as a tenant.
  source: IndicLegalQA
  file: 2019_k_arjun_das_v_commissioner_of_endowments_o_2019_13_307_322.pdf
- query: Why did the Division Bench of the High Court set aside the sale deed executed in favor of K. Arjun Das?
  case_id: k_arjun_das_2019
  paragraphs: []
  answer: The Division Bench of the High Court set aside the sale deed because it found no evidence supporting the appellant's
    tenancy claim and determined that the upset price of Rs. 10 lakhs per acre was arbitrary, directing a public auction at
    Rs. 25 lakhs per acre instead.
  source: IndicLegalQA
  file: 2019_k_arjun_das_v_commissioner_of_endowments_o_2019_13_307_322.pdf
- query: What evidence did the appellant, K. Arjun Das, provide to support his claim of tenancy?
  case_id: k_arjun_das_2019
  paragraphs: []
  answer: K. Arjun Das provided receipts of bhag (share) payments to the deity, notices from the Inspector of Endowments,
    and affidavits indicating his possession of the land for over 40 years as a tenant.
  source: IndicLegalQA
  file: 2019_k_arjun_das_v_commissioner_of_endowments_o_2019_13_307_322.pdf
- query: What was the Supreme Court's view on the High Court's directive for a public auction at a higher upset price?
  case_id: k_arjun_das_2019
  paragraphs: []
  answer: The Supreme Court found the High Court's directive for a public auction at Rs. 25 lakhs per acre to be legally unsustainable
    and not supported by the evidence on record, which showed that the Commissioner of Endowments had acted within his authority
    and due process.
  source: IndicLegalQA
  file: 2019_k_arjun_das_v_commissioner_of_endowments_o_2019_13_307_322.pdf
- query: What procedural step did the State Government take after the Commissioner's order for the sale of the land?
  case_id: k_arjun_das_2019
  paragraphs: []
  answer: The State Government initiated suo motu proceedings to review the Commissioner's order under sub-section (5) of
    Section 19 of the Orissa Hindu Religious Endowments Act, 1951, and directed a public auction for the remaining land not
    yet sold.
  source: IndicLegalQA
  file: 2019_k_arjun_das_v_commissioner_of_endowments_o_2019_13_307_322.pdf
- query: What could be the impact of the Supreme Court's decision on future endowment land sales?
  case_id: k_arjun_das_2019
  paragraphs: []
  answer: The decision reinforces the necessity for endowment authorities to follow due process and ensure the best interests
    of the deity are served, potentially influencing future decisions and preventing arbitrary changes in upset prices.
  source: IndicLegalQA
  file: 2019_k_arjun_das_v_commissioner_of_endowments_o_2019_13_307_322.pdf
- query: How might endowment authorities ensure compliance with statutory provisions in future land sales?
  case_id: k_arjun_das_2019
  paragraphs: []
  answer: Endowment authorities should meticulously follow the provisions of the Orissa Hindu Religious Endowments Act, 1951,
    ensuring proper valuation, notice, and adherence to prescribed procedures for the sale of land.
  source: IndicLegalQA
  file: 2019_k_arjun_das_v_commissioner_of_endowments_o_2019_13_307_322.pdf
- query: What clarifying statements did the Supreme Court make regarding the role of the deity's trustees and managers?
  case_id: k_arjun_das_2019
  paragraphs: []
  answer: The Supreme Court clarified that trustees and managers of the deity are responsible for protecting the deity's interests
    and ensuring that any alienation of property is conducted transparently, benefitting the deity.
  source: IndicLegalQA
  file: 2019_k_arjun_das_v_commissioner_of_endowments_o_2019_13_307_322.pdf
- query: Why did the Supreme Court emphasize the need for comprehensive evaluation of all evidence?
  case_id: k_arjun_das_2019
  paragraphs: []
  answer: The Supreme Court emphasized this to highlight the importance of a thorough and fair assessment of all presented
    evidence to establish the validity of claims and decisions, ensuring justice is served.
  source: IndicLegalQA
  file: 2019_k_arjun_das_v_commissioner_of_endowments_o_2019_13_307_322.pdf
- query: What was the Supreme Court's final directive concerning the appeals filed by K. Arjun Das?
  case_id: k_arjun_das_2019
  paragraphs: []
  answer: The Supreme Court allowed the appeals, set aside the judgement of the Division Bench of the High Court, and restored
    the orders of the Single Judge and the Commissioner of Endowments, validating the sale of the land at Rs. 10 lakhs per
    acre to K. Arjun Das.
  source: IndicLegalQA
  file: 2019_k_arjun_das_v_commissioner_of_endowments_o_2019_13_307_322.pdf
- query: What was the main legal issue in the case of Union of India & Anr vs Onkar Nath Dhar?
  case_id: union_of_india_v_onkar_nath_2021
  paragraphs: []
  answer: The main issue was whether Onkar Nath Dhar, a retired Intelligence Bureau officer and a Kashmiri migrant, was entitled
    to retain government accommodation indefinitely due to the prevailing conditions in Jammu & Kashmir.
  source: IndicLegalQA
  file: 2021_union_of_india_v_onkar_nath_dhar_2021_8_194_211.pdf
- query: What were the initial actions taken by Onkar Nath Dhar regarding his government accommodation?
  case_id: union_of_india_v_onkar_nath_2021
  paragraphs: []
  answer: Onkar Nath Dhar requested to retain the government accommodation after his retirement in 2006, citing the unsafe
    conditions in Jammu & Kashmir. His request was initially allowed for one year.
  source: IndicLegalQA
  file: 2021_union_of_india_v_onkar_nath_dhar_2021_8_194_211.pdf
- query: What was the decision of the High Court of Punjab & Haryana regarding Dhar's accommodation?
  case_id: union_of_india_v_onkar_nath_2021
  paragraphs: []
  answer: The High Court upheld Dhar's right to retain the accommodation indefinitely, considering the unsafe conditions in
    Jammu & Kashmir and citing a similar case, J.L. Koul v. State of J & K.
  source: IndicLegalQA
  file: 2021_union_of_india_v_onkar_nath_dhar_2021_8_194_211.pdf
- query: How did the Supreme Court rule on the issue of retaining government accommodation for retired officials?
  case_id: union_of_india_v_onkar_nath_2021
  paragraphs: []
  answer: The Supreme Court ruled that government accommodation is meant for serving officers and not retirees. It set aside
    the High Court's decision, granting Dhar time until 31st October 2021 to vacate the premises.
  source: IndicLegalQA
  file: 2021_union_of_india_v_onkar_nath_dhar_2021_8_194_211.pdf
- query: What procedural steps did Onkar Nath Dhar take after receiving the eviction notice?
  case_id: union_of_india_v_onkar_nath_2021
  paragraphs: []
  answer: Dhar challenged the eviction order under the Public Premises (Eviction of Unauthorised Occupants) Act, 1971, and
    initially obtained a stay from the Additional District Judge, Delhi, before moving to the Court of learned Additional
    District Judge, Faridabad.
  source: IndicLegalQA
  file: 2021_union_of_india_v_onkar_nath_dhar_2021_8_194_211.pdf
- query: What is the Supreme Court's stance on the right to shelter for retired government employees?
  case_id: union_of_india_v_onkar_nath_2021
  paragraphs: []
  answer: The Supreme Court stated that the right to shelter does not extend to retaining government accommodation indefinitely.
    It emphasized that such accommodation is intended for serving officers.
  source: IndicLegalQA
  file: 2021_union_of_india_v_onkar_nath_dhar_2021_8_194_211.pdf
- query: What clarifications did the Supreme Court provide regarding the use of Article 142 in this case?
  case_id: union_of_india_v_onkar_nath_2021
  paragraphs: []
  answer: The Supreme Court clarified that directions under Article 142, such as those given in J.L. Koul's case, are specific
    to the facts of the case and should not be treated as general law applicable in all similar circumstances.
  source: IndicLegalQA
  file: 2021_union_of_india_v_onkar_nath_dhar_2021_8_194_211.pdf
- query: What might be the impact of the Supreme Court's decision on other retired government officials occupying government
    accommodations?
  case_id: union_of_india_v_onkar_nath_2021
  paragraphs: []
  answer: The decision may lead to the eviction of other retired officials occupying government accommodations and reinforce
    the policy that such housing is for serving officers only.
  source: IndicLegalQA
  file: 2021_union_of_india_v_onkar_nath_dhar_2021_8_194_211.pdf
- query: What should retired government employees do to comply with housing policies after retirement?
  case_id: union_of_india_v_onkar_nath_2021
  paragraphs: []
  answer: Retired government employees should vacate government accommodations promptly after retirement and make alternative
    housing arrangements, as per the applicable policies.
  source: IndicLegalQA
  file: 2021_union_of_india_v_onkar_nath_dhar_2021_8_194_211.pdf
- query: What procedural directive did the Supreme Court give to the Union of India regarding retired officials in government
    accommodations?
  case_id: union_of_india_v_onkar_nath_2021
  paragraphs: []
  answer: The Supreme Court directed the Union of India to submit a report on the action taken against retired officials occupying
    government accommodations by 15th November 2021.
  source: IndicLegalQA
  file: 2021_union_of_india_v_onkar_nath_dhar_2021_8_194_211.pdf
- query: How should the government balance the need for housing for serving officers with the humanitarian concerns for displaced
    persons?
  case_id: union_of_india_v_onkar_nath_2021
  paragraphs: []
  answer: The government should provide temporary transit accommodations or cash compensation to displaced persons while ensuring
    that permanent government accommodations are reserved for serving officers.
  source: IndicLegalQA
  file: 2021_union_of_india_v_onkar_nath_dhar_2021_8_194_211.pdf
- query: What was the primary legal issue in the case of State of Punjab & Ors. vs Dev Brat Sharma?
  case_id: state_of_punjab_v_dev_brat_2022
  paragraphs: []
  answer: The primary legal issue was whether Dev Brat Sharma was required to make good the deficiency in court fees on the
    amount of Rs. 20 lakhs claimed by him as compensation for denying the status of freedom fighter and the resultant damages.
  source: IndicLegalQA
  file: 2022_state_of_punjab_v_dev_brat_sharma_2022_2_528_545.pdf
- query: What were the allegations made by Dev Brat Sharma in his suit against the State of Punjab?
  case_id: state_of_punjab_v_dev_brat_2022
  paragraphs: []
  answer: Dev Brat Sharma alleged that he suffered damages due to being denied the status of a freedom fighter by the defendants
    and sought Rs. 20 lakhs as compensation for the loss of reputation and other damages.
  source: IndicLegalQA
  file: 2022_state_of_punjab_v_dev_brat_sharma_2022_2_528_545.pdf
- query: What was the High Court's decision regarding the requirement to pay court fees in the case?
  case_id: state_of_punjab_v_dev_brat_2022
  paragraphs: []
  answer: The High Court set aside the Trial Court's order requiring Dev Brat Sharma to make good the deficiency in court
    fees on the amount of Rs. 20 lakhs, holding that the exact valuation of the relief could not be ascertained at the initial
    stage.
  source: IndicLegalQA
  file: 2022_state_of_punjab_v_dev_brat_sharma_2022_2_528_545.pdf
- query: What procedural step did the State of Punjab take after the High Court's decision?
  case_id: state_of_punjab_v_dev_brat_2022
  paragraphs: []
  answer: The State of Punjab filed an appeal to the Supreme Court, challenging the High Court's decision to set aside the
    Trial Court's order regarding the payment of court fees.
  source: IndicLegalQA
  file: 2022_state_of_punjab_v_dev_brat_sharma_2022_2_528_545.pdf
- query: What did the Supreme Court conclude regarding the applicability of ad valorem court fees in this case?
  case_id: state_of_punjab_v_dev_brat_2022
  paragraphs: []
  answer: The Supreme Court concluded that the suit for damages and compensation filed by Dev Brat Sharma required the payment
    of ad valorem court fees based on the amount claimed, which was Rs. 20 lakhs.
  source: IndicLegalQA
  file: 2022_state_of_punjab_v_dev_brat_sharma_2022_2_528_545.pdf
- query: What clarification did the Supreme Court provide regarding the valuation of suits for the purpose of court fees?
  case_id: state_of_punjab_v_dev_brat_2022
  paragraphs: []
  answer: The Supreme Court clarified that for money suits, including suits for damages and compensation, the court fees should
    be paid based on the amount claimed, and not on a tentative amount.
  source: IndicLegalQA
  file: 2022_state_of_punjab_v_dev_brat_sharma_2022_2_528_545.pdf
- query: What impact might the Supreme Court's decision have on future suits for damages and compensation?
  case_id: state_of_punjab_v_dev_brat_2022
  paragraphs: []
  answer: The decision may ensure that plaintiffs in future suits for damages and compensation properly pay ad valorem court
    fees based on the actual amount claimed, thus preventing undervaluation of claims.
  source: IndicLegalQA
  file: 2022_state_of_punjab_v_dev_brat_sharma_2022_2_528_545.pdf
- query: What should plaintiffs consider when filing suits for damages to comply with court fee requirements?
  case_id: state_of_punjab_v_dev_brat_2022
  paragraphs: []
  answer: Plaintiffs should ensure that they accurately state the amount of damages claimed and pay the corresponding ad valorem
    court fees at the time of filing the suit to comply with legal requirements.
  source: IndicLegalQA
  file: 2022_state_of_punjab_v_dev_brat_sharma_2022_2_528_545.pdf
- query: What procedural directive did the Supreme Court give regarding the payment of court fees in this case?
  case_id: state_of_punjab_v_dev_brat_2022
  paragraphs: []
  answer: The Supreme Court directed Dev Brat Sharma to pay the court fees on the amount of Rs. 20 lakhs claimed within four
    weeks from the date of the judgment.
  source: IndicLegalQA
  file: 2022_state_of_punjab_v_dev_brat_sharma_2022_2_528_545.pdf
- query: How might this judgment affect the handling of similar cases in the future?
  case_id: state_of_punjab_v_dev_brat_2022
  paragraphs: []
  answer: This judgment may set a precedent for stricter enforcement of court fee requirements in suits for damages and compensation,
    ensuring proper valuation and payment at the initial stage of filing.
  source: IndicLegalQA
  file: 2022_state_of_punjab_v_dev_brat_sharma_2022_2_528_545.pdf
- query: What were the Supreme Court's directions regarding the appeal process for Dev Brat Sharma?
  case_id: state_of_punjab_v_dev_brat_2022
  paragraphs: []
  answer: The Supreme Court directed that Dev Brat Sharma must state the valuation and make the necessary payment of court
    fees for the appeal before proceeding further in the appellate court.
  source: IndicLegalQA
  file: 2022_state_of_punjab_v_dev_brat_sharma_2022_2_528_545.pdf
- query: What was the main issue in the case of The Silppi Constructions Contractors vs. Union of India and Anr.?
  case_id: silppi_constructions_contractors_2019
  paragraphs: []
  answer: The main issue was the rejection of the technical bids of The Silppi Constructions Contractors by the tendering
    authorities, and the subsequent appeals and writ petitions regarding the rejection.
  source: IndicLegalQA
  file: 2019_silppi_constructions_contrac_v_union_of_india_2019_10_932_948.pdf
- query: Why were the technical bids of The Silppi Constructions Contractors rejected by the tendering authorities?
  case_id: silppi_constructions_contractors_2019
  paragraphs: []
  answer: The technical bids were rejected because the petitioner did not satisfy the eligibility criteria, and there were
    adverse remarks against the petitioner's sister company, Silppi Realtors and Contractors Pvt. Ltd.
  source: IndicLegalQA
  file: 2019_silppi_constructions_contrac_v_union_of_india_2019_10_932_948.pdf
- query: What were the decisions of the learned single judge and the division bench of the High Court in this case?
  case_id: silppi_constructions_contractors_2019
  paragraphs: []
  answer: The learned single judge allowed the writ petition, directing the respondents to consider the financial bid of the
    petitioner. The division bench, however, allowed the writ appeals, emphasizing limited interference in contractual matters
    and upholding the rejection based on adverse remarks against the sister company.
  source: IndicLegalQA
  file: 2019_silppi_constructions_contrac_v_union_of_india_2019_10_932_948.pdf
- query: What was the petitioner's argument regarding the adverse remarks against its sister company?
  case_id: silppi_constructions_contractors_2019
  paragraphs: []
  answer: The petitioner argued that the adverse remarks against its sister company should not affect its own bid, as the
    sister company had not renewed its enlistment and the remarks were not justified.
  source: IndicLegalQA
  file: 2019_silppi_constructions_contrac_v_union_of_india_2019_10_932_948.pdf
- query: How did the Supreme Court view the requirement of giving reasons for rejecting tenders in administrative decisions?
  case_id: silppi_constructions_contractors_2019
  paragraphs: []
  answer: The Supreme Court held that in purely administrative decisions, such as rejecting tenders, the authority is not
    required to give reasons at every stage, as this could hinder the commercial activities of the state.
  source: IndicLegalQA
  file: 2019_silppi_constructions_contrac_v_union_of_india_2019_10_932_948.pdf
- query: What was the Supreme Court's stance on the eligibility criteria for the tender in this case?
  case_id: silppi_constructions_contractors_2019
  paragraphs: []
  answer: The Supreme Court found that the petitioner firm was not eligible to submit the tender as it was not an enlisted
    contractor in the 'SS' Class and did not meet the necessary criteria.
  source: IndicLegalQA
  file: 2019_silppi_constructions_contrac_v_union_of_india_2019_10_932_948.pdf
- query: Why did the Supreme Court accept the use of adverse remarks against the sister company in evaluating the petitioner's
    bid?
  case_id: silppi_constructions_contractors_2019
  paragraphs: []
  answer: The Supreme Court accepted the use of adverse remarks because the petitioner firm and the sister company were related
    firms with a business relationship, and the sister company had not challenged or addressed the adverse remarks.
  source: IndicLegalQA
  file: 2019_silppi_constructions_contrac_v_union_of_india_2019_10_932_948.pdf
- query: What did the Supreme Court say about the necessity of making all tenderers parties in a writ petition?
  case_id: silppi_constructions_contractors_2019
  paragraphs: []
  answer: The Supreme Court stated that making all tenderers parties in a writ petition is not always necessary, especially
    if the writ petition challenges the rejection of a technical bid at an early stage before any successful tenderer is determined.
  source: IndicLegalQA
  file: 2019_silppi_constructions_contrac_v_union_of_india_2019_10_932_948.pdf
- query: How might this judgement impact future tender processes involving public sector undertakings?
  case_id: silppi_constructions_contractors_2019
  paragraphs: []
  answer: This judgement could reinforce the principle of limited judicial interference in tender processes, emphasizing that
    public sector undertakings have the discretion to make administrative decisions without constant judicial scrutiny.
  source: IndicLegalQA
  file: 2019_silppi_constructions_contrac_v_union_of_india_2019_10_932_948.pdf
- query: What could be the broader implications of this judgement on the relationship between private contractors and government
    agencies?
  case_id: silppi_constructions_contractors_2019
  paragraphs: []
  answer: The broader implications might include a stricter adherence to eligibility criteria and a heightened scrutiny of
    business relationships between related firms, potentially leading to more careful compliance by private contractors when
    dealing with government tenders.
  source: IndicLegalQA
  file: 2019_silppi_constructions_contrac_v_union_of_india_2019_10_932_948.pdf
- query: What principle did the Supreme Court reiterate regarding the judicial review of administrative decisions in contract
    matters?
  case_id: silppi_constructions_contractors_2019
  paragraphs: []
  answer: The Supreme Court reiterated that judicial review in contract matters should be exercised with great restraint,
    only intervening in cases of clear arbitrariness, irrationality, mala fides, or bias.
  source: IndicLegalQA
  file: 2019_silppi_constructions_contrac_v_union_of_india_2019_10_932_948.pdf
- query: What was the primary legal issue addressed in the case The Employees Provident Fund Organisation & Anr. etc. vs.
    Sunil Kumar B. & Ors. etc.?
  case_id: the_employees_provident_fund_organisation_2022
  paragraphs: []
  answer: The primary legal issue addressed was the legality of certain amendments and modifications made by the Central Government
    to the Employees' Pension Scheme, 1995, specifically related to the determination of pensionable salary and the impact
    of the 2014 amendments which capped the salary at Rs. 15,000 for pension calculations.
  source: IndicLegalQA
  file: 2022_employees_provident_fund_org_v_sunil_kumar_b_2022_11_959_1000.pdf
- query: What changes were introduced by the 2014 amendments to the Employees' Pension Scheme, 1995?
  case_id: the_employees_provident_fund_organisation_2022
  paragraphs: []
  answer: The 2014 amendments to the Employees' Pension Scheme, 1995 included raising the maximum pensionable salary to Rs.
    15,000 per month, requiring employees drawing more than Rs. 15,000 per month to contribute at an additional rate of 1.16%,
    and changing the computation of pensionable salary to be based on the average monthly pay drawn during the contributory
    period of service in the span of 60 months preceding the date of exit.
  source: IndicLegalQA
  file: 2022_employees_provident_fund_org_v_sunil_kumar_b_2022_11_959_1000.pdf
- query: What was the ruling of the Kerala High Court regarding the 2014 amendments to the Employees' Pension Scheme, 1995?
  case_id: the_employees_provident_fund_organisation_2022
  paragraphs: []
  answer: The Kerala High Court ruled that the 2014 amendments to the Employees' Pension Scheme, 1995 were invalid. The court
    held that the amendments were arbitrary, especially the capping of the salary at Rs. 15,000 for pension calculations and
    the requirement for employees to contribute an additional 1.16% on salaries exceeding Rs. 15,000. The court found that
    these amendments deprived employees of benefits without any justification.
  source: IndicLegalQA
  file: 2022_employees_provident_fund_org_v_sunil_kumar_b_2022_11_959_1000.pdf
- query: How did the Supreme Court of India respond to the appeals against the High Court judgements regarding the 2014 amendments?
  case_id: the_employees_provident_fund_organisation_2022
  paragraphs: []
  answer: The Supreme Court of India allowed the appeals against the High Court judgements, thereby upholding the legality
    of the 2014 amendments to the Employees' Pension Scheme, 1995. The court acknowledged the financial implications of the
    scheme and the need for sustainable pension funding, agreeing with the Central Government's amendments.
  source: IndicLegalQA
  file: 2022_employees_provident_fund_org_v_sunil_kumar_b_2022_11_959_1000.pdf
- query: What were the key arguments made by the employees challenging the 2014 amendments to the Employees' Pension Scheme,
    1995?
  case_id: the_employees_provident_fund_organisation_2022
  paragraphs: []
  answer: The key arguments made by the employees were that the 2014 amendments were arbitrary and deprived them of their
    rightful pension benefits. They argued that the capping of the pensionable salary at Rs. 15,000 was unrealistic and deprived
    them of a decent pension. They also contended that the additional 1.16% contribution lacked statutory backing and that
    the amendments unfairly penalized employees who had been contributing on actual salaries exceeding the previous cap.
  source: IndicLegalQA
  file: 2022_employees_provident_fund_org_v_sunil_kumar_b_2022_11_959_1000.pdf
- query: What is the significance of the judgement in the case of R.C. Gupta and Others vs. Regional Provident Fund Commissioner
    in relation to the Employees' Pension Scheme?
  case_id: the_employees_provident_fund_organisation_2022
  paragraphs: []
  answer: The judgement in the case of R.C. Gupta and Others vs. Regional Provident Fund Commissioner was significant as it
    addressed the issue of entitlement of members whose pensionable salary exceeded the ceiling limit to exercise an option
    under the proviso to paragraph 11(3) of the scheme. The Supreme Court held that the dates specified in clause 11(3) were
    not cut-off dates and that a beneficial scheme should not be defeated by a cut-off date, especially when employers had
    contributed based on actual salaries.
  source: IndicLegalQA
  file: 2022_employees_provident_fund_org_v_sunil_kumar_b_2022_11_959_1000.pdf
- query: What was the Supreme Court's final decision regarding the 2014 amendments to the Employees' Pension Scheme, 1995?
  case_id: the_employees_provident_fund_organisation_2022
  paragraphs: []
  answer: The Supreme Court's final decision was to uphold the 2014 amendments to the Employees' Pension Scheme, 1995. The
    court recognized the financial sustainability concerns raised by the Central Government and found that the amendments
    were necessary to ensure the continued viability of the pension scheme.
  source: IndicLegalQA
  file: 2022_employees_provident_fund_org_v_sunil_kumar_b_2022_11_959_1000.pdf
- query: What was the compensation awarded by the Workmen’s Compensation Commissioner in this case?
  case_id: commanding_officer_railway_protection_special_force_2023
  paragraphs: []
  answer: The Commissioner awarded Rs. 4,33,820 along with 9% interest, payable within 30 days of the order, for the accidental
    death of the constable during employment.
  source: IndicLegalQA
  file: 2023_commanding_officer_railway_p_v_bhavnaben_dinshbhai_bhabhor_2023_12_660_681.pdf
- query: What was the appellant's argument regarding the definition of a 'workman' under the Employees Compensation Act, 1923?
  case_id: commanding_officer_railway_protection_special_force_2023
  paragraphs: []
  answer: The appellant argued that under Section 2(1)(n) of the 1923 Act, a member of the Armed Forces of the Union is excluded
    from the definition of a 'workman,' and as RPF is declared an Armed Force, the claim was not maintainable.
  source: IndicLegalQA
  file: 2023_commanding_officer_railway_p_v_bhavnaben_dinshbhai_bhabhor_2023_12_660_681.pdf
- query: How did the Supreme Court address the legislative intent behind declaring the RPF as an Armed Force?
  case_id: commanding_officer_railway_protection_special_force_2023
  paragraphs: []
  answer: The Supreme Court stated that declaring the RPF as an Armed Force of the Union did not intend to exclude its members
    from the benefits of the Employees Compensation Act, as they are deemed railway servants under the Railways Act, 1989.
  source: IndicLegalQA
  file: 2023_commanding_officer_railway_p_v_bhavnaben_dinshbhai_bhabhor_2023_12_660_681.pdf
- query: What was the Supreme Court's decision regarding the applicability of the Employees Compensation Act, 1923, to the
    RPF constable?
  case_id: commanding_officer_railway_protection_special_force_2023
  paragraphs: []
  answer: The Supreme Court held that the provisions of the Employees Compensation Act, 1923, apply to RPF members, as they
    are considered railway servants and not explicitly excluded by the Act.
  source: IndicLegalQA
  file: 2023_commanding_officer_railway_p_v_bhavnaben_dinshbhai_bhabhor_2023_12_660_681.pdf
- query: What broader implications does this judgement have for members of the RPF?
  case_id: commanding_officer_railway_protection_special_force_2023
  paragraphs: []
  answer: The judgement affirms that RPF members are entitled to compensation under the Employees Compensation Act, 1923,
    providing clarity on their eligibility despite being declared part of the Armed Forces.
  source: IndicLegalQA
  file: 2023_commanding_officer_railway_p_v_bhavnaben_dinshbhai_bhabhor_2023_12_660_681.pdf
- query: What was the primary issue in the case of Vishwabandhu vs. Sri Krishna and Anr.?
  case_id: vishwabandhu_2021
  paragraphs: []
  answer: The primary issue was the recovery of Rs. 22,400/- along with interest, which Respondent No.1 (Sri Krishna) had
    failed to refund as part sale consideration for a property sale agreement.
  source: IndicLegalQA
  file: 2021_vishwabandhu_v_sri_krishna_2021_9_15_22.pdf
- query: What was the outcome of the ex-parte decree passed on 16th September 1997 in the case?
  case_id: vishwabandhu_2021
  paragraphs: []
  answer: An ex-parte decree was passed in favor of Respondent No.2, awarding Rs. 22,400/- along with 9% interest, as the
    defendant (Sri Krishna) failed to appear in court.
  source: IndicLegalQA
  file: 2021_vishwabandhu_v_sri_krishna_2021_9_15_22.pdf
- query: What action did Respondent No.2 take after obtaining the ex-parte decree?
  case_id: vishwabandhu_2021
  paragraphs: []
  answer: Respondent No.2 filed for the execution of the decree, leading to the attachment and auction of the property, where
    Vishwabandhu became the highest bidder.
  source: IndicLegalQA
  file: 2021_vishwabandhu_v_sri_krishna_2021_9_15_22.pdf
- query: What was the High Court's decision on 21st April 2006 regarding the ex-parte decree?
  case_id: vishwabandhu_2021
  paragraphs: []
  answer: The High Court set aside the ex-parte decree and ordered the trial court to decide the case on merits after giving
    opportunities to both parties.
  source: IndicLegalQA
  file: 2021_vishwabandhu_v_sri_krishna_2021_9_15_22.pdf
- query: What was the Supreme Court's final decision in this case?
  case_id: vishwabandhu_2021
  paragraphs: []
  answer: The Supreme Court allowed the appeals, set aside the High Court's orders dated 21st April 2006 and 18th October
    2019, and dismissed the application filed by Respondent No.1 to set aside the ex-parte decree.
  source: IndicLegalQA
  file: 2021_vishwabandhu_v_sri_krishna_2021_9_15_22.pdf
- query: Why did the arbitrator increase the rate of compensation in the case of State of Haryana vs. M/s. Shiv Shankar Construction
    Co. & Anr.?
  case_id: state_of_haryana_v_m_s_2021
  paragraphs: []
  answer: The arbitrator increased the rate of compensation from Rs. 1,000 per km per month to Rs. 45,000 per km per month,
    citing additional expenditure incurred by the contractor due to a substantial increase in traffic volume on the road.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_m_s_shiv_shankar_constructio_2021_12_294_303.pdf
- query: What was the Supreme Court's stance on the arbitrator awarding compensation for periods after the diversion of traffic
    ended?
  case_id: state_of_haryana_v_m_s_2021
  paragraphs: []
  answer: The Supreme Court held that awarding compensation for periods after January 2008, when the diversion of traffic
    ceased, was impermissible and set aside that part of the award.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_m_s_shiv_shankar_constructio_2021_12_294_303.pdf
- query: What was the Supreme Court's interpretation of the contractor's claim about the estimated traffic volume in the original
    contract?
  case_id: state_of_haryana_v_m_s_2021
  paragraphs: []
  answer: The Supreme Court interpreted that the original contract had estimated a traffic volume of 3,364 PCUs per day, but
    the actual traffic reached 24,418 PCUs per day due to diversion, justifying a revision of compensation for the period
    during the increased traffic.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_m_s_shiv_shankar_constructio_2021_12_294_303.pdf
- query: What procedural directive did the Supreme Court provide about recalculating the compensation amount?
  case_id: state_of_haryana_v_m_s_2021
  paragraphs: []
  answer: The Supreme Court directed that the compensation be recalculated for the period up to January 2008, when the additional
    traffic existed, and the excess amount awarded beyond this period be quashed.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_m_s_shiv_shankar_constructio_2021_12_294_303.pdf
- query: What did the Supreme Court conclude about the arbitrator's decision to revise the contract terms?
  case_id: state_of_haryana_v_m_s_2021
  paragraphs: []
  answer: The Court concluded that the arbitrator's decision to revise the contract terms and increase the compensation rate
    constituted rewriting the contract, which exceeded the arbitrator's authority under the Arbitration and Conciliation Act,
    1996.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_m_s_shiv_shankar_constructio_2021_12_294_303.pdf
- query: What clarification did the Supreme Court provide regarding the scope of claims that can be entertained in arbitration?
  case_id: state_of_haryana_v_m_s_2021
  paragraphs: []
  answer: The Supreme Court clarified that arbitrators must adjudicate only within the scope of claims explicitly submitted
    by the parties and cannot expand or modify the claims unilaterally.
  source: IndicLegalQA
  file: 2021_state_of_haryana_v_m_s_shiv_shankar_constructio_2021_12_294_303.pdf
- query: Why did the Supreme Court overturn the High Court's interim order in this case?
  case_id: saregama_india_limited_2021
  paragraphs: []
  answer: The Supreme Court found that the High Court exceeded its jurisdiction by rewriting Rule 29(4) at the interim stage,
    which was impermissible and undermined the statutory framework of the Copyright Act.
  source: IndicLegalQA
  file: 2021_saregama_india_limited_v_next_radio_limited_2021_9_137_151.pdf
- query: What procedural directive did the Supreme Court issue regarding the High Court's handling of Rule 29(4)?
  case_id: saregama_india_limited_2021
  paragraphs: []
  answer: The Supreme Court directed the High Court to resolve the constitutional challenge to Rule 29(4) without further
    interim modifications and ensure compliance with the statutory framework.
  source: IndicLegalQA
  file: 2021_saregama_india_limited_v_next_radio_limited_2021_9_137_151.pdf
- query: What did the Supreme Court state about the balance between judicial review and legislative authority in this case?
  case_id: saregama_india_limited_2021
  paragraphs: []
  answer: The Supreme Court stated that while judicial review can evaluate the validity of statutory rules, it cannot supplant
    or rewrite legislative provisions through judicial interpretation.
  source: IndicLegalQA
  file: 2021_saregama_india_limited_v_next_radio_limited_2021_9_137_151.pdf
- query: How did the Supreme Court interpret the mandatory nature of prior notice under Rule 29(4) of the Copyright Rules?
  case_id: saregama_india_limited_2021
  paragraphs: []
  answer: The Supreme Court interpreted that prior notice under Rule 29(4) is a statutory mandate that ensures transparency
    and protects the rights of copyright owners, making it non-negotiable.
  source: IndicLegalQA
  file: 2021_saregama_india_limited_v_next_radio_limited_2021_9_137_151.pdf
- query: What was the Supreme Court's final ruling regarding the High Court's interim modification of Rule 29(4)?
  case_id: saregama_india_limited_2021
  paragraphs: []
  answer: The Supreme Court set aside the High Court's interim order, emphasizing that statutory rules must be adhered to
    unless constitutionally invalidated.
  source: IndicLegalQA
  file: 2021_saregama_india_limited_v_next_radio_limited_2021_9_137_151.pdf
- query: What was the initial order passed by the High Court of Madras that was challenged in the Supreme Court?
  case_id: varadarajan_2020
  paragraphs: []
  answer: The initial order dated 27th November 2007 passed by the High Court of Judicature at Madras in revision petition
    under Section 115 of the Code of Civil Procedure, 1908 was challenged in the Supreme Court.
  source: IndicLegalQA
  file: 2020_varadarajan_v_kanakavalli_2020_1_132_144.pdf
- query: What was the main issue in the revision petition filed in the High Court of Madras?
  case_id: varadarajan_2020
  paragraphs: []
  answer: The main issue in the revision petition was the order passed by the Executing Court on 19th September 2005, which
    directed the possession of the suit property to be given to Varadarajan as the legal representative of Umadevi, based
    on a decree in favor of Umadevi.
  source: IndicLegalQA
  file: 2020_varadarajan_v_kanakavalli_2020_1_132_144.pdf
- query: What was the claim of Umadevi regarding the suit property?
  case_id: varadarajan_2020
  paragraphs: []
  answer: Umadevi claimed a half share in the suit property as the successor-in-interest of her husband, Manicka Naicker,
    and filed a suit for partition and separate possession. This suit was decreed on 7th April 1989.
  source: IndicLegalQA
  file: 2020_varadarajan_v_kanakavalli_2020_1_132_144.pdf
- query: Why was the Will executed by Umadevi challenged by the respondents?
  case_id: varadarajan_2020
  paragraphs: []
  answer: The respondents challenged the Will executed by Umadevi, asserting that it was forged and that the son of a sister
    is not a legal heir as per Section 15 of the Hindu Succession Act, 1956.
  source: IndicLegalQA
  file: 2020_varadarajan_v_kanakavalli_2020_1_132_144.pdf
- query: What was the decision of the High Court regarding the Will executed by Umadevi?
  case_id: varadarajan_2020
  paragraphs: []
  answer: The High Court found that the execution of the Will was surrounded by suspicious circumstances and concluded that
    the Will had not been proved genuine. Consequently, the legatee under the said Will could not be considered a legal representative
    to maintain the execution petition.
  source: IndicLegalQA
  file: 2020_varadarajan_v_kanakavalli_2020_1_132_144.pdf
- query: What was the final decision of the Supreme Court regarding the order passed by the High Court?
  case_id: varadarajan_2020
  paragraphs: []
  answer: The Supreme Court found that the High Court's order was not sustainable in law, set it aside, and restored the order
    of the Executing Court. The Supreme Court concluded that Varadarajan, as the legal representative of Umadevi, was entitled
    to execute the decree.
  source: IndicLegalQA
  file: 2020_varadarajan_v_kanakavalli_2020_1_132_144.pdf
- query: What procedural directive did the Supreme Court issue regarding the monetary grant policy for work-charged employees?
  case_id: state_of_madhya_pradesh_v_amit_2020
  paragraphs: []
  answer: The Court emphasized that monetary grants, as specified in the policy, should be uniformly applied to dependents
    of work-charged employees unless explicitly amended by law.
  source: IndicLegalQA
  file: 2020_state_of_madhya_pradesh_v_amit_shrivas_2020_11_46_58.pdf
- query: How did the Supreme Court interpret the compassionate appointment policy dated 18th August 2008 in this case?
  case_id: state_of_madhya_pradesh_v_amit_2020
  paragraphs: []
  answer: The Court interpreted that the policy categorically excluded work-charged employees from compassionate appointments
    and replaced such entitlement with a financial grant of Rs. 1,00,000.
  source: IndicLegalQA
  file: 2020_state_of_madhya_pradesh_v_amit_shrivas_2020_11_46_58.pdf
- query: Why did the Supreme Court reject the argument that attaining permanent status conferred eligibility for compassionate
    appointments?
  case_id: state_of_madhya_pradesh_v_amit_2020
  paragraphs: []
  answer: The Court rejected this argument by distinguishing between 'permanent' and 'regular' status, stating that permanent
    status only entitled the employee to benefits like pension, not compassionate appointment rights.
  source: IndicLegalQA
  file: 2020_state_of_madhya_pradesh_v_amit_shrivas_2020_11_46_58.pdf
- query: What clarifying point did the Supreme Court make about cases pending prior to the 31st August 2016 policy amendment?
  case_id: state_of_madhya_pradesh_v_amit_2020
  paragraphs: []
  answer: The Court clarified that such cases must be decided based on the policy in force at the time of the employee's demise,
    rather than applying the later amendment retrospectively.
  source: IndicLegalQA
  file: 2020_state_of_madhya_pradesh_v_amit_shrivas_2020_11_46_58.pdf
- query: What was the Supreme Court's final ruling regarding the compassionate appointment claim by Amit Shrivas?
  case_id: state_of_madhya_pradesh_v_amit_2020
  paragraphs: []
  answer: The Supreme Court denied the claim for compassionate appointment but exercised its powers under Article 142 to increase
    the monetary grant from Rs. 1,00,000 to Rs. 2,00,000 to provide relief to the respondent.
  source: IndicLegalQA
  file: 2020_state_of_madhya_pradesh_v_amit_shrivas_2020_11_46_58.pdf
- query: What was the main issue in the case of Bijay Kumar Singh vs. Amit Kumar Chamariya decided on 22nd October 2019?
  case_id: bijay_kumar_singh_2019
  paragraphs: []
  answer: The main issue was whether the appellants were liable for eviction on the grounds of non-payment of arrears of rent
    under the West Bengal Premises Tenancy Act, 1997.
  source: IndicLegalQA
  file: 2019_bijay_kumar_singh_v_amit_kumar_chamariya_2019_13_1028_1043.pdf
- query: What interpretation did the Supreme Court provide regarding the deposit of rent by tenants?
  case_id: bijay_kumar_singh_2019
  paragraphs: []
  answer: The Supreme Court interpreted that the deposit of arrears of rent, accompanied by an application for determination,
    is a mandatory requirement to avoid eviction under Section 7(2) of the West Bengal Premises Tenancy Act, 1997.
  source: IndicLegalQA
  file: 2019_bijay_kumar_singh_v_amit_kumar_chamariya_2019_13_1028_1043.pdf
- query: What prediction did the Court make about the implications of not following statutory requirements in tenancy cases?
  case_id: bijay_kumar_singh_2019
  paragraphs: []
  answer: The Court predicted that allowing tenants to bypass statutory requirements for depositing arrears would undermine
    the legislative intent and lead to judicial uncertainty.
  source: IndicLegalQA
  file: 2019_bijay_kumar_singh_v_amit_kumar_chamariya_2019_13_1028_1043.pdf
- query: What was the Supreme Court's stance on judicial decorum in this case?
  case_id: bijay_kumar_singh_2019
  paragraphs: []
  answer: The Court held that the Single Judge should have maintained judicial decorum by referring the matter to a larger
    Bench for clarity on conflicting interpretations.
  source: IndicLegalQA
  file: 2019_bijay_kumar_singh_v_amit_kumar_chamariya_2019_13_1028_1043.pdf
- query: What was the outcome of the case decided on 22nd October 2019?
  case_id: bijay_kumar_singh_2019
  paragraphs: []
  answer: The Supreme Court dismissed the appeals, affirming the High Court’s decision that the appellants failed to comply
    with mandatory provisions of the tenancy law.
  source: IndicLegalQA
  file: 2019_bijay_kumar_singh_v_amit_kumar_chamariya_2019_13_1028_1043.pdf
- query: What was the central issue in the case of Balwant Singh vs. Dungar Singh?
  case_id: balwant_singh_2020
  paragraphs: []
  answer: The central issue was whether the arbitral award dividing the family properties between the brothers Balwant Singh
    and Dungar Singh should be upheld as a rule of court despite objections from Balwant Singh.
  source: IndicLegalQA
  file: 2020_balwant_singh_d_lr_v_dungar_singh_d_lrs_2020_1_609_615.pdf
- query: What objection did Balwant Singh raise against the arbitral award?
  case_id: balwant_singh_2020
  paragraphs: []
  answer: Balwant Singh objected to the arbitral award on grounds that the arbitrators conducted the proceedings hurriedly
    and did not allow sufficient time for him to present his case, rendering the award unclear and unjustifiable.
  source: IndicLegalQA
  file: 2020_balwant_singh_d_lr_v_dungar_singh_d_lrs_2020_1_609_615.pdf
- query: What was the decision of the District Judge regarding the arbitral award in the case of Balwant Singh vs. Dungar
    Singh?
  case_id: balwant_singh_2020
  paragraphs: []
  answer: The District Judge dismissed the application to make the arbitral award a rule of the court, citing procedural irregularities
    and insufficient clarity in the award.
  source: IndicLegalQA
  file: 2020_balwant_singh_d_lr_v_dungar_singh_d_lrs_2020_1_609_615.pdf
- query: How did the High Court rule on the arbitral award in the appeal filed by Dungar Singh?
  case_id: balwant_singh_2020
  paragraphs: []
  answer: The High Court overturned the District Judge's decision, holding that the arbitral award was valid, clear, and made
    with mutual consent, and declared it as a rule of the court.
  source: IndicLegalQA
  file: 2020_balwant_singh_d_lr_v_dungar_singh_d_lrs_2020_1_609_615.pdf
- query: What issue regarding arbitration law was raised in the case of Balwant Singh vs. Dungar Singh?
  case_id: balwant_singh_2020
  paragraphs: []
  answer: The interpretive issue was whether an arbitral award made by close relatives of the parties could be considered
    unbiased and valid when no allegations of misconduct were raised against the arbitrators.
  source: IndicLegalQA
  file: 2020_balwant_singh_d_lr_v_dungar_singh_d_lrs_2020_1_609_615.pdf
- query: What impact does this judgment have on family property disputes resolved through arbitration?
  case_id: balwant_singh_2020
  paragraphs: []
  answer: This judgment reinforces the validity of arbitral awards made with mutual consent and encourages the resolution
    of family property disputes through arbitration.
  source: IndicLegalQA
  file: 2020_balwant_singh_d_lr_v_dungar_singh_d_lrs_2020_1_609_615.pdf
- query: What prediction did the Supreme Court make about re-auctioning public property based on value escalation?
  case_id: k_kumara_gupta_2022
  paragraphs: []
  answer: The Court cautioned that allowing re-auctions based on speculative value escalation could undermine the credibility
    and effectiveness of public auctions.
  source: IndicLegalQA
  file: 2022_k_kumara_gupta_v_sri_markendaya_sri_omkareswa_2022_8_968_990.pdf
- query: What clarification did the Supreme Court provide about the role of bidders in public auctions?
  case_id: k_kumara_gupta_2022
  paragraphs: []
  answer: The Court clarified that objections to auctions should only be raised by those who actively participated in the
    auction process and not by third parties with no involvement.
  source: IndicLegalQA
  file: 2022_k_kumara_gupta_v_sri_markendaya_sri_omkareswa_2022_8_968_990.pdf
- query: How did the Supreme Court address the issue of offers made by non-participants like Shri L. Kantha Rao?
  case_id: k_kumara_gupta_2022
  paragraphs: []
  answer: The Court ruled that offers made by non-participants after the auction cannot be used as a basis to set aside the
    auction, as it undermines the transparency and fairness of the process.
  source: IndicLegalQA
  file: 2022_k_kumara_gupta_v_sri_markendaya_sri_omkareswa_2022_8_968_990.pdf
- query: What was the Supreme Court's interpretation of the 1998 auction's legality?
  case_id: k_kumara_gupta_2022
  paragraphs: []
  answer: The Court found the 1998 auction to be conducted legally and transparently, with no evidence of fraud, irregularity,
    or collusion.
  source: IndicLegalQA
  file: 2022_k_kumara_gupta_v_sri_markendaya_sri_omkareswa_2022_8_968_990.pdf
- query: What was the primary legal issue in the case of B V Seshaiah vs. The State of Telangana & Anr.?
  case_id: b_v_seshaiah_2023
  paragraphs: []
  answer: The primary legal issue was the appeal against the High Court's decision to dismiss the revision petitions and confirm
    the conviction of the appellants under Section 138 of the Negotiable Instruments Act.
  source: IndicLegalQA
  file: 2023_b_v_seshaiah_v_state_of_telangana_2023_2_293_296.pdf
- query: What was the allegation against the appellants in the case of B V Seshaiah vs. The State of Telangana & Anr.?
  case_id: b_v_seshaiah_2023
  paragraphs: []
  answer: The allegation against the appellants was that they took money from Respondent No. 2 under the guise of making investments
    and made wrongful gains for their profits.
  source: IndicLegalQA
  file: 2023_b_v_seshaiah_v_state_of_telangana_2023_2_293_296.pdf
- query: What did the appellants and Respondent No. 2 agree upon during the course of the revision petition in the High Court?
  case_id: b_v_seshaiah_2023
  paragraphs: []
  answer: The appellants and Respondent No. 2 agreed to settle the dispute amicably through a Memorandum of Understanding,
    which included a clause for arbitration if the dispute was not resolved amicably.
  source: IndicLegalQA
  file: 2023_b_v_seshaiah_v_state_of_telangana_2023_2_293_296.pdf
- query: What was Clause 8 of the Memorandum of Understanding in the case of B V Seshaiah vs. The State of Telangana & Anr.?
  case_id: b_v_seshaiah_2023
  paragraphs: []
  answer: Clause 8 of the Memorandum of Understanding stated that any dispute should be resolved amicably, and if not, it
    should be referred to a sole arbitrator, whose decision would be final and binding.
  source: IndicLegalQA
  file: 2023_b_v_seshaiah_v_state_of_telangana_2023_2_293_296.pdf
- query: Why did the High Court dismiss the revision petitions in the case of B V Seshaiah vs. The State of Telangana & Anr.?
  case_id: b_v_seshaiah_2023
  paragraphs: []
  answer: The High Court dismissed the revision petitions and confirmed the conviction because Respondent No. 2 failed to
    file a compromise petition as agreed upon in the Memorandum of Understanding.
  source: IndicLegalQA
  file: 2023_b_v_seshaiah_v_state_of_telangana_2023_2_293_296.pdf
- query: What was the Supreme Court's view on the settlement between the parties in the case of B V Seshaiah vs. The State
    of Telangana & Anr.?
  case_id: b_v_seshaiah_2023
  paragraphs: []
  answer: The Supreme Court viewed the settlement as a compounding of the offence and stated that the appellants could not
    be convicted based on the orders of the lower courts when the parties had agreed to settle the dispute amicably or through
    arbitration.
  source: IndicLegalQA
  file: 2023_b_v_seshaiah_v_state_of_telangana_2023_2_293_296.pdf
- query: What precedent did the Supreme Court cite in its judgement in the case of B V Seshaiah vs. The State of Telangana
    & Anr.?
  case_id: b_v_seshaiah_2023
  paragraphs: []
  answer: The Supreme Court cited the case of M/S Meters and Instruments Private Limited & Anr. vs. Kanchan Mehta, which held
    that the nature of the offence under Section 138 of the Negotiable Instruments Act is primarily related to a civil wrong
    and is compoundable.
  source: IndicLegalQA
  file: 2023_b_v_seshaiah_v_state_of_telangana_2023_2_293_296.pdf
- query: What did the Supreme Court say about the High Court's role in overriding the compounding of offences in the case
    of B V Seshaiah vs. The State of Telangana & Anr.?
  case_id: b_v_seshaiah_2023
  paragraphs: []
  answer: The Supreme Court stated that the High Court cannot override the compounding of offences when the law clearly allows
    the parties to settle the dispute through such means.
  source: IndicLegalQA
  file: 2023_b_v_seshaiah_v_state_of_telangana_2023_2_293_296.pdf
- query: What was the outcome of the appeals in the case of B V Seshaiah vs. The State of Telangana & Anr.?
  case_id: b_v_seshaiah_2023
  paragraphs: []
  answer: The Supreme Court allowed the appeals, set aside the order of conviction passed by the trial court, and left it
    open for the parties to settle their dispute as per the terms of the Memorandum of Understanding.
  source: IndicLegalQA
  file: 2023_b_v_seshaiah_v_state_of_telangana_2023_2_293_296.pdf
- query: What responsibility did the Supreme Court place on Respondent No. 2 in the case of B V Seshaiah vs. The State of
    Telangana & Anr.?
  case_id: b_v_seshaiah_2023
  paragraphs: []
  answer: The Supreme Court noted that Respondent No. 2 was duty-bound to file a compromise petition before the High Court,
    and by failing to do so, he withheld key information that led to the unwarranted confirmation of the appellants' conviction.
  source: IndicLegalQA
  file: 2023_b_v_seshaiah_v_state_of_telangana_2023_2_293_296.pdf
- query: What was the primary legal issue in the case of Union of India vs. Leen Martin & Anr.?
  case_id: union_of_india_v_leen_martin_2018
  paragraphs: []
  answer: The primary legal issue was the appeal against the High Court's decision to acquit Leen Martin of charges under
    the Narcotic Drugs and Psychotropic Substances (NDPS) Act.
  source: IndicLegalQA
  file: 2018_union_of_india_v_leen_martin_2018_1_656_660.pdf
- query: What were the charges against Leen Martin in the case of Union of India vs. Leen Martin & Anr.?
  case_id: union_of_india_v_leen_martin_2018
  paragraphs: []
  answer: Leen Martin was charged under Sections 8(c), 20(b)(ii)(c), and 28 read with Section 23 of the NDPS Act for possession
    and attempted trafficking of narcotic substances.
  source: IndicLegalQA
  file: 2018_union_of_india_v_leen_martin_2018_1_656_660.pdf
- query: What did the trial court decide in the case of Union of India vs. Leen Martin & Anr.?
  case_id: union_of_india_v_leen_martin_2018
  paragraphs: []
  answer: The trial court convicted Leen Martin, sentencing him to 10 years of rigorous imprisonment and a fine of Rs. 1,00,000
    for each charge, to be served concurrently.
  source: IndicLegalQA
  file: 2018_union_of_india_v_leen_martin_2018_1_656_660.pdf
- query: What was the basis for the High Court's acquittal of Leen Martin in the case of Union of India vs. Leen Martin &
    Anr.?
  case_id: union_of_india_v_leen_martin_2018
  paragraphs: []
  answer: The High Court acquitted Leen Martin because it found that the prosecution failed to prove the presence of independent
    witnesses during the seizure, and the evidence presented was inconsistent and contradictory.
  source: IndicLegalQA
  file: 2018_union_of_india_v_leen_martin_2018_1_656_660.pdf
- query: What was the Supreme Court's view on the evidence presented by the prosecution in the case of Union of India vs.
    Leen Martin & Anr.?
  case_id: union_of_india_v_leen_martin_2018
  paragraphs: []
  answer: The Supreme Court found that the evidence from independent witnesses contradicted the statement of the Intelligence
    Officer, and there was no material to substantiate the case against Leen Martin beyond his retracted statement under Section
    67 of the NDPS Act.
  source: IndicLegalQA
  file: 2018_union_of_india_v_leen_martin_2018_1_656_660.pdf
- query: What did the Supreme Court conclude about the reliance on the statement of the official witness in the case of Union
    of India vs. Leen Martin & Anr.?
  case_id: union_of_india_v_leen_martin_2018
  paragraphs: []
  answer: The Supreme Court concluded that it was not safe to rely solely on the statement of the official witness (PW-1)
    for convicting Leen Martin, especially when independent witnesses provided a different account.
  source: IndicLegalQA
  file: 2018_union_of_india_v_leen_martin_2018_1_656_660.pdf
- query: Why did the Supreme Court uphold the High Court's acquittal of Leen Martin in the case of Union of India vs. Leen
    Martin & Anr.?
  case_id: union_of_india_v_leen_martin_2018
  paragraphs: []
  answer: The Supreme Court upheld the High Court's acquittal because the prosecution failed to prove its case beyond reasonable
    doubt, and the independent witnesses' statements contradicted the official witness's account.
  source: IndicLegalQA
  file: 2018_union_of_india_v_leen_martin_2018_1_656_660.pdf
- query: What did the Supreme Court note about Leen Martin's incarceration in the case of Union of India vs. Leen Martin &
    Anr.?
  case_id: union_of_india_v_leen_martin_2018
  paragraphs: []
  answer: The Supreme Court noted that Leen Martin had already undergone four and a half years of incarceration and was not
    in the country at the time of the appeal.
  source: IndicLegalQA
  file: 2018_union_of_india_v_leen_martin_2018_1_656_660.pdf
- query: What was the outcome of the appeal in the case of Union of India vs. Leen Martin & Anr.?
  case_id: union_of_india_v_leen_martin_2018
  paragraphs: []
  answer: The Supreme Court dismissed the appeal, finding no reason to interfere with the High Court's order acquitting Leen
    Martin.
  source: IndicLegalQA
  file: 2018_union_of_india_v_leen_martin_2018_1_656_660.pdf
- query: What was the significance of the statements made by independent witnesses in the case of Union of India vs. Leen
    Martin & Anr.?
  case_id: union_of_india_v_leen_martin_2018
  paragraphs: []
  answer: The statements made by independent witnesses (PW-8 and PW-9) were significant because they contradicted the prosecution's
    account of the seizure and inspection, leading to doubts about the credibility of the evidence.
  source: IndicLegalQA
  file: 2018_union_of_india_v_leen_martin_2018_1_656_660.pdf
- query: What did the Supreme Court say about the statement made under Section 67 of the NDPS Act in the case of Union of
    India vs. Leen Martin & Anr.?
  case_id: union_of_india_v_leen_martin_2018
  paragraphs: []
  answer: The Supreme Court noted that the statement made under Section 67 of the NDPS Act by Leen Martin was retracted, and
    without corroborating evidence, it was not sufficient to convict him.
  source: IndicLegalQA
  file: 2018_union_of_india_v_leen_martin_2018_1_656_660.pdf
- query: What was the primary legal issue in the case of Satya Deo @ Bhoorey vs. State of Uttar Pradesh?
  case_id: satya_deo_bhoorey_2020
  paragraphs: []
  answer: The primary legal issue was whether Satya Deo was a juvenile at the time of the offence on 11th December 1981, impacting
    his conviction and sentence under the Juvenile Justice Act.
  source: IndicLegalQA
  file: 2020_satya_deo_bhoorey_v_state_of_uttar_pradesh_2020_12_128_150.pdf
- query: What were the charges against Satya Deo?
  case_id: satya_deo_bhoorey_2020
  paragraphs: []
  answer: Satya Deo was charged with the offence under Section 302 read with Section 34 of the Indian Penal Code for murder,
    resulting in life imprisonment.
  source: IndicLegalQA
  file: 2020_satya_deo_bhoorey_v_state_of_uttar_pradesh_2020_12_128_150.pdf
- query: What was the outcome of the trial court's decision in the case of Satya Deo @ Bhoorey vs. State of Uttar Pradesh?
  case_id: satya_deo_bhoorey_2020
  paragraphs: []
  answer: The trial court convicted Satya Deo and sentenced him to life imprisonment for the offence of murder.
  source: IndicLegalQA
  file: 2020_satya_deo_bhoorey_v_state_of_uttar_pradesh_2020_12_128_150.pdf
- query: What did the High Court decide in the appeal by Satya Deo in the case of Satya Deo @ Bhoorey vs. State of Uttar Pradesh?
  case_id: satya_deo_bhoorey_2020
  paragraphs: []
  answer: The High Court confirmed the conviction and sentence of Satya Deo.
  source: IndicLegalQA
  file: 2020_satya_deo_bhoorey_v_state_of_uttar_pradesh_2020_12_128_150.pdf
- query: What was the Supreme Court's direction regarding the inquiry into Satya Deo's age?
  case_id: satya_deo_bhoorey_2020
  paragraphs: []
  answer: The Supreme Court directed the trial court to conduct an inquiry to ascertain if Satya Deo was a juvenile on the
    date of the offence based on available records.
  source: IndicLegalQA
  file: 2020_satya_deo_bhoorey_v_state_of_uttar_pradesh_2020_12_128_150.pdf
- query: What was the result of the trial court's inquiry into Satya Deo's age?
  case_id: satya_deo_bhoorey_2020
  paragraphs: []
  answer: The trial court's inquiry determined that Satya Deo was 16 years, 7 months, and 26 days old on the date of the offence,
    based on school records and other documents.
  source: IndicLegalQA
  file: 2020_satya_deo_bhoorey_v_state_of_uttar_pradesh_2020_12_128_150.pdf
- query: How did the Supreme Court interpret the Juvenile Justice Act in relation to Satya Deo's age?
  case_id: satya_deo_bhoorey_2020
  paragraphs: []
  answer: The Supreme Court interpreted that under the Juvenile Justice Act, 2000, Satya Deo, being less than 18 years old
    at the time of the offence, should be treated as a juvenile.
  source: IndicLegalQA
  file: 2020_satya_deo_bhoorey_v_state_of_uttar_pradesh_2020_12_128_150.pdf
- query: What did the Supreme Court decide regarding Satya Deo's sentence?
  case_id: satya_deo_bhoorey_2020
  paragraphs: []
  answer: The Supreme Court set aside Satya Deo's life imprisonment sentence and directed that he be treated as a juvenile,
    with the case remitted to the Juvenile Justice Board for appropriate orders.
  source: IndicLegalQA
  file: 2020_satya_deo_bhoorey_v_state_of_uttar_pradesh_2020_12_128_150.pdf
- query: What directions did the Supreme Court give to the Juvenile Justice Board in the case of Satya Deo @ Bhoorey vs. State
    of Uttar Pradesh?
  case_id: satya_deo_bhoorey_2020
  paragraphs: []
  answer: The Supreme Court directed the Juvenile Justice Board to pass appropriate orders regarding Satya Deo's detention
    and custody and to determine the appropriate quantum of fine and compensation for the family of the deceased.
  source: IndicLegalQA
  file: 2020_satya_deo_bhoorey_v_state_of_uttar_pradesh_2020_12_128_150.pdf
- query: What was the significance of the Constitutional Bench decision in Pratap Singh's case?
  case_id: satya_deo_bhoorey_2020
  paragraphs: []
  answer: The Constitutional Bench decision in Pratap Singh's case established that the date of the offence is the determining
    factor for juvenility, influencing the Supreme Court's decision to treat Satya Deo as a juvenile.
  source: IndicLegalQA
  file: 2020_satya_deo_bhoorey_v_state_of_uttar_pradesh_2020_12_128_150.pdf
- query: What was the initial cause of the FIR against Dilawar in the case of Dilawar vs. The State of Haryana?
  case_id: dilawar_2018
  paragraphs: []
  answer: The FIR was registered alleging mob violence during the 'Jat agitation' on 27th February 2016, where Dilawar was
    accused of leading the mob involved in arson, loot, and burning of the house of a Cabinet Minister.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What actions were taken by the state police before the investigation was transferred to the CBI?
  case_id: dilawar_2018
  paragraphs: []
  answer: The state police completed the initial investigation and filed a chargesheet on 27th May 2016 before the Court.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: Why was the investigation of the case transferred to the CBI?
  case_id: dilawar_2018
  paragraphs: []
  answer: The investigation was transferred to the CBI along with several other cases on 30th September 2016, and the court
    proceedings were also transferred to the CBI Court at Panchkula.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What was the outcome of Dilawar's bail applications before the Additional Sessions Judge and the High Court?
  case_id: dilawar_2018
  paragraphs: []
  answer: Dilawar's bail application was dismissed by the Additional Sessions Judge on 12th July 2016 and by the High Court
    on 2nd December 2016.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What directive did the Supreme Court give when the case came up against the High Court's order denying bail?
  case_id: dilawar_2018
  paragraphs: []
  answer: The Supreme Court did not grant bail but directed that the trial be concluded as far as possible within six months.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What was the reason provided by the CBI for the delay in completing the investigation?
  case_id: dilawar_2018
  paragraphs: []
  answer: The CBI stated that the investigation was voluminous and time-consuming, and that they had taken over the case only
    on 6th October 2016, thus requiring more time to complete the investigation.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What did the Supreme Court observe about the time taken by the CBI for the investigation?
  case_id: dilawar_2018
  paragraphs: []
  answer: The Supreme Court observed that one and a half years had already passed since the CBI took over the investigation
    and emphasized the need for speedy investigation as part of the fundamental right of fair procedure under Article 21 of
    the Constitution.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What timeline did the Supreme Court set for the completion of the investigation and commencement of the trial?
  case_id: dilawar_2018
  paragraphs: []
  answer: The Supreme Court directed that the CBI must complete the investigation within the next two months and commence
    the trial by 10th July 2018, with the trial to be concluded by the end of the year.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What broader issue regarding investigations did the Supreme Court address in this case?
  case_id: dilawar_2018
  paragraphs: []
  answer: The Supreme Court addressed the issue of unduly long pending investigations and emphasized the need for timelines
    for completing investigations, highlighting the constitutional mandate for speedy trials and investigations.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What directions did the Supreme Court give regarding oversight mechanisms for timely investigations?
  case_id: dilawar_2018
  paragraphs: []
  answer: The Supreme Court directed the Ministry of Home Affairs to interact with Central and State investigating agencies
    to establish an oversight mechanism for timely investigations and to report back with data on pending investigations and
    an action plan by 30th June 2018.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What legal precedents did the Supreme Court reference regarding the right to a speedy investigation?
  case_id: dilawar_2018
  paragraphs: []
  answer: The Supreme Court referenced legal precedents such as Maneka Gandhi vs. Union of India, Hussainara Khatoon (I) vs.
    Home Secretary, State of Bihar, Abdul Rehman Antulay vs. R.S. Nayak, and P. Ramachandra Rao vs. State of Karnataka, which
    underline the constitutional mandate for speedy trials and investigations.
  source: IndicLegalQA
  file: 2018_dilawar_v_state_of_haryana_2018_5_655_661.pdf
- query: What is the case name and who are the appellants and respondents in this judgement?
